name: CD Pipeline

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag immagine per rollback (es: sha-1234567). Lascia vuoto per creare un nuovo tag.'
        required: false
        type: string

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/tickertracker-backend
          ghcr.io/${{ github.repository_owner }}/tickertracker-frontend
        tags: |
          type=sha,prefix=sha-,format=short
          type=ref,event=branch

    - name: Build and push backend image
      if: ${{ github.event.inputs.image_tag == '' }}
      uses: docker/build-push-action@v5
      with:
        context: ./Standalone-app-v1/backend
        file: ./Standalone-app-v1/backend/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/tickertracker-backend:${{ steps.meta.outputs.version }}
          ghcr.io/${{ github.repository_owner }}/tickertracker-backend:latest
        labels: ${{ steps.meta.outputs.labels }}

    - name: Build and push frontend image
      if: ${{ github.event.inputs.image_tag == '' }}
      uses: docker/build-push-action@v5
      with:
        context: ./Standalone-app-v1/frontend
        file: ./Standalone-app-v1/frontend/Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/tickertracker-frontend:${{ steps.meta.outputs.version }}
          ghcr.io/${{ github.repository_owner }}/tickertracker-frontend:latest
        labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: build-images
    if: github.ref == 'refs/heads/develop' || github.event.inputs.image_tag != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - name: Set Tag
      id: set-tag
      run: |
        if [ -n "${{ github.event.inputs.image_tag }}" ]; then
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=${{ needs.build-images.outputs.image_tag }}" >> $GITHUB_ENV
        fi
        
    - name: Deploy to Staging (Simulation/Hook)
      run: |
        echo "Deploying to staging environment using tag: $IMAGE_TAG"
        # Example of a deployment hook:
        # curl -X POST -d "{\"tag\": \"$IMAGE_TAG\"}" ${{ secrets.STAGING_DEPLOY_HOOK }}

  deploy-production:
    needs: build-images
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Set Tag
      id: set-tag
      run: |
        if [ -n "${{ github.event.inputs.image_tag }}" ]; then
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=${{ needs.build-images.outputs.image_tag }}" >> $GITHUB_ENV
        fi
        
    - name: Deploy to Production (Simulation/Hook)
      run: |
        echo "Deploying to production environment using tag: $IMAGE_TAG"
        # Example of a deployment hook:
        # curl -X POST -d "{\"tag\": \"$IMAGE_TAG\"}" ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
