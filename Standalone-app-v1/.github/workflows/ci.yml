name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
    - name: Install dependencies
      working-directory: ./Standalone-app-v1/backend
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install -r requirements-dev.txt
    - name: Run linting (Ruff)
      working-directory: ./Standalone-app-v1/backend
      run: |
        source .venv/bin/activate
        ruff check .
    - name: Run type checking (MyPy)
      working-directory: ./Standalone-app-v1/backend
      run: |
        source .venv/bin/activate
        mypy src/

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: tickertracker_test }
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s
        ports:
          - 6379:6379
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
    - name: Install dependencies
      working-directory: ./Standalone-app-v1/backend
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install -r requirements-dev.txt
    - name: Run tests with coverage
      working-directory: ./Standalone-app-v1/backend
      env:
        DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/tickertracker_test
        REDIS_URL: redis://localhost:6379/0
      run: |
        source .venv/bin/activate
        pytest --cov=src --cov-report=xml tests/
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./Standalone-app-v1/backend/coverage.xml
        flags: backend

  backend-security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@0.20.0
      with:
        scan-type: 'fs'
        scan-ref: './Standalone-app-v1/backend'
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
    - name: Install dependencies
      working-directory: ./Standalone-app-v1/frontend
      run: npm ci
    - name: Run ESLint
      working-directory: ./Standalone-app-v1/frontend
      run: npm run lint
    - name: Run TypeScript check
      working-directory: ./Standalone-app-v1/frontend
      run: npx tsc --noEmit

  frontend-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
    - name: Install dependencies
      working-directory: ./Standalone-app-v1/frontend
      run: npm ci
    - name: Run tests with coverage
      working-directory: ./Standalone-app-v1/frontend
      run: npm run test -- --run --coverage
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./Standalone-app-v1/frontend/coverage/lcov.info
        flags: frontend

  e2e-test:
    needs: [backend-test, frontend-test, backend-lint, frontend-lint]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Start Production Environment
      working-directory: ./Standalone-app-v1
      run: |
        docker compose -f docker-compose.prod.yml up -d --build
        # Attendiamo l'healthcheck
        sleep 30
      env:
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
        POSTGRES_DB: tickertracker_test
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install frontend dependencies
      working-directory: ./Standalone-app-v1/frontend
      run: npm ci
    - name: Install Playwright Browsers
      working-directory: ./Standalone-app-v1
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      working-directory: ./Standalone-app-v1
      run: npx playwright test
      env:
        ENVIRONMENT: production
        VITE_API_BASE_URL: "http://localhost:80"
    - name: Ensure containers shutdown
      if: always()
      working-directory: ./Standalone-app-v1
      run: docker compose -f docker-compose.prod.yml down -v
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: Standalone-app-v1/playwright-report/
        retention-days: 30
