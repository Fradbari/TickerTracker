name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install backend dependencies
      working-directory: ./Standalone-app-v1/backend
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    - name: Run backend formatting and tests
      working-directory: ./Standalone-app-v1/backend
      run: |
        source .venv/bin/activate
        pytest tests/

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
    - name: Install frontend dependencies
      working-directory: ./Standalone-app-v1/frontend
      run: npm ci
    - name: Run frontend tests
      working-directory: ./Standalone-app-v1/frontend
      run: npm run test -- --run

  e2e:
    needs: [backend-tests, frontend-tests]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install backend dependencies
      working-directory: ./Standalone-app-v1/backend
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
    - name: Install frontend dependencies
      working-directory: ./Standalone-app-v1/frontend
      run: npm ci
    - name: Install Playwright Browsers
      working-directory: ./Standalone-app-v1/frontend
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      working-directory: ./Standalone-app-v1
      run: npx playwright test
      env:
        ENVIRONMENT: local
        VITE_API_BASE_URL: "http://localhost:8000"
    - name: Upload Playwright report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: playwright-report
        path: Standalone-app-v1/playwright-report/
        retention-days: 30
