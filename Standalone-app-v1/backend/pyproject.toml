[tool.poetry]
name = "tickertracker-backend"
version = "3.0.0"
description = "Trading estimates tracking system with DDD/CQRS/Event Sourcing"
authors = ["Francesco Di Lecce <francesco@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
# Core FastAPI - Updated for Python 3.12+
fastapi = "^0.115.5"
uvicorn = {extras = ["standard"], version = "^0.32.1"}
pydantic = "^2.10.3"
pydantic-settings = "^2.6.1"

# Database & ORM - Updated versions
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.30.0"
alembic = "^1.14.0"

# Cache & Messaging
redis = "^5.2.1"

# Market Data Providers
yfinance = "^1.1.0"
finnhub-python = {version = "^2.4.19", optional = true}

# Google Drive Integration - Updated versions
google-api-python-client = "^2.155.0"
google-auth = "^2.37.0"
google-auth-oauthlib = "^1.2.1"
google-auth-httplib2 = "^0.2.0"

# Security & Encryption - Updated for Python 3.13 support
cryptography = "^44.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}

# Background Jobs & Scheduling
apscheduler = "^3.10.4"

# Observability (Fase 2) - Updated versions
structlog = "^24.4.0"
prometheus-client = "^0.21.0"

# Rate Limiting (Fase 2)
slowapi = "^0.1.9"

# Utilities - Updated versions
python-multipart = "^0.0.18"
cachetools = "^5.5.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.4"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.1"
faker = "^33.1.0"
hypothesis = "^6.131.0"

# Code Quality
ruff = "^0.8.4"
mypy = "^1.13.0"
black = "^24.10.0"

[tool.poetry.extras]
finnhub = ["finnhub-python"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["E501", "B008"]
exclude = ["migrations", "alembic"]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::RuntimeWarning:greenlet"
]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "chaos: Chaos engineering tests",
    "properties: Property-based tests"
]

[tool.coverage.run]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
