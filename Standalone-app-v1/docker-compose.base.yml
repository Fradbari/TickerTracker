version: '3.8'

services:
  db:
    image: postgres:16
    container_name: tickertracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tickertracker
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: tickertracker_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tickertracker" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ticker-network

  redis:
    image: redis:7-alpine
    container_name: tickertracker-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - ticker-network

volumes:
  postgres-data:
  redis-data:


networks:
  ticker-network:
    driver: bridge
    name: ticker-network
    labels:
      - "com.tickertracker.environment=development"
      - "com.tickertracker.component=infrastructure"
