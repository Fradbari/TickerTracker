version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: tickertracker
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: tickertracker_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickertracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticker-network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ticker-network

volumes:
  postgres-data:
  redis-data:

networks:
  ticker-network:
    driver: bridge
