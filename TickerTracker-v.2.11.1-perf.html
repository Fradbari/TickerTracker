            return (<svg className="w-full h-auto" viewBox={`0 0 ${W} ${H}`} role="img" aria-label="Storico leader affidabilità">
              {[0, 50, 100].map((g, i) => (<g key={i}><line x1={P.l} x2={P.l + pw} y1={y(g)} y2={y(g)} stroke="#ffffff10" /><text x={P.l - 6} y={y(g) + 3} textAnchor="end" fill="#94a3b8" fontSize="9">{g}</text></g>))}
              <polyline points={pts.map((s, i) => `${x(i)},${y(s.mostReliableRaw.score)}`).join(' ')} fill="none" stroke="#34d399" strokeWidth="2.5" />
              {pts.map((s, i) => (<circle key={i} cx={x(i)} cy={y(s.mostReliableRaw.score)} r="3" fill="#34d399"><title>{`${s.date}: ${s.mostReliableRaw.ai} · score ${s.mostReliableRaw.score.toFixed(1)}${s.mostProfitable ? ` · più profitto ${s.mostProfitable.ai} (€${s.mostProfitable.totalPL.toFixed(0)})` : ''}`}</title></circle>))}
              <text x={P.l} y={H - 6} fill="#94a3b8" fontSize="9">{pts[0].date}</text>
              <text x={P.l + pw} y={H - 6} textAnchor="end" fill="#94a3b8" fontSize="9">{pts[pts.length - 1].date}</text>
              <text x={P.l + pw / 2} y={H - 6} textAnchor="middle" fill="#34d399" fontSize="9">score leader affidabilità ({pts.length} giorni)</text>
            </svg>);
          };
          return function Insights({ estimates, snapshots = [], onSaveSnapshot }) {
            const rows = React.useMemo(() => (Array.isArray(estimates) ? estimates : []), [estimates]);
            const closed = rows.filter(isClosed);
            const [rollN, setRollN] = React.useState(20);
            const [showVersion, setShowVersion] = React.useState(false);
            const [bootData, setBootData] = React.useState(null);
            const runBootstrap = React.useCallback(() => {
              const res = byRaw.map((a, i) => ({ ai: a.ai, color: PALETTE[i % PALETTE.length], boot: bootstrapWin(rows.filter(e => (e.aiName || 'N/D') === a.ai), 1000) }));
              setBootData(res);
            }, [byRaw, rows]);
            const perAI = React.useMemo(() => {
              const g = groupBy(rows, e => e.aiName || 'N/D');
              return Object.entries(g).map(([ai, arr]) => {
                const p = perf(arr); const rs = reliabilityScore(arr); const ma = marketAdjScore(arr);
                const nCl = arr.filter(isClosed).length; const nWin = arr.filter(isClosed).filter(isWin).length;
                const w = wilson(nWin, nCl); const bt = binomTest(nWin, nCl); const dt = dirTiming(arr); const ca = confAnalysis(arr);
                return { ai, n: arr.length, ...p, ...rs, marketScore: ma ? ma.score : null, shrunkBeat: ma ? ma.shrunkBeat : null, wilson: w, binom: bt, dt, ca };
              });
            }, [rows]);
            const byRaw = [...perAI].sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
            const byAlpha = [...perAI].filter(a => a.marketScore !== null).sort((a, b) => b.marketScore - a.marketScore);
            const marketRegime = React.useMemo(() => {
              const bh = closed.map(buyHold).filter(x => x !== null);
              return { avgBH: bh.length ? MEAN(bh) : null, n: bh.length };
            }, [closed]);
            const timeSeries = React.useMemo(() => {
              const g = groupBy(closed.filter(e => e.endDate), e => e.aiName || 'N/D');
              const winSeries = []; const alphaSeries = []; const stability = {};
              Object.entries(g).forEach(([ai, arr], idx) => {
                const byQ = groupBy(arr, e => quarterKey(e.endDate));
                const qs = Object.keys(byQ).sort();
                const wPts = qs.map(q => ({ t: q, v: byQ[q].filter(isWin).length / byQ[q].length * 100 }));
                const aPts = qs.map(q => { const av = byQ[q].map(alphaOf).filter(x => x !== null); return { t: q, v: 50 + (av.length ? MEAN(av) : 0) * 5 }; });
                const color = PALETTE[idx % PALETTE.length];
                if (wPts.length) { winSeries.push({ name: ai, color, points: wPts }); alphaSeries.push({ name: ai, color, points: aPts }); }
                stability[ai] = { periods: qs.length, winStd: STD(wPts.map(p => p.v)), color };
              });
              return { winSeries, alphaSeries, stability };
            }, [closed]);
            // Q2 estesa: drift halves, rolling, version split
            const drift = React.useMemo(() => byRaw.map((a, i) => ({ ai: a.ai, color: PALETTE[i % PALETTE.length], ...driftHalves(rows.filter(e => (e.aiName || 'N/D') === a.ai)) })), [byRaw, rows]);
            const rollingSeries = React.useMemo(() => {
              const g = groupBy(closed.filter(e => e.endDate), e => e.aiName || 'N/D');
              return Object.entries(g).map(([ai, arr], idx) => ({ name: ai, color: PALETTE[idx % PALETTE.length], points: rollingWin(arr, rollN) })).filter(s => s.points.length);
            }, [closed, rollN]);
            const versionSplit = React.useMemo(() => byRaw.map((a, i) => ({ ai: a.ai, color: PALETTE[i % PALETTE.length], versions: byPromptVersion(rows.filter(e => (e.aiName || 'N/D') === a.ai)) })).filter(x => x.versions.length > 1), [byRaw, rows]);
            const backdrop = React.useMemo(() => marketBackdrop(rows), [rows]);
            const marketCorr = React.useMemo(() => timeSeries.winSeries.map(s => ({ ai: s.name, color: s.color, corr: corrWithMarket(s.points, backdrop) })), [timeSeries, backdrop]);

            const integrity = React.useMemo(() => auditIntegrity(rows), [rows]);

            const validity = React.useMemo(() => byRaw.map(a => {
              const n = a.nClosed;
              const adequacy = n >= 30 ? 'alta' : n >= 15 ? 'media' : 'bassa';
              const ciWidth = a.wilson.half === null ? null : a.wilson.half * 2;
              const sigAbove50 = a.wilson.lo !== null && a.wilson.lo > 50;
              const sigBelow50 = a.wilson.hi !== null && a.wilson.hi < 50;
              const binomSig = a.binom.level >= 95 && a.binom.dir === 'up';
              const trustworthy = n >= 15 && (a.ece === null || a.ece < 15) && (ciWidth === null || ciWidth < 40);
              return { ...a, adequacy, ciWidth, sigAbove50, sigBelow50, binomSig, trustworthy };
            }), [byRaw]);

            if (!rows.length) return <div className="glass rounded-2xl p-8 text-center animate-fade-in"><div className="text-5xl mb-3">🔬</div><p className="text-gray-300">Nessuna stima disponibile. Aggiungi o ripristina delle stime per abilitare le analisi di affidabilità.</p></div>;

            const bestRaw = byRaw.find(a => a.score !== null);
            const bestAlpha = byAlpha[0];
            const th = (t, r) => <th className={`p-2 text-xs uppercase text-gray-400 ${r ? 'text-right' : 'text-left'}`}>{t}</th>;
            const td = (v, r, tone) => { const c = tone === 'g' ? 'text-emerald-400' : tone === 'r' ? 'text-red-400' : tone === 'a' ? 'text-amber-400' : 'text-gray-200'; return <td className={`p-2 ${r ? 'text-right font-mono' : ''} ${c}`}>{v}</td>; };
            const rankChanged = bestRaw && bestAlpha && bestRaw.ai !== bestAlpha.ai;
            const nSignif = validity.filter(a => a.binomSig).length;
            const pFmt = p => p === null ? '—' : (p < 0.001 ? '<0.001' : p.toFixed(3));
            // === VERDETTO FINALE (live) ===
            const MIN_CLOSED_VERDICT = 15;
            const eligibleRaw = byRaw.filter(a => a.nClosed >= MIN_CLOSED_VERDICT && a.score !== null);
            const mostReliableRaw = eligibleRaw[0] || null;
            const eligibleAlpha = byAlpha.filter(a => a.nClosed >= MIN_CLOSED_VERDICT);
            const mostReliableAlpha = eligibleAlpha[0] || null;
            const mostProfitable = [...perAI].filter(a => a.nClosed >= 1).sort((a, b) => (b.totalPL || 0) - (a.totalPL || 0))[0] || null;
            const verdictRankDiffer = mostReliableRaw && mostReliableAlpha && mostReliableRaw.ai !== mostReliableAlpha.ai;
            const reliableSignificant = mostReliableRaw && mostReliableRaw.binom && mostReliableRaw.binom.level >= 95 && mostReliableRaw.binom.dir === 'up';
            const todayStr = new Date().toISOString().slice(0, 10);
            const hasTodaySnap = (snapshots || []).some(s => s.date === todayStr);

            return (

          const applyBulkEstimateUpdates = useCallback(async (nextEstimates, { logEntries = [] } = {}) => { const sanitizedEstimates = (Array.isArray(nextEstimates) ? nextEstimates : []).map(stripHistoricalPayloadFromEstimate); const normalizedLogs = (Array.isArray(logEntries) ? logEntries : []).map((entry, index) => normalizeLogEntry({ timestamp: entry.timestamp || new Date().toISOString(), type: entry.type || 'info', ...entry }, index)); const combinedLogs = normalizedLogs.length > 0 ? [...logs, ...normalizedLogs].slice(-499) : logs; skipNextEstimatePersistRef.current += 1; setEstimates(sanitizedEstimates); if (normalizedLogs.length > 0) { skipNextLogsPersistRef.current += 1; setLogs(combinedLogs); normalizedLogs.forEach(entry => logToGASBatch(entry.message, entry.type === 'error' || entry.type === 'warning' ? entry.type : 'info')); } try { await idbSet(KV_STORE, sanitizedEstimates, 'estimates'); if (normalizedLogs.length > 0) await idbSet(KV_STORE, combinedLogs, 'logs'); await idbSet(KV_STORE, { version: APP_STORAGE_VERSION, migratedAt: new Date().toISOString(), migratedFromLocalStorage: false }, 'storageMeta'); await refreshStorageDiagnostics({ estimates: sanitizedEstimates, logs: combinedLogs }); } catch (error) { console.error('Errore applyBulkEstimateUpdates', error); } }, [logs, refreshStorageDiagnostics]);
          const handleRemoveEstimate = useCallback(async (id, skipConfirm = false) => { if (skipConfirm || confirm('Eliminare questa stima?')) { const removed = estimates.find(e => e.id === id); setEstimates(prev => prev.filter(e => e.id !== id)); try { await deleteEstimateArtifact(id); } catch (error) { console.warn('Errore eliminazione artifact', error); } addLog(removed ? `Stima rimossa ${removed.ticker}` : 'Stima rimossa', 'warning', { category: 'estimate', action: 'Stima rimossa', ticker: removed?.ticker || '', detail: removed ? `Versione v${removed.version}` : '' }); } }, [addLog, estimates]);

          const handleSaveKey = (type) => { if (type === 'finnhub') localStorage.setItem('finnhubApiKey', finnhubKey); else if (type === 'gemini') localStorage.setItem('geminiApiKey', geminiKey); }; const handleClearData = async () => { if (confirm('CANCELLARE TUTTO?')) { try { setEstimates([]); setLogs([]); setChatMessages([defaultChatMessage]); await clearAppIndexedDB(); } catch (error) { console.error('Errore reset storage', error); } localStorage.clear(); location.reload(); } }; const handleDownloadLogs = () => { const text = logs.map(l => { const head = `[${new Date(l.timestamp).toLocaleString()}] [${l.type.toUpperCase()}]${l.event ? ` (${l.event})` : ''} ${l.ticker ? `[${l.ticker}] ` : ''}${l.action || l.message}${l.detail ? ` - ${l.detail}` : ''}`; const d = l.debug || {}; const parts = []; if (d.source) parts.push(`src=${d.source}`); if (d.endpoint) parts.push(`endpoint=${d.endpoint}`); if (d.httpStatus != null) parts.push(`http=${d.httpStatus}`); if (d.durationMs != null) parts.push(`dur=${d.durationMs}ms`); if (d.context) { try { parts.push(`ctx=${JSON.stringify(d.context)}`); } catch (e) {} } if (d.stack) parts.push(`stack=${d.stack}`); return head + (parts.length ? `\n    ↳ ${parts.join(' | ')}` : ''); }).join('\n'); const blob = new Blob([text], { type: 'text/plain' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `logs_${Date.now()}.txt`; a.click(); };
          const getAppData = useCallback(async () => { const artifacts = await idbGetAll(ARTIFACT_STORE); return { version: '4.3.1-idb-perf-logux-chatfix', timestamp: new Date().toISOString(), estimates, logs, chatMessages, artifacts, insightsSnapshots, storageDiagnostics, config: { finnhubKey, geminiKey, gasUrl: localStorage.getItem('gasUrl') || '', autoRefresh, yahooCookie: localStorage.getItem('yahooCookie') || '', yahooCrumb: localStorage.getItem('yahooCrumb') || '', defaultSettings: localStorage.getItem('defaultSettings') || '' } }; }, [estimates, logs, chatMessages, insightsSnapshots, storageDiagnostics, finnhubKey, geminiKey, autoRefresh]);
          const downloadBackup = async () => { const payload = await getAppData(); const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'stock_tracker_backup_complete.json'; a.click(); };
          const applyRestoredData = async (data) => { try { const restoredEstimatesRaw = Array.isArray(data.estimates) ? data.estimates : []; const restoredLogs = Array.isArray(data.logs) ? data.logs.map((entry, index) => normalizeLogEntry(entry, index)) : []; const restoredChatMessages = Array.isArray(data.chatMessages) && data.chatMessages.length > 0 ? data.chatMessages : [defaultChatMessage]; await idbClearStore(KV_STORE); await idbClearStore(ARTIFACT_STORE); let restoredEstimates = restoredEstimatesRaw.map(stripHistoricalPayloadFromEstimate); if (Array.isArray(data.artifacts) && data.artifacts.length > 0) for (const artifact of data.artifacts) await idbSet(ARTIFACT_STORE, artifact); else restoredEstimates = await compactEstimatesAndArtifacts(restoredEstimatesRaw); await idbSet(KV_STORE, restoredEstimates, 'estimates'); await idbSet(KV_STORE, restoredLogs, 'logs'); await idbSet(KV_STORE, restoredChatMessages, 'chatMessages'); await idbSet(KV_STORE, { version: APP_STORAGE_VERSION, migratedAt: new Date().toISOString(), migratedFromLocalStorage: false }, 'storageMeta'); skipNextEstimatePersistRef.current += 1; skipNextLogsPersistRef.current += 1; skipNextChatPersistRef.current += 1; setEstimates(Array.isArray(restoredEstimates) ? restoredEstimates.map(stripHistoricalPayloadFromEstimate) : []); setLogs(restoredLogs); setChatMessages(restoredChatMessages); if (data.config) { if (data.config.finnhubKey !== undefined) { setFinnhubKey(data.config.finnhubKey || ''); if (data.config.finnhubKey) localStorage.setItem('finnhubApiKey', data.config.finnhubKey); else localStorage.removeItem('finnhubApiKey'); } if (data.config.geminiKey !== undefined) { setGeminiKey(data.config.geminiKey || ''); if (data.config.geminiKey) localStorage.setItem('geminiApiKey', data.config.geminiKey); else localStorage.removeItem('geminiApiKey'); } if (data.config.gasUrl !== undefined) { if (data.config.gasUrl) localStorage.setItem('gasUrl', data.config.gasUrl); else localStorage.removeItem('gasUrl'); } if (data.config.autoRefresh !== undefined) setAutoRefresh(Number(data.config.autoRefresh) || 0); if (data.config.yahooCookie !== undefined) { if (data.config.yahooCookie) localStorage.setItem('yahooCookie', data.config.yahooCookie); else localStorage.removeItem('yahooCookie'); } if (data.config.yahooCrumb !== undefined) { if (data.config.yahooCrumb) localStorage.setItem('yahooCrumb', data.config.yahooCrumb); else localStorage.removeItem('yahooCrumb'); } if (data.config.defaultSettings) localStorage.setItem('defaultSettings', data.config.defaultSettings); } if (Array.isArray(data.insightsSnapshots)) { await idbSet(KV_STORE, data.insightsSnapshots, 'insightsSnapshots'); setInsightsSnapshots(data.insightsSnapshots); } await refreshStorageDiagnostics({ estimates: restoredEstimates, logs: restoredLogs, chatMessages: restoredChatMessages }); return true; } catch (error) { console.error('Errore applyRestoredData', error); return false; } };
          const handleRestore = (e) => { const file = e.target.files?.[0]; if (!file) return; const reader = new FileReader(); reader.onload = async (ev) => { try { const data = JSON.parse(ev.target.result); if (await applyRestoredData(data)) addLog('Backup locale ripristinato', 'success', { category: 'cloud', action: 'Backup ripristinato', detail: file.name, event: 'restore' }); else addLog('Errore struttura backup', 'error', { category: 'error', action: 'Restore fallito', detail: file.name }); } catch (error) { alert('Errore nel file di backup'); } }; reader.readAsText(file); }; const onDriveRestore = async (data) => { if (await applyRestoredData(data)) addLog('Backup cloud ripristinato', 'success', { category: 'cloud', action: 'Backup cloud ripristinato', detail: 'Google Drive', event: 'restore' }); else addLog('Errore restore Cloud', 'error', { category: 'error', action: 'Restore cloud fallito', detail: 'Google Drive' }); }; const compactStorage = useCallback(async () => { const compacted = await compactEstimatesAndArtifacts(estimates); skipNextEstimatePersistRef.current += 1; setEstimates(compacted); await idbSet(KV_STORE, compacted, 'estimates'); await idbSet(KV_STORE, { version: APP_STORAGE_VERSION, migratedAt: new Date().toISOString(), migratedFromLocalStorage: false }, 'storageMeta'); await refreshStorageDiagnostics({ estimates: compacted }); addLog('Compattazione storage eseguita', 'success', { category: 'storage', action: 'Compattazione storage', detail: `${compacted.length} stime ottimizzate` }); return compacted; }, [estimates, refreshStorageDiagnostics, addLog]);

          const handleSaveInsightsSnapshot = useCallback(async () => { try { const snaps = await upsertDailyInsightsSnapshot(estimates, { force: true }); if (snaps) setInsightsSnapshots(snaps); addLog('Snapshot Insights salvato', 'success', { category: 'system', action: 'Snapshot Insights', detail: 'Verdetto giornaliero aggiornato manualmente', event: 'insights-snapshot' }); } catch (e) { console.warn('Snapshot manuale fallito', e); } }, [estimates, addLog]);
          const tabs = [{ id: 'dashboard', icon: '🏠', label: 'Dashboard' }, { id: 'input', icon: '📊', label: 'Inserimento' }, { id: 'estimates', icon: '📈', label: 'Stime' }, { id: 'stats', icon: '📉', label: 'Global Stats' }, { id: 'insights', icon: '🔬', label: 'Insights' }, { id: 'chat', icon: '💬', label: 'IA Chat' }, { id: 'logs', icon: '📝', label: 'Log' }, { id: 'settings', icon: '⚙️', label: 'Setup' }]; const btnClass = 'px-4 py-2 rounded-lg font-semibold transition-all duration-300 transform hover:-translate-y-0.5'; const activeTabClass = 'bg-gradient-to-r from-accent-blue to-accent-purple text-white shadow-lg shadow-accent-blue/30'; const inactiveTabClass = 'text-gray-400 hover:text-white hover:bg-white/5'; if (!storageReady) return <div className="min-h-screen bg-background text-gray-200 flex items-center justify-center"><div className="glass rounded-2xl p-8 text-center space-y-3"><div className="text-4xl animate-spin">⏳</div><div className="text-xl font-bold text-white">Inizializzazione archivio locale</div><div className="text-sm text-gray-400">Migrazione dati verso IndexedDB in corso...</div></div></div>; return <div className="min-h-screen bg-background text-gray-200 pb-20"><MobileNav activeTab={activeTab} setActiveTab={setActiveTab} isOpen={mobileMenuOpen} setIsOpen={setMobileMenuOpen} /><header className="pt-8 pb-4 px-4 text-center"><h1 className="text-3xl md:text-4xl font-bold gradient-text mb-1">AI Stock Tracker Pro</h1><p className="text-gray-500 text-sm">Monitoraggio performance modelli predittivi • Storage v{APP_STORAGE_VERSION}</p></header><PortfolioWidget estimates={estimates} /><div className="container mx-auto px-4 mb-6"><div className="hidden md:flex flex-wrap justify-center gap-2 border-b border-gray-800 pb-4">{tabs.map(tab => <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`${btnClass} ${activeTab === tab.id ? activeTabClass : inactiveTabClass}`}>{tab.icon} {tab.label}</button>)}</div></div><main className="container mx-auto px-4 max-w-6xl">{activeTab === 'dashboard' && <Dashboard estimates={estimates} switchTab={setActiveTab} />}{activeTab === 'input' && <EstimateForm onAdd={handleAddEstimate} onRemove={handleRemoveEstimate} onLog={addLog} finnhubKey={finnhubKey} isOnline={!!finnhubKey} switchTab={setActiveTab} estimates={estimates} />}{activeTab === 'estimates' && <EstimateList estimates={estimates} onUpdateEstimate={handleUpdateEstimate} onBulkUpdateEstimates={applyBulkEstimateUpdates} onRemove={handleRemoveEstimate} onLog={addLog} autoRefresh={autoRefresh} setAutoRefresh={setAutoRefresh} />}{activeTab === 'stats' && <Stats estimates={estimates} />}{activeTab === 'insights' && <Insights estimates={estimates} snapshots={insightsSnapshots} onSaveSnapshot={handleSaveInsightsSnapshot} />}{activeTab === 'chat' && <Chatbot geminiKey={geminiKey} estimates={estimates} messages={chatMessages} setMessages={setChatMessages} onClear={handleClearChat} />}{activeTab === 'logs' && <Logs logs={logs} onClear={() => setLogs([])} onDownload={handleDownloadLogs} />}{activeTab === 'settings' && <Settings finnhubKey={finnhubKey} setFinnhubKey={setFinnhubKey} geminiKey={geminiKey} setGeminiKey={setGeminiKey} onSaveKey={handleSaveKey} downloadBackup={downloadBackup} handleRestore={handleRestore} handleClearData={handleClearData} getAppData={getAppData} onDriveRestore={onDriveRestore} onLog={addLog} storageDiagnostics={storageDiagnostics} refreshStorageDiagnostics={refreshStorageDiagnostics} compactStorage={compactStorage} />}</main></div>;
