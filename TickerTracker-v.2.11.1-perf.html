<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Stock Tracker Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              background: '#1a1a2e',
              surface: '#16213e',
              primary: '#0f3460',
              accent: '#e94560',
              'accent-blue': '#667eea',
              'accent-purple': '#764ba2',
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-in': 'slideIn 0.3s ease-out',
              'slide-up': 'slideUp 0.4s ease-out',
              'pulse-slow': 'pulse 3s infinite',
              'bounce-subtle': 'bounceSubtle 2s infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              slideIn: {
                '0%': { opacity: '0', transform: 'translateX(-20px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              bounceSubtle: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-5px)' },
              }
            }
          },
        },
      }
    </script>

    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@19.2.1",
        "react-dom/client": "https://aistudiocdn.com/react-dom@19.2.1/client",
        "@google/genai": "https://aistudiocdn.com/@google/genai@1.31.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@19.2.1/",
        "react/": "https://aistudiocdn.com/react@19.2.1/"
      }
    }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <style>
      body {
        background-color: #1a1a2e;
        color: #e0e0e0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: rgba(26, 26, 46, 0.5); }
      ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 4px; }
      
      /* Toast animations */
      @keyframes toastSlideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes toastSlideOut {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(100%); opacity: 0; }
      }
      .toast-enter { animation: toastSlideIn 0.3s ease-out forwards; }
      .toast-exit { animation: toastSlideOut 0.3s ease-out forwards; }
      
      /* Glassmorphism */
      .glass {
        background: rgba(22, 33, 62, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      /* Gradient text */
      .gradient-text {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #e94560 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      /* Pulsing dot */
      .pulse-dot {
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.2); }
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } from 'react';
        import { createRoot } from 'react-dom/client';
        import { GoogleGenAI } from "@google/genai";

        // --- CONSTANTS ---
        const AI_OPTIONS = ['Gemini', 'IA Studio', 'GPT', 'Claude', 'Kimi', 'Perplexity', 'DeepSeek', 'Copilot', 'Grok', 'Qwen'];
        const AI_ICONS = {
          'Gemini': '💎', 'IA Studio': '🎨', 'GPT': '🧠', 'Claude': '🤖',
          'Kimi': '🌙', 'Perplexity': '🔮', 'DeepSeek': '🔍', 'Copilot': '✈️',
          'Grok': '⚡', 'Qwen': '🐉'
        };
        const CORS_PROXIES = [
          'https://api.allorigins.win/raw?url=',
          'https://corsproxy.io/?',
          'https://api.codetabs.com/v1/proxy?quest='
        ];

        // --- SAFE NUMERIC / TICKER HELPERS (update finalization hardening) ---
        const toFiniteNumber = (value, fallback = null) => {
          if (typeof value === 'number' && Number.isFinite(value)) return value;
          if (value === null || value === undefined || value === '') return fallback;
          const parsed = Number(value);
          return Number.isFinite(parsed) ? parsed : fallback;
        };

        const isFiniteNumber = (value) => Number.isFinite(toFiniteNumber(value, NaN));

        const formatFixed = (value, digits = 2, fallback = 'N/A') => {
          const numericValue = toFiniteNumber(value, null);
          return numericValue === null ? fallback : numericValue.toFixed(digits);
        };

        const getYahooTickerCandidates = (ticker) => {
          const normalized = String(ticker || '').trim().toUpperCase();
          if (!normalized) return [];
          const candidates = [normalized];
          // Yahoo Finance usa il trattino per alcune class share USA: BF.B -> BF-B, BRK.B -> BRK-B.
          // Non convertire suffix di mercato europei come .PA, .DE, .MI, .AS, .L.
          if (/^[A-Z]{1,6}\.[A-Z]$/.test(normalized)) candidates.push(normalized.replace('.', '-'));
          return [...new Set(candidates)];
        };

        // --- TOAST CONTEXT ---
        const ToastContext = createContext();
        
        const ToastProvider = ({ children }) => {
          const [toasts, setToasts] = useState([]);
          
          const addToast = useCallback((message, type = 'info', duration = 4000) => {
            const id = Date.now() + Math.random();
            setToasts(prev => [...prev, { id, message, type, exiting: false }]);
            
            setTimeout(() => {
              setToasts(prev => prev.map(t => t.id === id ? { ...t, exiting: true } : t));
              setTimeout(() => {
                setToasts(prev => prev.filter(t => t.id !== id));
              }, 300);
            }, duration);
          }, []);
          
          const removeToast = useCallback((id) => {
            setToasts(prev => prev.map(t => t.id === id ? { ...t, exiting: true } : t));
            setTimeout(() => {
              setToasts(prev => prev.filter(t => t.id !== id));
            }, 300);
          }, []);
          
          return (
            <ToastContext.Provider value={{ addToast }}>
              {children}
              <div className="fixed top-4 right-4 z-[200] space-y-2 max-w-sm">
                {toasts.map(toast => (
                  <div 
                    key={toast.id} 
                    className={`${toast.exiting ? 'toast-exit' : 'toast-enter'} p-4 rounded-xl shadow-2xl flex items-start gap-3 cursor-pointer ${
                      toast.type === 'success' ? 'bg-emerald-600/90 border border-emerald-400/30' :
                      toast.type === 'error' ? 'bg-red-600/90 border border-red-400/30' :
                      toast.type === 'warning' ? 'bg-amber-600/90 border border-amber-400/30' :
                      'bg-blue-600/90 border border-blue-400/30'
                    } backdrop-blur-sm`}
                    onClick={() => removeToast(toast.id)}
                  >
                    <span className="text-xl">
                      {toast.type === 'success' ? '✅' : toast.type === 'error' ? '❌' : toast.type === 'warning' ? '⚠️' : 'ℹ️'}
                    </span>
                    <div className="flex-1 text-sm text-white font-medium">{toast.message}</div>
                  </div>
                ))}
              </div>
            </ToastContext.Provider>
          );
        };
        
        const useToast = () => useContext(ToastContext);

        // --- RENDER SAFETY + NATIVE SVG CHARTS ---
        // I grafici sono implementati con SVG nativo per evitare dipendenze runtime Recharts/React-context.
        class RootErrorBoundary extends React.Component {
          constructor(props) {
            super(props);
            this.state = { hasError: false, message: '' };
          }
          static getDerivedStateFromError(error) {
            return { hasError: true, message: error?.message || 'Errore rendering applicazione' };
          }
          componentDidCatch(error, info) {
            console.error('Root rendering error:', error, info);
          }
          clearLocalStateAndReload = async () => {
            try {
              localStorage.clear();
              if (window.indexedDB?.deleteDatabase) indexedDB.deleteDatabase('TickerTrackerProDB');
            } catch (error) {
              console.warn('Reset storage fallback failed:', error);
            }
            setTimeout(() => location.reload(), 300);
          };
          render() {
            if (this.state.hasError) {
              return (
                <div className="min-h-screen bg-background text-white flex items-center justify-center p-6">
                  <div className="max-w-xl glass rounded-2xl p-6 border border-red-500/30 text-center space-y-4">
                    <div className="text-5xl">🛠️</div>
                    <h1 className="text-2xl font-bold">Ripristino interfaccia richiesto</h1>
                    <p className="text-gray-300">L'app ha intercettato un errore di rendering invece di lasciare lo schermo vuoto.</p>
                    <pre className="text-left text-xs bg-black/30 p-3 rounded-lg overflow-auto text-red-200">{this.state.message}</pre>
                    <button onClick={this.clearLocalStateAndReload} className="px-5 py-3 rounded-xl bg-red-600 hover:bg-red-500 font-bold">Pulisci dati locali e ricarica</button>
                    <p className="text-xs text-gray-400">Dopo il reset potrai ripristinare nuovamente il backup.</p>
                  </div>
                </div>
              );
            }
            return this.props.children;
          }
        }

        const ChartEmptyState = ({ label = 'Nessun dato disponibile' }) => (
          <div className="h-full min-h-[180px] flex flex-col items-center justify-center rounded-xl border border-white/10 bg-black/20 text-gray-400 p-4 text-center">
            <div className="text-3xl mb-2">📊</div>
            <div className="font-medium">{label}</div>
          </div>
        );

        const truncateLabel = (value, max = 10) => {
          const text = String(value || 'N/A');
          return text.length > max ? `${text.slice(0, max - 1)}…` : text;
        };

        const SimpleAIProfitBarChart = ({ data = [] }) => {
          const chartData = (Array.isArray(data) ? data : [])
            .map(item => ({ name: String(item?.name || 'N/A'), profit: toFiniteNumber(item?.profit, 0) }))
            .filter(item => item.name);

          if (chartData.length === 0) return <ChartEmptyState label="Nessuna performance AI disponibile" />;

          const width = 760;
          const height = 220;
          const pad = { top: 18, right: 24, bottom: 48, left: 58 };
          const plotW = width - pad.left - pad.right;
          const plotH = height - pad.top - pad.bottom;
          const maxAbs = Math.max(1, ...chartData.map(item => Math.abs(item.profit)));
          const zeroY = pad.top + plotH / 2;
          const slot = plotW / chartData.length;
          const barW = Math.max(14, Math.min(46, slot * 0.55));

          return (
            <svg className="w-full h-full" viewBox={`0 0 ${width} ${height}`} role="img" aria-label="Performance per AI">
              <defs>
                <linearGradient id="profitPositive" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%" stopColor="#34d399" stopOpacity="0.95" />
                  <stop offset="100%" stopColor="#059669" stopOpacity="0.75" />
                </linearGradient>
                <linearGradient id="profitNegative" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%" stopColor="#fb7185" stopOpacity="0.95" />
                  <stop offset="100%" stopColor="#e11d48" stopOpacity="0.75" />
                </linearGradient>
              </defs>
              {[0, 0.25, 0.5, 0.75, 1].map((ratio, idx) => {
                const y = pad.top + plotH * ratio;
                return <line key={idx} x1={pad.left} x2={width - pad.right} y1={y} y2={y} stroke="#ffffff14" strokeDasharray={idx === 2 ? '0' : '4 4'} />;
              })}
              <line x1={pad.left} x2={width - pad.right} y1={zeroY} y2={zeroY} stroke="#94a3b8" strokeOpacity="0.45" />
              <text x={pad.left - 10} y={pad.top + 5} textAnchor="end" fill="#94a3b8" fontSize="11">€{formatFixed(maxAbs, 0, '0')}</text>
              <text x={pad.left - 10} y={zeroY + 4} textAnchor="end" fill="#94a3b8" fontSize="11">0</text>
              <text x={pad.left - 10} y={pad.top + plotH} textAnchor="end" fill="#94a3b8" fontSize="11">-€{formatFixed(maxAbs, 0, '0')}</text>
              {chartData.map((item, index) => {
                const x = pad.left + slot * index + (slot - barW) / 2;
                const barH = Math.max(2, Math.abs(item.profit) / maxAbs * (plotH / 2 - 8));
                const y = item.profit >= 0 ? zeroY - barH : zeroY;
                const fill = item.profit >= 0 ? 'url(#profitPositive)' : 'url(#profitNegative)';
                return (
                  <g key={`${item.name}-${index}`}>
                    <rect x={x} y={y} width={barW} height={barH} rx="5" fill={fill}>
                      <title>{`${item.name}: €${formatFixed(item.profit, 2, '0.00')}`}</title>
                    </rect>
                    <text x={x + barW / 2} y={item.profit >= 0 ? y - 6 : y + barH + 14} textAnchor="middle" fill={item.profit >= 0 ? '#6ee7b7' : '#fda4af'} fontSize="10" fontWeight="700">
                      {item.profit >= 0 ? '+' : ''}{formatFixed(item.profit, 0, '0')}
                    </text>
                    <text x={x + barW / 2} y={height - 20} textAnchor="middle" fill="#a5b4fc" fontSize="11">{truncateLabel(item.name, 8)}</text>
                  </g>
                );
              })}
            </svg>
          );
        };

        const SimplePerformanceOverviewChart = ({ data = [] }) => {
          const chartData = (Array.isArray(data) ? data : [])
            .map(item => ({ name: String(item?.name || 'N/A'), profit: toFiniteNumber(item?.profit, 0), success: toFiniteNumber(item?.success, 0) }))
            .filter(item => item.name);

          if (chartData.length === 0) return <ChartEmptyState label="Nessun dato statistico disponibile" />;

          const width = 860;
          const height = 260;
          const pad = { top: 22, right: 74, bottom: 54, left: 64 };
          const plotW = width - pad.left - pad.right;
          const plotH = height - pad.top - pad.bottom;
          const maxAbsProfit = Math.max(1, ...chartData.map(item => Math.abs(item.profit)));
          const slot = plotW / chartData.length;
          const barW = Math.max(14, Math.min(42, slot * 0.45));
          const zeroY = pad.top + plotH / 2;
          const yProfit = (profit) => zeroY - (profit / maxAbsProfit) * (plotH / 2 - 10);
          const ySuccess = (success) => pad.top + plotH - (Math.max(0, Math.min(100, success)) / 100) * plotH;
          const linePoints = chartData.map((item, index) => `${pad.left + slot * index + slot / 2},${ySuccess(item.success)}`).join(' ');

          return (
            <svg className="w-full h-full" viewBox={`0 0 ${width} ${height}`} role="img" aria-label="Performance overview AI">
              {[0, 0.25, 0.5, 0.75, 1].map((ratio, idx) => {
                const y = pad.top + plotH * ratio;
                return <line key={idx} x1={pad.left} x2={width - pad.right} y1={y} y2={y} stroke="#ffffff14" strokeDasharray={idx === 2 ? '0' : '4 4'} />;
              })}
              <line x1={pad.left} x2={width - pad.right} y1={zeroY} y2={zeroY} stroke="#94a3b8" strokeOpacity="0.45" />
              <text x={pad.left - 12} y={pad.top + 4} textAnchor="end" fill="#94a3b8" fontSize="11">€{formatFixed(maxAbsProfit, 0, '0')}</text>
              <text x={pad.left - 12} y={zeroY + 4} textAnchor="end" fill="#94a3b8" fontSize="11">0</text>
              <text x={pad.left - 12} y={pad.top + plotH} textAnchor="end" fill="#94a3b8" fontSize="11">-€{formatFixed(maxAbsProfit, 0, '0')}</text>
              <text x={width - pad.right + 12} y={pad.top + 4} fill="#818cf8" fontSize="11">100%</text>
              <text x={width - pad.right + 12} y={pad.top + plotH} fill="#818cf8" fontSize="11">0%</text>
              {chartData.map((item, index) => {
                const x = pad.left + slot * index + (slot - barW) / 2;
                const y = item.profit >= 0 ? yProfit(item.profit) : zeroY;
                const barH = Math.max(2, Math.abs(yProfit(item.profit) - zeroY));
                return (
                  <g key={`${item.name}-${index}`}>
                    <rect x={x} y={y} width={barW} height={barH} rx="5" fill={item.profit >= 0 ? '#10b981cc' : '#ef4444cc'}>
                      <title>{`${item.name}: P&L €${formatFixed(item.profit, 2, '0.00')} • Success ${formatFixed(item.success, 1, '0.0')}%`}</title>
                    </rect>
                    <text x={x + barW / 2} y={height - 24} textAnchor="middle" fill="#a5b4fc" fontSize="11">{truncateLabel(item.name, 8)}</text>
                  </g>
                );
              })}
              <polyline points={linePoints} fill="none" stroke="#818cf8" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
              {chartData.map((item, index) => {
                const cx = pad.left + slot * index + slot / 2;
                const cy = ySuccess(item.success);
                return (
                  <g key={`success-${item.name}-${index}`}>
                    <circle cx={cx} cy={cy} r="4.5" fill="#c4b5fd" stroke="#4f46e5" strokeWidth="2">
                      <title>{`${item.name}: Success ${formatFixed(item.success, 1, '0.0')}%`}</title>
                    </circle>
                    <text x={cx} y={cy - 9} textAnchor="middle" fill="#c4b5fd" fontSize="10" fontWeight="700">{formatFixed(item.success, 0, '0')}%</text>
                  </g>
                );
              })}
              <g transform={`translate(${pad.left}, ${height - 5})`}>
                <rect width="10" height="10" fill="#10b981cc" rx="2" /><text x="16" y="9" fill="#94a3b8" fontSize="11">P&L</text>
                <line x1="70" x2="86" y1="5" y2="5" stroke="#818cf8" strokeWidth="3" /><text x="92" y="9" fill="#94a3b8" fontSize="11">Success Rate</text>
              </g>
            </svg>
          );
        };

        // --- SERVICES ---
        let currentProxyIndex = 0;
        const symbolCache = {};
        const priceCache = {};

        const searchTicker = async (query, apiKey) => {
          if (!apiKey) throw new Error("API Key mancante");
          const cacheKey = `search_${query.toUpperCase()}`;
          if (symbolCache[cacheKey] && (Date.now() - symbolCache[cacheKey].timestamp < 300000)) {
            return symbolCache[cacheKey].data;
          }
          try {
            const response = await fetch(`https://finnhub.io/api/v1/search?q=${encodeURIComponent(query)}&token=${apiKey}`);
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            const results = data.result || [];
            symbolCache[cacheKey] = { data: results, timestamp: Date.now() };
            return results;
          } catch (error) {
            throw new Error(error.message || "Errore durante la ricerca");
          }
        };

        const getStockPrice = async (ticker) => {
          try {
            // Usa getHistoricalData che estrae già il prezzo e include policy per GAS Proxy e CORS
            const data = await getHistoricalData(ticker, '5d');
            const price = {
              current: data.current,
              dayHigh: data.dayHigh,
              dayLow: data.dayLow,
              previousClose: data.previousClose,
              open: data.candles.length > 0 ? (data.candles[data.candles.length - 1].open || data.current) : data.current,
              volume: data.volume || 0
            };
            if (!price.current) throw new Error("Prezzo invalido");
            return price;
          } catch (error) {
            console.error('Error fetching stock price:', error);
            throw new Error(`Impossibile ottenere prezzo per ${ticker}.`);
          }
        };

        // Funzione per calcolare il range necessario in base ai giorni passati
        const calculateYahooRange = (daysPassed) => {
          if (daysPassed <= 5) return '5d';
          if (daysPassed <= 30) return '1mo';
          if (daysPassed <= 90) return '3mo';
          if (daysPassed <= 180) return '6mo';
          if (daysPassed <= 365) return '1y';
          return '2y';
        };

        // Funzione per scaricare dati storici di un ticker (con adjClose e volume)
        const getHistoricalData = async (ticker, range) => {
          const cacheKey = `hist_${ticker}_${range}_${Math.floor(Date.now() / 300000)}`; // cache 5 min
          if (priceCache[cacheKey]) return priceCache[cacheKey].data;

          const gasUrl = localStorage.getItem('gasUrl') || '';
          const yahooTickers = getYahooTickerCandidates(ticker); const __histT0 = Date.now(); const __histAttempts = [];

          // Funzione helper per parsare i dati chart
          const parseChartData = (result, requestedTicker = ticker) => {
            const meta = result?.meta || {};
            const timestamps = result?.timestamp || [];
            const quotes = result?.indicators?.quote?.[0] || {};
            const adjCloseData = result?.indicators?.adjclose?.[0]?.adjclose || [];

            // Costruisci array di candele giornaliere con adjClose e volume, preservando 0 se presente.
            const candles = timestamps.map((ts, idx) => ({
              date: new Date(ts * 1000),
              dateString: new Date(ts * 1000).toDateString(),
              open: toFiniteNumber(quotes.open?.[idx], null),
              high: toFiniteNumber(quotes.high?.[idx], null),
              low: toFiniteNumber(quotes.low?.[idx], null),
              close: toFiniteNumber(quotes.close?.[idx], null),
              adjClose: toFiniteNumber(adjCloseData[idx], toFiniteNumber(quotes.close?.[idx], null)),
              volume: toFiniteNumber(quotes.volume?.[idx], null)
            })).filter(c => c.high !== null && c.low !== null);

            const lastValidCandle = [...candles].reverse().find(c => c.close !== null || c.adjClose !== null || c.open !== null);
            const currentPrice =
              toFiniteNumber(meta.regularMarketPrice, null) ??
              toFiniteNumber(meta.chartPreviousClose, null) ??
              toFiniteNumber(meta.previousClose, null) ??
              toFiniteNumber(lastValidCandle?.close, null) ??
              toFiniteNumber(lastValidCandle?.adjClose, null) ??
              toFiniteNumber(lastValidCandle?.open, null);

            if (currentPrice === null) {
              throw new Error(`Prezzo non disponibile per ${requestedTicker}`);
            }

            return {
              current: currentPrice,
              dayHigh: toFiniteNumber(meta.regularMarketDayHigh, currentPrice),
              dayLow: toFiniteNumber(meta.regularMarketDayLow, currentPrice),
              previousClose: toFiniteNumber(meta.chartPreviousClose, toFiniteNumber(meta.previousClose, currentPrice)),
              volume: toFiniteNumber(meta.regularMarketVolume, toFiniteNumber(lastValidCandle?.volume, null)),
              candles: candles
            };
          };

          // USA GAS COME PROXY (priorità). Prova anche alias Yahoo per class share USA (es. BF.B -> BF-B).
          if (gasUrl) {
            for (const yahooTicker of yahooTickers) {
              let __st = null;
              try {
                const yahooCookie = localStorage.getItem('yahooCookie') || '';
                const yahooCrumb = localStorage.getItem('yahooCrumb') || '';
                const response = await fetch(`${gasUrl}?action=yahooChart&ticker=${encodeURIComponent(yahooTicker)}&range=${range}&interval=1d&cookie=${encodeURIComponent(yahooCookie)}&crumb=${encodeURIComponent(yahooCrumb)}`);
                __st = response.status;
                const result = await response.json();

                if (result.status === 'success' && result.data) {
                  const historicalData = parseChartData(result.data, yahooTicker);
                  __histAttempts.push({ source: 'gas', ticker: yahooTicker, httpStatus: __st, ok: true });

        const calculateHistoricalMinMax = (historicalData, estimateStartDate, currentPrice) => {
          const startDate = new Date(estimateStartDate);
          const startDateString = startDate.toDateString();
          const todayString = new Date().toDateString();
          const isFirstDay = startDateString === todayString;
          
          // Filtra le candele: includi SOLO i giorni SUCCESSIVI a startDate
          // Il giorno di inserimento è escluso (gestito con currentPrice iniziale)
          const relevantCandles = historicalData.candles.filter(candle => {
            // Escludi il giorno stesso di inserimento
            if (candle.dateString === startDateString) return false;
            // Includi solo giorni successivi
            return candle.date > startDate;
          });
          
          let historicalHigh = null;
          let historicalLow = null;
          
          if (relevantCandles.length > 0) {
            historicalHigh = Math.max(...relevantCandles.map(c => c.high));
            historicalLow = Math.min(...relevantCandles.map(c => c.low));
          }
          
          // IMPORTANTE: Verifica se l'ultima candela disponibile è di OGGI
          // Se siamo a mercato chiuso (es. Domenica), dayHigh/dayLow sono di Venerdì!
          const lastCandle = historicalData.candles.length > 0 
            ? historicalData.candles[historicalData.candles.length - 1] 
            : null;
          const lastCandleIsToday = lastCandle && lastCandle.dateString === todayString;
          const lastCandleIsAfterStart = lastCandle && lastCandle.date > startDate && lastCandle.dateString !== startDateString;
          
          // Per il giorno corrente:
          // - Se è il primo giorno: usa SOLO currentPrice (ignora dayHigh/dayLow pre-inserimento)
          // - Se l'ultima candela NON è di oggi (mercato chiuso): usa SOLO currentPrice
          // - Se l'ultima candela è di oggi E successiva a startDate: usa dayHigh/dayLow
          let todayHigh = currentPrice;
          let todayLow = currentPrice;
          
          if (!isFirstDay && lastCandleIsToday && lastCandleIsAfterStart) {
            // Solo se:
            // 1. Non è il primo giorno
            // 2. L'ultima candela è di OGGI (mercato aperto oggi)
            // 3. L'ultima candela è SUCCESSIVA alla data di inserimento
            todayHigh = historicalData.dayHigh || currentPrice;
            todayLow = historicalData.dayLow || currentPrice;
          }
          
          // Calcola il max/min finale combinando storico + oggi
          let finalHigh = todayHigh;
          let finalLow = todayLow;
          
          if (historicalHigh !== null) {
            finalHigh = Math.max(historicalHigh, todayHigh);
          }
          if (historicalLow !== null) {
            finalLow = Math.min(historicalLow, todayLow);
          }
          
          return {
            highPrice: finalHigh,
            lowPrice: finalLow,

            isFirstDay,

                const historyRow = createHistoryRow(selectedTicker.symbol, priceDataForHistory, fundamentals);

              const totalTime = Date.now() - startTime;
              
              if (!hasPriceError && !hasProfileError) {
                setLoadingMessage(`🎉 Stima creata con successo! (${(totalTime / 1000).toFixed(1)}s totale)`);
                setTimeout(() => setLoadingMessage(''), 3000); // Sparisce dopo 3s
              } else {
                setLoadingMessage(prev => prev + `\n⚠️ Stima creata con errori (${(totalTime / 1000).toFixed(1)}s totale)`);

              }
              
              setLoadingPrice(false);
              setLoadingProfile(false);
              
              if (hasPriceError && hasProfileError) {
                toast.addToast('Impossibile ottenere dati necessari. Riprova più tardi.', 'error');
                return;
              }
              
              if (hasPriceError) {
                toast.addToast('Stima creata senza prezzo corrente. Aggiorna manualmente.', 'warning');
              }
              
              const stopLossValue = -Math.abs(parseFloat(formData.stopLoss));

              onLog(`📥 Nuova stima: ${selectedTicker.symbol} @ €${priceData.current.toFixed(2)}`, 'info');
              
              const newEstimate = {
                id: Date.now(),
                aiName: formData.aiName,
                ticker: selectedTicker.symbol,
                startDate: new Date().toISOString(),
                duration: parseInt(formData.duration),
                profitTarget: parseFloat(formData.profitTarget),
                stopLoss: stopLossValue,
                amount: parseFloat(formData.amount),
                version: parseInt(formData.version),
                confidence: parseInt(formData.confidence) || 75,
                startPrice: priceData.current,
                currentPrice: priceData.current,
                highPrice: priceData.current,
                lowPrice: priceData.current,
                assetProfile: assetProfile,
                lastFundamentals: fundamentals,
                status: 'active',
                endDate: null,
                endPrice: null,
                profitLoss: 0,
                profitLossPercent: 0,
                lastUpdate: new Date().toISOString(),
                exitReason: null
              };

              await saveEstimateArtifact(newEstimate.id, { ticker: newEstimate.ticker, fundamentals, historicalData: null, updatedAt: newEstimate.lastUpdate });
              onAdd(newEstimate);
              setLastEstimate(newEstimate);
              
              const newDefaults = loadDefaultSettings();
              setFormData({ aiName: '', duration: newDefaults.duration, profitTarget: newDefaults.profitTarget, stopLoss: newDefaults.stopLoss, amount: newDefaults.amount, version: getLastVersion(), confidence: newDefaults.confidence });
              setSelectedTicker(null);
              setSearchQuery('');
              
              let successMessage = `Stima aggiunta: ${newEstimate.ticker}`;
              if (!hasPriceError) {
                successMessage += ` @ $${newEstimate.startPrice.toFixed(2)}`;
              } else {
                successMessage += ' (prezzo non disponibile)';
              }
              toast.addToast(successMessage, 'success');
              onLog(`Nuova stima: ${newEstimate.ticker}`, 'success');

            } catch (error) {
              toast.addToast(`Errore generale: ${error.message}`, 'error');
              onLog(`Errore creazione: ${error.message}`, 'error');
              setLoadingPrice(false);
              setLoadingProfile(false);
            }
          };

          const handleUndo = () => {
            if (lastEstimate) {
              onRemove(lastEstimate.id, true);
              setLastEstimate(null);
              toast.addToast('Stima eliminata', 'warning');
              onLog('Inserimento annullato', 'warning');

          return (
            <div className="space-y-6 animate-fade-in">
              {!isOnline && (
                <div className="bg-red-500/20 border-l-4 border-red-500 p-4 rounded-xl text-red-200 animate-slide-in">
                  <p className="font-bold">⚠️ API Key Finnhub mancante</p>
                  <p className="text-sm">Configura la chiave nelle impostazioni per abilitare la ricerca ticker.</p>
                </div>
              )}

              <div className="glass rounded-2xl p-6 shadow-xl">
                <h2 className="text-2xl font-bold mb-6 gradient-text">Inserisci Nuova Stima</h2>

                <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Modello IA *</label>
                    <select required className="bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all"
                      value={formData.aiName} onChange={(e) => setFormData({...formData, aiName: e.target.value})}>
                      <option value="">Seleziona IA...</option>
                      {AI_OPTIONS.map(ai => <option key={ai} value={ai}>{AI_ICONS[ai]} {ai}</option>)}
                    </select>
                  </div>

                  <div className="flex flex-col relative z-50">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Cerca Ticker *</label>
                    <div className="relative">
                      <input type="text" placeholder={isOnline ? "Es. AAPL, TSLA..." : "Configura API Key"} disabled={!isOnline}
                        className="w-full bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all disabled:opacity-50"
                        value={searchQuery} onChange={(e) => { setSearchQuery(e.target.value); if(selectedTicker && e.target.value !== selectedTicker.symbol) setSelectedTicker(null); }}
                      />
                      {isSearching && <div className="absolute right-3 top-3 animate-spin h-5 w-5 border-2 border-accent-blue rounded-full border-t-transparent"></div>}
                      {selectedTicker && <div className="absolute right-3 top-3 text-emerald-400">✓</div>}
                    </div>
                    {showResults && searchResults.length > 0 && (
                      <div className="absolute top-full left-0 right-0 mt-2 bg-background border border-gray-700 rounded-lg shadow-2xl max-h-60 overflow-y-auto z-[100]">
                        {searchResults.map(result => (
                          <div key={result.symbol} className="p-3 hover:bg-accent-blue/20 cursor-pointer border-b border-gray-800 transition-colors" onClick={() => handleSelectTicker(result)}>

                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Durata (Giorni)</label>

                      value={formData.profitTarget} onChange={e => setFormData({...formData, profitTarget: e.target.value})} />
                  </div>
                  
                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Stop Loss (%)</label>
                    <input type="number" step="0.1" min="0.1" required placeholder="Es: 10 per -10%" className="bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all"
                      value={formData.stopLoss} onChange={e => setFormData({...formData, stopLoss: e.target.value})} />

                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Importo (€)</label>
                    <input type="number" min="1" step="0.01" required className="bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all"
                      value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} />

                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Versione Modello</label>
                    <input type="number" min="1" required className="bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all"
                      value={formData.version} onChange={e => setFormData({...formData, version: e.target.value})} />

                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Confidence Score (0-100)</label>

                      <input type="number" min="0" max="100" required className="bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all w-full"
                        value={formData.confidence} onChange={e => setFormData({...formData, confidence: Math.min(100, Math.max(0, e.target.value))})} />
                    </div>

                      <div className="h-full transition-all duration-300" style={{
                        width: `${formData.confidence}%`,
                        background: formData.confidence >= 80 ? 'linear-gradient(90deg, #00b09b, #96c93d)' :

                      }}></div>
                    </div>
                  </div>

                  <div className="md:col-span-2 lg:col-span-3 pt-4">
                    <button type="submit" disabled={(loadingPrice || loadingProfile) || !isOnline}
                      className={`w-full py-4 rounded-xl font-bold text-lg shadow-lg transform transition-all hover:-translate-y-1 hover:shadow-2xl flex justify-center items-center gap-2
                        ${(loadingPrice || loadingProfile) || !isOnline ? 'bg-gray-600 cursor-not-allowed opacity-50' : 'bg-gradient-to-r from-emerald-500 to-emerald-700 text-white hover:from-emerald-400 hover:to-emerald-600'}`}>
                      {(loadingPrice || loadingProfile) ? (
                        <div className="flex items-center gap-2">
                          <div className="animate-spin h-5 w-5 border-2 border-white rounded-full border-t-transparent"></div>
                          <span>{loadingPrice ? 'Caricamento prezzo...' : 'Caricamento profilo...'}</span>
                        </div>
                      ) : '🚀 Conferma Inserimento'}
                    </button>
                  </div>
                </form>

                {loadingMessage && (
                  <div className="mt-4 p-3 bg-blue-500/20 border border-blue-500/30 rounded-lg text-blue-200 text-left animate-pulse" style={{ whiteSpace: 'pre-line' }}>
                    <div className="flex items-start gap-2">
                      <div className="animate-spin h-4 w-4 border-2 border-blue-400 rounded-full border-t-transparent mt-1"></div>
                      <span>{loadingMessage}</span>
                    </div>
                  </div>
                )}
              </div>

              {lastEstimate && (
                <div className="glass border-emerald-500/50 rounded-2xl p-6 shadow-lg shadow-emerald-500/10 animate-slide-up">
                  <div className="flex items-center justify-between mb-4 border-b border-gray-700/50 pb-3">
                    <div className="flex items-center gap-3">
                      <span className="text-2xl bg-emerald-500/20 p-2 rounded-lg">✅</span>
                      <div>
                        <h3 className="text-xl font-bold text-white">Stima Inserita</h3>
                        <p className="text-sm text-gray-400">Riepilogo operazione</p>
                      </div>
                    </div>
                    <span className="text-4xl">{AI_ICONS[lastEstimate.aiName]}</span>
                  </div>
                  
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                    <div className="bg-black/30 p-3 rounded-lg">
                      <span className="text-gray-500 block">Ticker</span>
                      <span className="text-lg font-bold text-emerald-400">{lastEstimate.ticker}</span>
                    </div>
                    <div className="bg-black/30 p-3 rounded-lg">
                      <span className="text-gray-500 block">Prezzo</span>
                      <span className="text-lg font-bold text-white">${lastEstimate.startPrice.toFixed(2)}</span>
                    </div>
                    <div className="bg-black/30 p-3 rounded-lg border border-emerald-500/30">
                      <span className="text-gray-500 block">Target</span>
                      <span className="font-bold text-emerald-400">+{lastEstimate.profitTarget}%</span>
                    </div>
                    <div className="bg-black/30 p-3 rounded-lg border border-red-500/30">
                      <span className="text-gray-500 block">Stop Loss</span>
                      <span className="font-bold text-red-400">{lastEstimate.stopLoss}%</span>
                    </div>
                  </div>
                  
                  <div className="mt-4 flex gap-4 justify-center">
                    <button onClick={() => switchTab('estimates')} className="text-emerald-400 hover:text-emerald-300 underline text-sm font-semibold">
                      Visualizza Stime →
                    </button>
                    <button onClick={handleUndo} className="text-red-400 hover:text-red-300 underline text-sm flex items-center gap-1 font-semibold">
                      🗑️ Annulla
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        };

        // Riga stima memoizzata (module-scope) — evita re-render di tutte le righe
        // quando cambia stato non correlato (apertura modale, toggle di altri gruppi).
        const EstimateRow = React.memo(function EstimateRow({ est, onSelect, onRemove }) {
          const isProfit = est.profitLossPercent >= 0;
          const endDate = new Date(est.startDate);
          endDate.setDate(endDate.getDate() + est.duration);
          const daysLeft = Math.max(0, est.duration - Math.floor((Date.now() - new Date(est.startDate).getTime()) / 86400000));
          const highPrice = est.highPrice || est.startPrice;
          const lowPrice = est.lowPrice || est.startPrice;
          const highChange = ((highPrice - est.startPrice) / est.startPrice * 100);
          const lowChange = ((lowPrice - est.startPrice) / est.startPrice * 100);
          const isNewEstimate = highPrice === est.startPrice && lowPrice === est.startPrice;
          const conf = est.confidence ?? 75;
          const confColor = conf >= 80 ? 'text-emerald-400' : conf >= 75 ? 'text-amber-400' : 'text-red-400';
          const confBg = conf >= 80 ? 'bg-emerald-500/20' : conf >= 75 ? 'bg-amber-500/20' : 'bg-red-500/20';
          return (
            <tr className="hover:bg-white/5 transition-colors cursor-pointer" onClick={() => onSelect(est)}>
              <td className="p-3 font-bold text-white">{est.ticker} <span className="text-xs font-normal text-gray-500 ml-1">v{est.version}</span></td>
              <td className="p-3 text-gray-400">{new Date(est.startDate).toLocaleDateString()}</td>
              <td className="p-3 text-gray-400"><div className="text-white">{endDate.toLocaleDateString()}</div><div className="text-xs">{est.status === 'active' ? `${daysLeft}g left` : 'Chiuso'}</div></td>
              <td className="p-3"><div className="text-gray-400">${est.startPrice.toFixed(2)}</div><div className="text-white font-mono">${est.currentPrice.toFixed(2)}</div></td>
              <td className="p-3 text-xs">{(isNewEstimate && est.status === 'active') ? (
                <div className="text-gray-500 italic text-center"><div>In attesa</div><div className="text-[10px]">aggiornamento</div></div>
              ) : (<>
                <div className="flex items-center gap-1"><span className="text-emerald-400">▲</span><span className="text-emerald-300 font-mono">${highPrice.toFixed(2)}</span><span className={`text-[10px] ${highChange >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>({highChange >= 0 ? '+' : ''}{highChange.toFixed(1)}%)</span></div>
                <div className="flex items-center gap-1"><span className="text-red-400">▼</span><span className="text-red-300 font-mono">${lowPrice.toFixed(2)}</span><span className={`text-[10px] ${lowChange >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>({lowChange >= 0 ? '+' : ''}{lowChange.toFixed(1)}%)</span></div>
              </>)}</td>
              <td className={`p-3 font-bold ${isProfit ? 'text-emerald-400' : 'text-red-400'}`}>{isProfit ? '+' : ''}{est.profitLossPercent.toFixed(2)}%</td>
              <td className="p-3 text-xs"><div className="text-emerald-400">TP: +{est.profitTarget}%</div><div className="text-red-400">SL: {est.stopLoss}%</div></td>
              <td className={`p-3 font-bold ${est.profitLoss >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>€{est.profitLoss >= 0 ? '+' : ''}{est.profitLoss.toFixed(2)}</td>
              <td className="p-3"><div className="flex flex-col items-center gap-1"><span className={`font-bold ${confColor}`}>{conf}</span><div className="w-12 h-1.5 bg-gray-700 rounded-full overflow-hidden"><div className={`h-full ${confBg}`} style={{ width: `${conf}%` }}></div></div></div></td>
              <td className="p-3"><span className={`px-2 py-1 rounded text-xs ${est.status === 'active' ? 'bg-blue-500/20 text-blue-400' : est.status === 'completed-positive' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`}>{est.status === 'active' ? 'Active' : est.exitReason?.toUpperCase()}</span></td>
              <td className="p-3"><button onClick={(ev) => { ev.stopPropagation(); onRemove(est.id); }} className="text-gray-500 hover:text-red-400 transition-colors p-1">🗑️</button></td>
            </tr>
          );
        });
        // Estimate List with Sorting (IMPROVED)
        const EstimateList = ({ estimates, onUpdateEstimate, onBulkUpdateEstimates, onRemove, onLog, autoRefresh, setAutoRefresh }) => {
          const toast = useToast();
          const [expandedGroups, setExpandedGroups] = useState({});
          const [isAllExpanded, setIsAllExpanded] = useState(false); const ROW_CAP = 100; const [groupShowAll, setGroupShowAll] = useState({});
          
          // Sorting State (NEW)
          const [sortConfig, setSortConfig] = useState({ key: 'startDate', direction: 'desc' });
          
          // Filter State
          const initialFilters = { ticker: '', dateFrom: '', dateTo: '', status: 'all', varOp: 'gt', varVal: '', pnlOp: 'gt', pnlVal: '', aiName: 'all', confOp: 'gte', confVal: '' };
          const [filters, setFilters] = useState(initialFilters);
          const [showFilters, setShowFilters] = useState(false);

          // Modal State
          const [showUpdateModal, setShowUpdateModal] = useState(false);
          const [updateProgress, setUpdateProgress] = useState({ current: 0, total: 0, currentTicker: '' });
          const [updateResults, setUpdateResults] = useState([]);
          const [isUpdateFinished, setIsUpdateFinished] = useState(false);
          const [hasUpdateError, setHasUpdateError] = useState(false);
          const [updatePaused, setUpdatePaused] = useState(false);
          const updateControlRef = useRef({ paused: false, shouldStop: false });
          const [showTickerDetailsModal, setShowTickerDetailsModal] = useState(false);
          const [selectedEstimateForDetails, setSelectedEstimateForDetails] = useState(null);
          const handleSelectEstimate = useCallback((est) => { setSelectedEstimateForDetails(est); setShowTickerDetailsModal(true); }, []);

          // Auto-refresh timer ref
          const autoRefreshRef = useRef(null);

          // Filtering Logic
          const filteredEstimates = useMemo(() => {
            return estimates.filter(est => {
              if (filters.ticker && !est.ticker.toLowerCase().includes(filters.ticker.toLowerCase())) return false;
              
              // Status filter with special cases
              if (filters.status === 'concluse') {
                if (!est.status.startsWith('completed-')) return false;
              } else if (filters.status === 'scadute') {
                if (est.status !== 'completed-negative' || est.exitReason !== 'timeout') return false;
              } else if (filters.status !== 'all' && filters.status !== est.status) {
                return false;
              }
              const estDate = new Date(est.startDate);
              if (filters.dateFrom && estDate < new Date(filters.dateFrom)) return false;
              if (filters.dateTo) {
                const toDate = new Date(filters.dateTo);
                toDate.setHours(23, 59, 59, 999);
                if (estDate > toDate) return false;
              }
              if (filters.varVal !== '') {
                const val = parseFloat(filters.varVal);
                if (!isNaN(val)) {
                  if (filters.varOp === 'gt' && est.profitLossPercent <= val) return false;
                  if (filters.varOp === 'lt' && est.profitLossPercent >= val) return false;
                }
              }
              if (filters.pnlVal !== '') {
                const val = parseFloat(filters.pnlVal);
                if (!isNaN(val)) {
                  if (filters.pnlOp === 'gt' && est.profitLoss <= val) return false;
                  if (filters.pnlOp === 'lt' && est.profitLoss >= val) return false;
                }
              }
              // Filtro AI
              if (filters.aiName !== 'all' && est.aiName !== filters.aiName) return false;
              // Filtro Confidence
              if (filters.confVal !== '') {
                const val = parseFloat(filters.confVal);
                const estConf = est.confidence ?? 75;
                if (!isNaN(val)) {
                  if (filters.confOp === 'gte' && estConf < val) return false;
                  if (filters.confOp === 'lte' && estConf > val) return false;
                  if (filters.confOp === 'eq' && estConf !== val) return false;
                }
              }
              return true;
            });
          }, [estimates, filters]);

          // Sorting Logic (NEW)
          const sortedEstimates = useMemo(() => {
            const sorted = [...filteredEstimates];
            sorted.sort((a, b) => {
              let aVal = a[sortConfig.key];
              let bVal = b[sortConfig.key];
              
              if (sortConfig.key === 'startDate' || sortConfig.key === 'lastUpdate') {
                aVal = new Date(aVal).getTime();
                bVal = new Date(bVal).getTime();
              }
              
              if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
              if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
              return 0;
            });
            return sorted;
          }, [filteredEstimates, sortConfig]);

          // Grouping
          const grouped = useMemo(() => {
            return sortedEstimates.reduce((acc, est) => {
              if (!acc[est.aiName]) acc[est.aiName] = [];
              acc[est.aiName].push(est);
              return acc;
            }, {});
          }, [sortedEstimates]);

          const handleSort = (key) => {
            setSortConfig(prev => ({
              key,
              direction: prev.key === key && prev.direction === 'desc' ? 'asc' : 'desc'
            }));
          };

          const toggleGroup = (ai) => {
            setExpandedGroups(prev => ({ ...prev, [ai]: prev[ai] === undefined ? !isAllExpanded : !prev[ai] }));
          };

          const toggleAll = () => {
            setIsAllExpanded(!isAllExpanded);
            setExpandedGroups({});
          };

          const resetFilters = () => setFilters(initialFilters);

          const UPDATE_CONCURRENCY = 6;
          const UPDATE_RESULT_FLUSH_SIZE = 4;
          const updatePrices = async () => {
            const activeEstimates = estimates.filter(e => e.status === 'active');
            const gasUrl = localStorage.getItem('gasUrl') || '';
            const UPDATE_TICKER_TIMEOUT_MS = 240000; // evita blocchi infiniti su fetch/GAS/proxy lenti
            const UPDATE_DRIVE_SAVE_TIMEOUT_MS = 15000; // Drive non deve bloccare l'update prezzi
            const UPDATE_FINALIZE_TIMEOUT_MS = 90000; // evita che la persistenza finale lasci il modal appeso

            const withTimeout = (promise, timeoutMs, label) => new Promise((resolve, reject) => {
              const timeoutId = setTimeout(() => {
                reject(new Error(`${label} timeout dopo ${Math.round(timeoutMs / 1000)}s`));
              }, timeoutMs);

              Promise.resolve(promise)
                .then(value => { clearTimeout(timeoutId); resolve(value); })
                .catch(error => { clearTimeout(timeoutId); reject(error); });
            });

            setShowUpdateModal(true);
            setUpdateResults([]);
            setIsUpdateFinished(false);
            setHasUpdateError(false);
            setUpdatePaused(false);
            updateControlRef.current = { paused: false, shouldStop: false };

            if (activeEstimates.length === 0) {
              setUpdateProgress({ current: 0, total: 0, currentTicker: '' });
              setUpdateResults([{ status: 'warning', ticker: 'Sistema', message: 'Nessuna stima attiva.', time: new Date().toLocaleTimeString() }]);
              setIsUpdateFinished(true);
              return;

        const migrateLegacyLocalStorageToIDB = async () => { const migrationFlag = localStorage.getItem('idbMigrationCompletedV431'); const [existingEstimates, existingLogs, existingChatMessages] = await Promise.all([idbGet(KV_STORE, 'estimates'), idbGet(KV_STORE, 'logs'), idbGet(KV_STORE, 'chatMessages')]); let estimates = Array.isArray(existingEstimates) ? existingEstimates : null; let logs = Array.isArray(existingLogs) ? existingLogs : null; let chatMessages = Array.isArray(existingChatMessages) ? existingChatMessages : null; if ((!Array.isArray(estimates) || estimates.length === 0) && localStorage.getItem('estimates')) { try { estimates = JSON.parse(localStorage.getItem('estimates')); } catch {} } if ((!Array.isArray(logs) || logs.length === 0) && localStorage.getItem('logs')) { try { logs = JSON.parse(localStorage.getItem('logs')); } catch {} } if ((!Array.isArray(chatMessages) || chatMessages.length === 0) && localStorage.getItem('chatMessages')) { try { chatMessages = JSON.parse(localStorage.getItem('chatMessages')); } catch {} } const compactedEstimates = await compactEstimatesAndArtifacts(estimates || []); const normalizedLogs = Array.isArray(logs) ? logs.map((entry, index) => normalizeLogEntry(entry, index)) : []; await idbSet(KV_STORE, compactedEstimates, 'estimates'); await idbSet(KV_STORE, normalizedLogs, 'logs'); await idbSet(KV_STORE, Array.isArray(chatMessages) ? chatMessages : [], 'chatMessages'); await idbSet(KV_STORE, { version: APP_STORAGE_VERSION, migratedAt: new Date().toISOString(), migratedFromLocalStorage: migrationFlag !== '1' }, 'storageMeta'); localStorage.removeItem('estimates'); localStorage.removeItem('logs'); localStorage.removeItem('chatMessages'); localStorage.setItem('idbMigrationCompletedV431', '1'); return { estimates: compactedEstimates, logs: normalizedLogs, chatMessages: Array.isArray(chatMessages) ? chatMessages : [] }; };
        const collectStorageDiagnostics = async ({ estimates = [], logs = [], chatMessages = [] } = {}) => { const [artifactCount, artifacts, storageMeta] = await Promise.all([idbCount(ARTIFACT_STORE), idbGetAll(ARTIFACT_STORE), idbGet(KV_STORE, 'storageMeta')]); let quota = 0; let usage = 0; if (navigator.storage?.estimate) { try { const estimate = await navigator.storage.estimate(); quota = estimate?.quota || 0; usage = estimate?.usage || 0; } catch {} } const bytes = { estimates: estimatePayloadBytes(estimates), logs: estimatePayloadBytes(logs), chatMessages: estimatePayloadBytes(chatMessages), artifacts: estimatePayloadBytes(artifacts), localStorage: calculateLocalStorageBytes() }; bytes.totalManaged = bytes.estimates + bytes.logs + bytes.chatMessages + bytes.artifacts + bytes.localStorage; return { version: storageMeta?.version || APP_STORAGE_VERSION, lastMigrationAt: storageMeta?.migratedAt || null, artifactCount, counts: { estimates: Array.isArray(estimates) ? estimates.length : 0, logs: Array.isArray(logs) ? logs.length : 0, chatMessages: Array.isArray(chatMessages) ? chatMessages.length : 0 }, bytes, quota, usage }; };

        // ============================================================
        //  INSIGHTS TAB (integrato) — analisi affidabilità modelli IA
        //  IIFE isolato: nessuna collisione con i nomi globali dell'app.
        //  Usa direttamente lo stato `estimates` (100% dei dati locali).
        //  Focus: Q1 quale IA è più affidabile · Q2 affidabilità nel tempo
        //         Q3 l'affidabilità è veritiera (validità statistica)?
        // ============================================================
        const Insights = (() => {
          const N = (v, fb = null) => { if (typeof v === 'number' && Number.isFinite(v)) return v; if (v === null || v === undefined || v === '') return fb; const p = Number(String(v).replace(',', '.')); return Number.isFinite(p) ? p : fb; };
          const FX = (v, d = 2, fb = 'N/A') => { const n = N(v, null); return n === null ? fb : n.toFixed(d); };
          const PCT = (v, d = 1) => { const n = N(v, null); return n === null ? 'N/A' : (n >= 0 ? '+' : '') + n.toFixed(d) + '%'; };
          const MEAN = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
          const STD = a => { if (a.length < 2) return 0; const m = MEAN(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
          const SUM = a => a.reduce((s, x) => s + x, 0);
          const AI_IC = { 'Gemini': '💎', 'IA Studio': '🎨', 'GPT': '🧠', 'Claude': '🤖', 'Kimi': '🌙', 'Perplexity': '🔮', 'DeepSeek': '🔍', 'Copilot': '✈️', 'Grok': '⚡', 'Qwen': '🐉' };
          const isClosed = e => typeof e.status === 'string' && e.status.startsWith('completed');
          const isWin = e => e.status === 'completed-positive' || (N(e.profitLossPercent, 0) > 0 && isClosed(e));
          const groupBy = (rows, fn) => { const m = {}; rows.forEach(e => { const k = fn(e); (m[k] = m[k] || []).push(e); }); return m; };

          // === BUY & HOLD BENCHMARK (neutralizza il merito del mercato) — LONG-only, ultimo snapshot ===
          const buyHold = e => { const s = N(e.startPrice, null), c = N(e.currentPrice, null); return (s && s > 0 && c !== null) ? (c - s) / s * 100 : null; };
          const aiReturn = e => N(e.profitLossPercent, null);
          const alphaOf = e => { const a = aiReturn(e), b = buyHold(e); return (a === null || b === null) ? null : a - b; };

          const wilson = (wins, n) => {
            if (!n) return { lo: null, hi: null, p: null, half: null };
            const z = 1.96, p = wins / n, d = 1 + z * z / n;
            const c = (p + z * z / (2 * n)) / d;
            const m = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d;
            return { p: p * 100, lo: Math.max(0, (c - m) * 100), hi: Math.min(100, (c + m) * 100), half: m * 100 };
          };

          // === TEST BINOMIALE ESATTO vs H0: p=0.5 (Q3 significatività) ===
          // Restituisce p-value bilaterale, p-value unilaterale superiore (batte il caso),
          // il "verdetto" testuale e il livello di confidenza. pmf iterativa stabile.
          const binomTest = (wins, n) => {
            if (!n) return { two: null, oneUpper: null, verdict: null, level: null, dir: null };
            const pmf = new Array(n + 1);
            pmf[0] = Math.pow(0.5, n);
            for (let i = 0; i < n; i++) pmf[i + 1] = pmf[i] * (n - i) / (i + 1);
            const half = n / 2, dev = Math.abs(wins - half);
            let two = 0, oneUpper = 0;
            for (let i = 0; i <= n; i++) { if (Math.abs(i - half) >= dev - 1e-9) two += pmf[i]; if (i >= wins) oneUpper += pmf[i]; }
            two = Math.min(1, two); oneUpper = Math.min(1, oneUpper);
            const above = wins > half, below = wins < half;
            let verdict, level;
            if (!above && !below) { verdict = 'come il caso'; level = 0; }
            else if (two < 0.01) { level = 99; verdict = above ? 'batte il caso (99%)' : 'peggio del caso (99%)'; }
            else if (two < 0.05) { level = 95; verdict = above ? 'batte il caso (95%)' : 'peggio del caso (95%)'; }
            else if (two < 0.10) { level = 90; verdict = above ? 'indizio (90%)' : 'indizio negativo (90%)'; }
            else { level = 0; verdict = 'non distinguibile dal caso'; }
            return { two, oneUpper, verdict, level, dir: above ? 'up' : below ? 'down' : 'flat' };
          };

          const brier = rows => rows.length ? MEAN(rows.map(e => (N(e.confidence, 75) / 100 - (isWin(e) ? 1 : 0)) ** 2)) : null;
          const ece = rows => {
            if (!rows.length) return null;
            const edges = [0, 50, 60, 70, 80, 90, 100.0001]; let tot = 0;
            for (let i = 0; i < edges.length - 1; i++) {
              const b = rows.filter(e => { const c = N(e.confidence, 75); return c >= edges[i] && c < edges[i + 1]; });
              if (b.length) tot += b.length / rows.length * Math.abs(b.filter(isWin).length / b.length * 100 - MEAN(b.map(e => N(e.confidence, 75))));
            }
            return tot;
          };
          const perf = rows => {
            const closed = rows.filter(isClosed);
            const wins = closed.filter(isWin);
            const rets = closed.map(e => N(e.profitLossPercent, 0));
            const gain = SUM(closed.filter(e => N(e.profitLoss, 0) > 0).map(e => N(e.profitLoss, 0)));
            const loss = Math.abs(SUM(closed.filter(e => N(e.profitLoss, 0) < 0).map(e => N(e.profitLoss, 0))));
            const s = STD(rets); const sharpe = s ? MEAN(rets) / s : null;
            const invested = SUM(closed.map(e => N(e.amount, 0))); const totalPL = SUM(closed.map(e => N(e.profitLoss, 0)));

            const alphaVals = closed.map(alphaOf).filter(x => x !== null);
            return {

              expectancy: closed.length ? MEAN(rets) : null,

              sharpe, roi: invested ? totalPL / invested * 100 : null, totalPL,
              avgConf: rows.length ? MEAN(rows.map(e => N(e.confidence, 75))) : null,
              avgAIret: rets.length ? MEAN(rets) : null,
              avgBH: bhVals.length ? MEAN(bhVals) : null,
              avgAlpha: alphaVals.length ? MEAN(alphaVals) : null,
              pctBeatBH: alphaVals.length ? alphaVals.filter(a => a > 0).length / alphaVals.length * 100 : null,
              nAlpha: alphaVals.length,

          const reliabilityScore = rows => {

            if (!closed.length) return { score: null, shrunkWin: null };
            const K = 20; const shrunkWin = (p.winRate / 100 * closed.length + 0.5 * K) / (closed.length + K);
            const b = brier(closed); const e = ece(closed);
            const cCalib = e === null ? 50 : Math.max(0, 100 - e);
            const cWin = shrunkWin * 100;
            const cPF = p.profitFactor === null ? 50 : Math.min(1, (p.profitFactor === Infinity ? 3 : p.profitFactor) / 2.5) * 100;
            const cExp = p.expectancy === null ? 50 : Math.max(0, Math.min(100, 50 + p.expectancy * 5));
            const score = 0.35 * cWin + 0.25 * cCalib + 0.25 * cPF + 0.15 * cExp;
            return { score, shrunkWin: shrunkWin * 100, rawWin: p.winRate, brier: b, ece: e };
          };
          const marketAdjScore = rows => {

            const K = 20;
            const beatRaw = p.pctBeatBH / 100;

            const b = brier(closed); const e = ece(closed);
            const cCalib = e === null ? 50 : Math.max(0, 100 - e);
            const cBeat = shrunkBeat * 100;
            const cAlpha = Math.max(0, Math.min(100, 50 + p.avgAlpha * 5));

          // === DIREZIONE vs TIMING (Q1) ===
          // Direction Accuracy: % di stime dove il titolo è EFFETTIVAMENTE salito nella finestra

          // Timing Efficiency: quando la direzione era giusta, quante volte ha raggiunto il target

          const dirTiming = rows => {
            const closed = rows.filter(isClosed);

            const targetWhenRight = dirRight.filter(e => e.exitReason === 'target').length;

                <div className="flex items-center gap-2"><span className="w-16 text-xs text-gray-500">IA</span>
                  <div className="flex-1 bg-black/30 rounded h-4 overflow-hidden"><div className="h-full rounded" style={{ width: `${Math.abs(d.ai) / maxAbs * 100}%`, background: d.ai >= 0 ? '#34d399' : '#ef4444' }}></div></div>
                  <span className="w-16 text-right font-mono text-xs text-gray-300">{PCT(d.ai)}</span></div>
                <div className="flex items-center gap-2"><span className="w-16 text-xs text-gray-500">Buy&Hold</span>
                  <div className="flex-1 bg-black/30 rounded h-4 overflow-hidden"><div className="h-full rounded" style={{ width: `${Math.abs(d.bh) / maxAbs * 100}%`, background: '#667eea' }}></div></div>
                  <span className="w-16 text-right font-mono text-xs text-gray-300">{PCT(d.bh)}</span></div>
              </div>))}</div>);
          };
          const KPI = ({ label, value, sub, tone = 'white' }) => {
            const c = { white: 'text-white', green: 'text-emerald-400', red: 'text-red-400', blue: 'text-accent-blue', amber: 'text-amber-400' }[tone];
            return <div className="glass rounded-2xl p-4 text-center"><div className="text-xs text-gray-400 uppercase tracking-wide mb-1">{label}</div><div className={`text-2xl font-bold ${c}`}>{value}</div>{sub && <div className="text-xs text-gray-500 mt-1">{sub}</div>}</div>;
          };
          const quarterKey = d => { const dt = new Date(d); return `${dt.getFullYear()}-Q${Math.floor(dt.getMonth() / 3) + 1}`; };
          const PALETTE = ['#667eea', '#34d399', '#e94560', '#f59e0b', '#a78bfa', '#22d3ee', '#f472b6', '#84cc16', '#fb7185', '#38bdf8'];

          // === BOOTSTRAP del win rate (Q3): robustezza vs fortuna ===
          // Ricampiona i trade chiusi CON reinserimento (B volte) e costruisce l'IC percentile
          //   del win rate. Una distribuzione stretta = risultato robusto; larga = fragile/fortunato.
          //   LCG con seed fisso -> riproducibile. Il point estimate resta il win rate osservato.
          const bootstrapWin = (arr, B = 1000, seed = 12345) => {
            const closed = arr.filter(isClosed); const n = closed.length;
            if (n < 5) return { insufficient: true, n };
            let s = seed >>> 0; const rnd = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
            const wins = closed.map(isWin);
            const wr = [];
            for (let b = 0; b < B; b++) { let w = 0; for (let i = 0; i < n; i++) { if (wins[Math.floor(rnd() * n)]) w++; } wr.push(w / n * 100); }
            wr.sort((a, b) => a - b);
            const pct = p => wr[Math.min(wr.length - 1, Math.max(0, Math.round(p * (wr.length - 1))))];
            const lo = pct(0.025), hi = pct(0.975), median = pct(0.5), width = hi - lo;
            const pointRaw = closed.filter(isWin).length / n * 100;
            const robust = width < 20 ? 'robusto' : width < 35 ? 'moderato' : 'fragile';
            const above50 = lo > 50;
            return { n, lo, hi, median, width, robust, pointRaw, above50, wr, B };
          };
          // istogramma della distribuzione bootstrap
          const bootHist = (wr, bins = 14) => {
            const mn = Math.min(...wr), mx = Math.max(...wr); const w = (mx - mn) / bins || 1;
            const h = new Array(bins).fill(0);
            wr.forEach(v => { let k = Math.floor((v - mn) / w); if (k >= bins) k = bins - 1; if (k < 0) k = 0; h[k]++; });
            return { h, mn, mx, w };
          };
          const BootHisto = ({ wr }) => {
            if (!wr || !wr.length) return null;
            const { h, mn, w } = bootHist(wr); const maxH = Math.max(...h, 1);
            const W = 320, H = 120, P = { t: 8, r: 8, b: 20, l: 8 }; const pw = W - P.l - P.r, ph = H - P.t - P.b;

              {h.map((c, i) => (<rect key={i} x={P.l + i * bw + 1} y={P.t + ph - c / maxH * ph} width={bw - 1.5} height={c / maxH * ph} fill="#667eea" opacity="0.75" />))}
              {x50 >= P.l && x50 <= P.l + pw && (<line x1={x50} x2={x50} y1={P.t} y2={P.t + ph} stroke="#e94560" strokeDasharray="3 3" />)}
              <text x={P.l} y={H - 6} fill="#94a3b8" fontSize="9">{mn.toFixed(0)}%</text>
              <text x={P.l + pw} y={H - 6} textAnchor="end" fill="#94a3b8" fontSize="9">{(mn + w * h.length).toFixed(0)}%</text>
              {x50 >= P.l && x50 <= P.l + pw && (<text x={x50} y={H - 6} textAnchor="middle" fill="#e94560" fontSize="9">50%</text>)}
            </svg>);
          };

          // === GUARDIA NO-PEEK / INTEGRITÀ DATI (Q3) ===
          // Verifica coerenze che sarebbero violate se le statistiche "sbirciassero il futuro"
          // o se i dati fossero corrotti. High/Low provengono da calculateHistoricalMinMax del
          // tracker, che include SOLO candele post-startDate (giorno d'ingresso escluso): perciò
          // high<start o low>start su una stima con dati sono red flag.
          const auditIntegrity = rows => {
            const checks = [
              { key: 'startPricePos', label: 'Prezzo iniziale > 0', hint: 'startPrice mancante o ≤ 0', test: e => !(N(e.startPrice, 0) > 0) },
              { key: 'currentPresent', label: 'Prezzo corrente presente', hint: 'currentPrice mancante', test: e => N(e.currentPrice, null) === null },
              { key: 'highGteStart', label: 'High ≥ prezzo iniziale', hint: 'High storico sotto il prezzo di ingresso (possibile peek/corruzione)', test: e => { const s = N(e.startPrice, null), h = N(e.highPrice, null); return s !== null && h !== null && h < s - 1e-9; } },
              { key: 'lowLteStart', label: 'Low ≤ prezzo iniziale', hint: 'Low storico sopra il prezzo di ingresso', test: e => { const s = N(e.startPrice, null), l = N(e.lowPrice, null); return s !== null && l !== null && l > s + 1e-9; } },
              { key: 'highGteLow', label: 'High ≥ Low', hint: 'Range storico invertito', test: e => { const h = N(e.highPrice, null), l = N(e.lowPrice, null); return h !== null && l !== null && h < l - 1e-9; } },
              { key: 'endAfterStart', label: 'Data fine ≥ data inizio', hint: 'endDate precedente a startDate', test: e => e.endDate && e.startDate && new Date(e.endDate) < new Date(e.startDate) },
              { key: 'closedHasEnd', label: 'Stima chiusa ha data/prezzo fine', hint: 'Chiusa senza endDate o endPrice', test: e => isClosed(e) && (!e.endDate || N(e.endPrice, null) === null) },
              { key: 'confRange', label: 'Confidence in [0,100]', hint: 'Confidence fuori range', test: e => { const c = N(e.confidence, null); return c !== null && (c < 0 || c > 100); } },
            ];
            const results = checks.map(c => { const bad = rows.filter(c.test); return { key: c.key, label: c.label, hint: c.hint, count: bad.length, samples: bad.slice(0, 5).map(e => e.ticker || e.id) }; });
            const affected = new Set();
            results.forEach(r => rows.filter(checks.find(c => c.key === r.key).test).forEach(e => affected.add(e.id ?? e.ticker)));
            const totalAnomalies = results.reduce((s, r) => s + r.count, 0);
            const withHL = rows.filter(e => N(e.highPrice, null) !== null && N(e.lowPrice, null) !== null).length;
            return { results, totalAnomalies, rowsAffected: affected.size, nRows: rows.length, withHL };
          };

          // === SFONDO MERCATO AGGREGATO (Q2) ===
          // Per ogni trimestre, win rate e buy&hold medio di TUTTE le IA insieme: è il "contesto".
          // Se una singola IA cala mentre l'aggregato cala, è il mercato; se cala da sola, è l'IA.
          const marketBackdrop = rows => {
            const closed = rows.filter(e => isClosed(e) && e.endDate);
            const byQ = groupBy(closed, e => quarterKey(e.endDate));
            return Object.keys(byQ).sort().map(q => {
              const g = byQ[q]; const bh = g.map(buyHold).filter(x => x !== null);
              return { t: q, aggWin: g.filter(isWin).length / g.length * 100, aggBH: bh.length ? MEAN(bh) : null, n: g.length };
            });
          };
          // Correlazione tra la serie win% per-trimestre di un'IA e l'aggregato (co-movimento col mercato)
          const corrWithMarket = (aiPoints, backdrop) => {
            const bmap = {}; backdrop.forEach(b => bmap[b.t] = b.aggWin);
            const pairs = aiPoints.filter(p => bmap[p.t] !== undefined).map(p => [p.v, bmap[p.t]]);
            if (pairs.length < 3) return null;
            const xs = pairs.map(p => p[0]), ys = pairs.map(p => p[1]);
            const mx = MEAN(xs), my = MEAN(ys), sx = STD(xs), sy = STD(ys);
            if (sx === 0 || sy === 0) return null;
            const cov = MEAN(pairs.map(p => (p[0] - mx) * (p[1] - my))) * pairs.length / (pairs.length - 1);
            return cov / (sx * sy);
          };

          // erf per p-value normale (approssimazione Abramowitz-Stegun)
          const erf = x => { const t = 1 / (1 + 0.3275911 * Math.abs(x)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; };
          const normTwoSided = z => Math.min(1, 2 * (1 - 0.5 * (1 + erf(Math.abs(z) / Math.SQRT2))));

          // === DRIFT temporale: prima metà vs seconda metà (per endDate) ===
          const driftHalves = arr => {
            const closed = arr.filter(e => isClosed(e) && e.endDate).sort((a, b) => new Date(a.endDate) - new Date(b.endDate));
            const n = closed.length;
            if (n < 4) return { n, insufficient: true };
            const mid = Math.floor(n / 2);
            const h1 = closed.slice(0, mid), h2 = closed.slice(mid);
            const wr = g => g.length ? g.filter(isWin).length / g.length * 100 : null;
            const al = g => { const v = g.map(alphaOf).filter(x => x !== null); return v.length ? MEAN(v) : null; };
            const wr1 = wr(h1), wr2 = wr(h2), delta = wr2 - wr1;
            const a1 = al(h1), a2 = al(h2), aDelta = (a1 !== null && a2 !== null) ? a2 - a1 : null;
            const p1 = h1.filter(isWin).length / h1.length, p2 = h2.filter(isWin).length / h2.length;
            const pooled = (h1.filter(isWin).length + h2.filter(isWin).length) / n;
            const se = Math.sqrt(pooled * (1 - pooled) * (1 / h1.length + 1 / h2.length));
            const z = se > 0 ? (p2 - p1) / se : 0;
            const pv = se > 0 ? normTwoSided(z) : 1;
            const sig = pv < 0.05;
            const trend = delta > 5 ? 'migliora' : delta < -5 ? 'peggiora' : 'stabile';
            return { n, n1: h1.length, n2: h2.length, wr1, wr2, delta, a1, a2, aDelta, z, pv, sig, trend };
          };

          // === Media mobile a N trade (win rate) ===
          const rollingWin = (arr, W) => {
            const closed = arr.filter(e => isClosed(e) && e.endDate).sort((a, b) => new Date(a.endDate) - new Date(b.endDate));
            const pts = [];
            for (let i = 0; i < closed.length; i++) { const from = Math.max(0, i - W + 1); const win = closed.slice(from, i + 1); pts.push({ t: `#${i + 1}`, v: win.filter(isWin).length / win.length * 100 }); }
            return pts;
          };

          // === PESO PER CONFIDENCE DICHIARATA (Q1) ===
          // Confidence-Weighted Win Rate: Σ(conf·win)/Σ(conf) — se un'IA vince solo le low-conf
          //   e perde le high-conf, questo crolla sotto il win rate semplice.
          // Correlazione point-biserial confidence↔esito: >0 la confidence discrimina davvero,
          //   ~0 è rumore, <0 è controproducente.
          // Split high/low per confidence mediana.
          const confAnalysis = arr => {
            const closed = arr.filter(isClosed);
            if (!closed.length) return null;
            const conf = closed.map(e => N(e.confidence, 75));
            const win = closed.map(e => isWin(e) ? 1 : 0);
            const den = SUM(conf);
            const cwWin = den > 0 ? SUM(conf.map((c, i) => c * win[i])) / den * 100 : null;
            const plainWin = MEAN(win) * 100;
            const mc = MEAN(conf), mw = MEAN(win), sc = STD(conf), sw = STD(win);
            let r = null;
            if (sc > 0 && sw > 0 && closed.length > 1) {
              const cov = MEAN(conf.map((c, i) => (c - mc) * (win[i] - mw))) * closed.length / (closed.length - 1);
              r = cov / (sc * sw);
            }
            const med = [...conf].sort((a, b) => a - b)[Math.floor(closed.length / 2)];
            const hi = closed.filter(e => N(e.confidence, 75) >= med), lo = closed.filter(e => N(e.confidence, 75) < med);
            const wr = g => g.length ? g.filter(isWin).length / g.length * 100 : null;
            let discern = 'incerto';
            if (r !== null) { if (r >= 0.2) discern = 'discrimina'; else if (r <= -0.2) discern = 'controproducente'; else discern = 'rumore'; }
            return { cwWin, plainWin, gap: cwWin === null ? null : cwWin - plainWin, r, med, hiWin: wr(hi), loWin: wr(lo), nHi: hi.length, nLo: lo.length, discern, n: closed.length };
          };

          // === Split per versione PROMPT (non modello IA) — vista secondaria ===
          const byPromptVersion = arr => {
            const closed = arr.filter(isClosed);
            const g = groupBy(closed, e => `v${parseInt(N(e.version, 1)) || 1}`);
            return Object.entries(g).map(([v, rows]) => ({
              version: v, n: rows.length,
              winRate: rows.length ? rows.filter(isWin).length / rows.length * 100 : null,
              avgAlpha: (() => { const a = rows.map(alphaOf).filter(x => x !== null); return a.length ? MEAN(a) : null; })(),
              expectancy: rows.length ? MEAN(rows.map(e => N(e.profitLossPercent, 0))) : null,
            })).sort((a, b) => parseInt(a.version.slice(1)) - parseInt(b.version.slice(1)));
          };

          // Sparkline storico del leader di affidabilità (dagli snapshot giornalieri)
          const VerdictTrend = ({ snapshots }) => {
            const pts = (snapshots || []).filter(s => s && s.mostReliableRaw && s.mostReliableRaw.score != null);
            if (pts.length < 2) return <div className="text-xs text-gray-500">Storico insufficiente: servono almeno 2 giorni di snapshot (se ne salva 1 al giorno all'apertura del programma).</div>;
            const W = 720, H = 150, P = { t: 12, r: 16, b: 22, l: 34 }; const pw = W - P.l - P.r, ph = H - P.t - P.b;
            const x = i => P.l + (pts.length <= 1 ? pw / 2 : i / (pts.length - 1) * pw);
