                        <div className="text-sm font-bold text-white">{trend.earningsEstimateAvg ? `$${trend.earningsEstimateAvg.toFixed(2)}` : 'N/A'}</div>
                      </div>
                      <div className="bg-black/20 rounded-lg p-3">
                        <div className="text-xs text-gray-400">Revenue Estimate Avg</div>
                        <div className="text-sm font-bold text-white">{trend.revenueEstimateAvg ? `$${trend.revenueEstimateAvg.toLocaleString()}` : 'N/A'}</div>
                      </div>
                      <div className="bg-black/20 rounded-lg p-3">
                        <div className="text-xs text-gray-400">Num Analysts</div>
                        <div className="text-sm font-bold text-white">{trend.numberOfAnalysts || 'N/A'}</div>
                      </div>
                    </div>
                  </div>
                </div>
                <div className="p-4 border-t border-white/10 bg-surface flex justify-end">
                  <button onClick={onClose} className="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg font-bold transition-all">
                    Chiudi
                  </button>
                </div>
              </div>
            </div>
          );
        };

        // Dashboard Component (NEW)
        const Dashboard = ({ estimates, switchTab }) => {
          const stats = useMemo(() => {
            const active = estimates.filter(e => e.status === 'active');
            const completed = estimates.filter(e => e.status !== 'active');
            const totalPL = estimates.reduce((s, e) => s + e.profitLoss, 0);
            const totalInvested = estimates.reduce((s, e) => s + e.amount, 0);
            
            // AI Performance
            const aiPerf = {};
            estimates.forEach(e => {
              if (!aiPerf[e.aiName]) aiPerf[e.aiName] = { total: 0, profit: 0, positive: 0 };
              aiPerf[e.aiName].total++;
              aiPerf[e.aiName].profit += e.profitLoss;
              if (e.profitLossPercent > 0) aiPerf[e.aiName].positive++;
            });
            
            const bestAI = Object.entries(aiPerf).sort((a, b) => b[1].profit - a[1].profit)[0];
            
            // Top/Worst performers
            const sorted = [...estimates].sort((a, b) => b.profitLossPercent - a.profitLossPercent);
            
            return { 
              active: active.length, 
              completed: completed.length, 
              totalPL, 
              totalInvested,
              roi: totalInvested > 0 ? (totalPL / totalInvested * 100) : 0,
              bestAI: bestAI ? { name: bestAI[0], ...bestAI[1] } : null,
              topPerformer: sorted[0],
              worstPerformer: sorted[sorted.length - 1],
              aiPerf: Object.entries(aiPerf).map(([name, data]) => ({ name, ...data }))
            };
          }, [estimates]);

          const recentHistory = useMemo(() => {
            return estimates
              .filter(e => e.lastUpdate)
              .sort((a, b) => new Date(b.lastUpdate) - new Date(a.lastUpdate))
              .slice(0, 5);
          }, [estimates]);

          if (estimates.length === 0) {
            return (
              <div className="flex flex-col items-center justify-center h-[60vh] text-center space-y-6 animate-fade-in">
                <div className="text-8xl animate-bounce-subtle">🚀</div>
                <h2 className="text-3xl font-bold gradient-text">Benvenuto in AI Stock Tracker Pro</h2>
                <p className="text-gray-400 max-w-md">Inizia aggiungendo la tua prima stima per tracciare le performance dei modelli AI.</p>
                <button 
                  onClick={() => switchTab('input')}
                  className="px-8 py-4 bg-gradient-to-r from-accent-blue to-accent-purple rounded-xl font-bold text-white shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all"
                >
                  ➕ Aggiungi Prima Stima
                </button>
              </div>
            );
          }

          return (
            <div className="space-y-6 animate-fade-in">
              {/* Main Stats */}
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div className="glass rounded-2xl p-5 text-center hover:scale-105 transition-transform">
                  <div className="text-4xl mb-2">📊</div>
                  <div className="text-3xl font-bold text-white">{estimates.length}</div>
                  <div className="text-sm text-gray-400">Stime Totali</div>
                </div>
                <div className="glass rounded-2xl p-5 text-center hover:scale-105 transition-transform">
                  <div className="text-4xl mb-2">🟢</div>
                  <div className="text-3xl font-bold text-emerald-400">{stats.active}</div>
                  <div className="text-sm text-gray-400">Attive</div>
                </div>
                <div className="glass rounded-2xl p-5 text-center hover:scale-105 transition-transform">
                  <div className="text-4xl mb-2">💰</div>
                  <div className={`text-3xl font-bold ${stats.totalPL >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                    {stats.totalPL >= 0 ? '+' : ''}€{stats.totalPL.toFixed(0)}
                  </div>
                  <div className="text-sm text-gray-400">P&L Totale</div>
                </div>
                <div className="glass rounded-2xl p-5 text-center hover:scale-105 transition-transform">
                  <div className="text-4xl mb-2">📈</div>
                  <div className={`text-3xl font-bold ${stats.roi >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                    {stats.roi >= 0 ? '+' : ''}{stats.roi.toFixed(1)}%
                  </div>
                  <div className="text-sm text-gray-400">ROI</div>
                </div>
              </div>

              {/* Charts Row */}
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                {/* AI Performance Chart */}
                <div className="glass rounded-2xl p-6">
                  <h3 className="text-lg font-bold mb-4 text-gray-300">Performance per AI</h3>
                  <div className="h-64">
                    <ResponsiveContainer width="100%" height="100%">
                      <BarChart data={stats.aiPerf}>
                        <CartesianGrid strokeDasharray="3 3" stroke="#ffffff10" />
                        <XAxis dataKey="name" stroke="#8888aa" fontSize={12} />
                        <YAxis stroke="#8888aa" />
                        <Tooltip 
                          contentStyle={{ backgroundColor: '#16213e', borderColor: '#ffffff20' }}
                          formatter={(value) => [`€${value.toFixed(2)}`, 'P&L']}
                        />
                        <Bar dataKey="profit" radius={[4, 4, 0, 0]}>
                          {stats.aiPerf.map((entry, index) => (
                            <Cell key={`cell-${index}`} fill={entry.profit >= 0 ? '#00b09b' : '#ea1e63'} fillOpacity={0.8} />
                          ))}
                        </Bar>
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                {/* Quick Actions & Best/Worst */}
                <div className="space-y-4">
                  {stats.bestAI && (
                    <div className="glass rounded-2xl p-5 border-l-4 border-emerald-500">
                      <div className="flex items-center gap-3">
                        <span className="text-3xl">{AI_ICONS[stats.bestAI.name] || '🤖'}</span>
                        <div>
                          <div className="text-sm text-gray-400">Miglior AI</div>
                          <div className="text-xl font-bold text-white">{stats.bestAI.name}</div>
                          <div className="text-emerald-400 font-medium">+€{stats.bestAI.profit.toFixed(2)}</div>
                        </div>
                      </div>
                    </div>
                  )}

                  {stats.topPerformer && (
                    <div className="glass rounded-2xl p-5 border-l-4 border-accent-blue">
                      <div className="text-sm text-gray-400 mb-1">🏆 Top Performer</div>
                      <div className="flex justify-between items-center">
                        <span className="text-lg font-bold text-white">{stats.topPerformer.ticker}</span>
                        <span className="text-emerald-400 font-bold">+{stats.topPerformer.profitLossPercent.toFixed(2)}%</span>
                      </div>
                    </div>
                  )}

                  {stats.worstPerformer && stats.worstPerformer.profitLossPercent < 0 && (
                    <div className="glass rounded-2xl p-5 border-l-4 border-red-500">
                      <div className="text-sm text-gray-400 mb-1">📉 Peggiore</div>
                      <div className="flex justify-between items-center">
                        <span className="text-lg font-bold text-white">{stats.worstPerformer.ticker}</span>
                        <span className="text-red-400 font-bold">{stats.worstPerformer.profitLossPercent.toFixed(2)}%</span>
                      </div>
                    </div>
                  )}

                  {/* Quick Actions */}
                  <div className="grid grid-cols-2 gap-3">
                    <button onClick={() => switchTab('input')} className="glass p-4 rounded-xl hover:bg-white/5 transition-colors text-center">
                      <div className="text-2xl mb-1">➕</div>
                      <div className="text-sm text-gray-300">Nuova Stima</div>
                    </button>
                    <button onClick={() => switchTab('estimates')} className="glass p-4 rounded-xl hover:bg-white/5 transition-colors text-center">
                      <div className="text-2xl mb-1">🔄</div>
                      <div className="text-sm text-gray-300">Aggiorna Prezzi</div>
                    </button>
                  </div>
                </div>
              </div>

              {/* Recent Activity */}
              {recentHistory.length > 0 && (
                <div className="glass rounded-2xl p-6">
                  <h3 className="text-lg font-bold mb-4 text-gray-300">Attività Recente</h3>
                  <div className="space-y-3">
                    {recentHistory.map(est => (
                      <div key={est.id} className="flex items-center justify-between p-3 bg-black/20 rounded-lg hover:bg-black/30 transition-colors">
                        <div className="flex items-center gap-3">
                          <span className="text-xl">{AI_ICONS[est.aiName] || '🤖'}</span>
                          <div>
                            <span className="font-bold text-white">{est.ticker}</span>
                            <span className="text-gray-500 text-sm ml-2">v{est.version}</span>
                          </div>
                        </div>
                        <div className="text-right">
                          <div className={`font-bold ${est.profitLossPercent >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                            {est.profitLossPercent >= 0 ? '+' : ''}{est.profitLossPercent.toFixed(2)}%
                          </div>
                          <div className="text-xs text-gray-500">
                            {new Date(est.lastUpdate).toLocaleString()}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          );
        };

        // Estimate Form
        const EstimateForm = ({ onAdd, onRemove, onLog, finnhubKey, isOnline, switchTab, estimates }) => {
          const toast = useToast();
          
          // Load default settings from localStorage (NEW)
          const loadDefaultSettings = () => {
            const defaults = JSON.parse(localStorage.getItem('defaultSettings') || '{"duration":"60","profitTarget":"10","stopLoss":"10","amount":"100","confidence":"75"}');
            return defaults;
          };
          
          const getLastVersion = () => {
            if (!estimates || estimates.length === 0) return '1';
            return String(Math.max(...estimates.map(e => e.version)));
          };

          const defaults = loadDefaultSettings();
          const [formData, setFormData] = useState({
            aiName: '', duration: defaults.duration, profitTarget: defaults.profitTarget, stopLoss: defaults.stopLoss, amount: defaults.amount, version: getLastVersion(), confidence: defaults.confidence
          });

          useEffect(() => {
            setFormData(prev => ({ ...prev, version: getLastVersion() }));
          }, [estimates]);
          
          const [searchQuery, setSearchQuery] = useState('');
          const [searchResults, setSearchResults] = useState([]);
          const [isSearching, setIsSearching] = useState(false);
          const [selectedTicker, setSelectedTicker] = useState(null);
          const [showResults, setShowResults] = useState(false);
          const [loadingPrice, setLoadingPrice] = useState(false);
          const [loadingProfile, setLoadingProfile] = useState(false);
          const [lastEstimate, setLastEstimate] = useState(null);
          const [loadingMessage, setLoadingMessage] = useState('');

          useEffect(() => {
            const timer = setTimeout(async () => {
              if (searchQuery.length >= 2 && !selectedTicker && isOnline) {
                setIsSearching(true);
                try {
                  const results = await searchTicker(searchQuery, finnhubKey);
                  setSearchResults(results.slice(0, 10));
                  setShowResults(true);
                } catch (e) {
                  toast.addToast(`Errore ricerca: ${e.message}`, 'error');
                } finally {
                  setIsSearching(false);
                }
              } else {
                setSearchResults([]);
              }
            }, 500);
            return () => clearTimeout(timer);
          }, [searchQuery, finnhubKey, selectedTicker, isOnline]);

          const handleSelectTicker = (result) => {
            setSelectedTicker(result);
            setSearchQuery(result.symbol);
            setShowResults(false);
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            if (!selectedTicker) { 
              toast.addToast('Seleziona un ticker dalla ricerca', 'warning'); 
              return; 
            }

            setLoadingPrice(true);
            setLoadingProfile(true);
            let startTime = Date.now();
            setLoadingMessage(`⏳ Caricamento prezzo in tempo reale...\n📡 Endpoint: https://query1.finance.yahoo.com/v8/finance/chart/${selectedTicker.symbol}?interval=1d&range=5d`);
            let priceData = null;
            let assetProfile = null;
            let fundamentals = null;
            let hasPriceError = false;
            let hasProfileError = false;
            let hasFundamentalsError = false;
            
            try {
              // Scarica prezzo
              try {
                const priceStart = Date.now();
                priceData = await getStockPrice(selectedTicker.symbol);
                const priceTime = Date.now() - priceStart;
                setLoadingMessage(`✅ Prezzo ottenuto (${(priceTime / 1000).toFixed(1)}s)\n💰 Prezzo: $${priceData.current.toFixed(2)}\n📊 Volume: ${priceData.volume}\n\n⏳ Caricamento analytics...`);
                toast.addToast('Prezzo ottenuto con successo', 'success');
              } catch (priceError) {
                hasPriceError = true;
                const priceTime = Date.now() - startTime;
                setLoadingMessage(`❌ Errore recupero prezzo (${(priceTime / 1000).toFixed(1)}s)\n📡 Endpoint: Yahoo Finance Chart API\n🔍 Errore: ${priceError.message}\n\n⏳ Tentativo analytics...`);
                toast.addToast(`Errore recupero prezzo: ${priceError.message}`, 'warning');
                onLog(`Errore prezzo ${selectedTicker.symbol}: ${priceError.message}`, 'warning');
                priceData = { current: 0, dayHigh: 0, dayLow: 0, previousClose: 0, volume: 0 };
              }
              
              // Scarica asset profile e fundamentals
              try {
                const analyticsStart = Date.now();
                [assetProfile, fundamentals] = await Promise.all([
                  getAssetProfile(selectedTicker.symbol),
                  getFundamentals(selectedTicker.symbol)
                ]);
                const analyticsTime = Date.now() - analyticsStart;
                const recCount = fundamentals.recommendationTrend ? 
                  (fundamentals.recommendationTrend.strongBuy || 0) + (fundamentals.recommendationTrend.buy || 0) + 
                  (fundamentals.recommendationTrend.hold || 0) + (fundamentals.recommendationTrend.sell || 0) + 
                  (fundamentals.recommendationTrend.strongSell || 0) : 0;
                setLoadingMessage(prev => prev + `\n✅ Analytics completati (${(analyticsTime / 1000).toFixed(1)}s)\n🏢 Settore: ${assetProfile.sector}\n📈 Raccomandazioni: ${recCount}\n\n⏳ Salvataggio su Drive...`);
                toast.addToast('Profilo e fundamentals ottenuti', 'success');
              } catch (profileError) {
                hasProfileError = true;
                hasFundamentalsError = true;
                const analyticsTime = Date.now() - startTime;
                setLoadingMessage(prev => prev + `\n❌ Errore analytics (${(analyticsTime / 1000).toFixed(1)}s)\n📡 Endpoint: Yahoo QuoteSummary API\n🔍 Errore: ${profileError.message}\n\n⏳ Tentativo salvataggio...`);
                toast.addToast(`Errore recupero profilo/fundamentals: ${profileError.message}`, 'warning');
                onLog(`Errore profilo/fundamentals ${selectedTicker.symbol}: ${profileError.message}`, 'warning');
                assetProfile = { sector: 'N/A', industry: 'N/A', country: 'N/A', website: '', fullTimeEmployees: null };
                fundamentals = {};
              }
              
              // Salva CSV su Drive (non-blocking)
              const gasUrl = localStorage.getItem('gasUrl');
              if (gasUrl) {
                const priceDataForHistory = { open: priceData.current, high: priceData.current, low: priceData.current, close: priceData.current, adjClose: priceData.current, volume: priceData.volume || 0 };
                const historyRow = createHistoryRow(selectedTicker.symbol, priceDataForHistory, fundamentals);
                saveHistoryToDrive(gasUrl, selectedTicker.symbol, historyRow).catch(e => console.warn('Drive:', e));
                setLoadingMessage(prev => prev + `\n✅ CSV salvato su Drive\n📄 History_${selectedTicker.symbol}.csv`);
              } else {
                setLoadingMessage(prev => prev + `\n⚠️ Drive non configurato`);
              }
              
              const totalTime = Date.now() - startTime;
              
              if (!hasPriceError && !hasProfileError) {
                setLoadingMessage(`🎉 Stima creata con successo! (${(totalTime / 1000).toFixed(1)}s totale)`);
                setTimeout(() => setLoadingMessage(''), 3000); // Sparisce dopo 3s
              } else {
                setLoadingMessage(prev => prev + `\n⚠️ Stima creata con errori (${(totalTime / 1000).toFixed(1)}s totale)`);
                // Lascia visibile
              }
              
              setLoadingPrice(false);
              setLoadingProfile(false);
              
              if (hasPriceError && hasProfileError) {
                toast.addToast('Impossibile ottenere dati necessari. Riprova più tardi.', 'error');
                return;
              }
              
              if (hasPriceError) {
                toast.addToast('Stima creata senza prezzo corrente. Aggiorna manualmente.', 'warning');
              }
              
              const stopLossValue = -Math.abs(parseFloat(formData.stopLoss));

              const newEstimate = {
                id: Date.now(),
                aiName: formData.aiName,
                ticker: selectedTicker.symbol,
                startDate: new Date().toISOString(),
                duration: parseInt(formData.duration),
                profitTarget: parseFloat(formData.profitTarget),
                stopLoss: stopLossValue,
                amount: parseFloat(formData.amount),
                version: parseInt(formData.version),
                confidence: parseInt(formData.confidence) || 75,
                startPrice: priceData.current,
                currentPrice: priceData.current,
                highPrice: priceData.current,
                lowPrice: priceData.current,
                assetProfile: assetProfile,
                lastFundamentals: fundamentals,
                status: 'active',
                endDate: null,
                endPrice: null,
                profitLoss: 0,
                profitLossPercent: 0,
                lastUpdate: new Date().toISOString(),
                exitReason: null
              };

              onAdd(newEstimate);
              setLastEstimate(newEstimate);
              
              const newDefaults = loadDefaultSettings();
              setFormData({ aiName: '', duration: newDefaults.duration, profitTarget: newDefaults.profitTarget, stopLoss: newDefaults.stopLoss, amount: newDefaults.amount, version: getLastVersion(), confidence: newDefaults.confidence });
              setSelectedTicker(null);
              setSearchQuery('');
              
              let successMessage = `Stima aggiunta: ${newEstimate.ticker}`;
              if (!hasPriceError) {
                successMessage += ` @ $${newEstimate.startPrice.toFixed(2)}`;
              } else {
                successMessage += ' (prezzo non disponibile)';
              }
              toast.addToast(successMessage, 'success');
              onLog(`Nuova stima: ${newEstimate.ticker}`, 'success');

            } catch (error) {
              toast.addToast(`Errore generale: ${error.message}`, 'error');
              onLog(`Errore creazione: ${error.message}`, 'error');
              setLoadingPrice(false);
              setLoadingProfile(false);
            }
          };

          const handleUndo = () => {
            if (lastEstimate) {
              onRemove(lastEstimate.id, true);
              setLastEstimate(null);
              toast.addToast('Stima eliminata', 'warning');
              onLog('Inserimento annullato', 'warning');
            }
          };

          return (
            <div className="space-y-6 animate-fade-in">
              {!isOnline && (
                <div className="bg-red-500/20 border-l-4 border-red-500 p-4 rounded-xl text-red-200 animate-slide-in">
                  <p className="font-bold">⚠️ API Key Finnhub mancante</p>
                  <p className="text-sm">Configura la chiave nelle impostazioni per abilitare la ricerca ticker.</p>
                </div>
              )}

              <div className="glass rounded-2xl p-6 shadow-xl">
                <h2 className="text-2xl font-bold mb-6 gradient-text">Inserisci Nuova Stima</h2>

                <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Modello IA *</label>
                    <select required className="bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all"
                      value={formData.aiName} onChange={(e) => setFormData({...formData, aiName: e.target.value})}>
                      <option value="">Seleziona IA...</option>
                      {AI_OPTIONS.map(ai => <option key={ai} value={ai}>{AI_ICONS[ai]} {ai}</option>)}
                    </select>
                  </div>

                  <div className="flex flex-col relative z-50">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Cerca Ticker *</label>
                    <div className="relative">
                      <input type="text" placeholder={isOnline ? "Es. AAPL, TSLA..." : "Configura API Key"} disabled={!isOnline}
                        className="w-full bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all disabled:opacity-50"
                        value={searchQuery} onChange={(e) => { setSearchQuery(e.target.value); if(selectedTicker && e.target.value !== selectedTicker.symbol) setSelectedTicker(null); }}
                      />
                      {isSearching && <div className="absolute right-3 top-3 animate-spin h-5 w-5 border-2 border-accent-blue rounded-full border-t-transparent"></div>}
                      {selectedTicker && <div className="absolute right-3 top-3 text-emerald-400">✓</div>}
                    </div>
                    {showResults && searchResults.length > 0 && (
                      <div className="absolute top-full left-0 right-0 mt-2 bg-background border border-gray-700 rounded-lg shadow-2xl max-h-60 overflow-y-auto z-[100]">
                        {searchResults.map(result => (
                          <div key={result.symbol} className="p-3 hover:bg-accent-blue/20 cursor-pointer border-b border-gray-800 transition-colors" onClick={() => handleSelectTicker(result)}>
                            <div className="font-bold text-white flex justify-between">{result.symbol} <span className="text-xs bg-accent-blue/50 px-2 py-0.5 rounded">{result.type}</span></div>
                            <div className="text-xs text-gray-400 truncate">{result.description}</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Durata (Giorni)</label>
                    <input type="number" min="1" required className="bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all"
                      value={formData.duration} onChange={e => setFormData({...formData, duration: e.target.value})} />
                  </div>
                  
                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Target Profitto (%)</label>
                    <input type="number" step="0.1" min="0.1" required className="bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all"
                      value={formData.profitTarget} onChange={e => setFormData({...formData, profitTarget: e.target.value})} />
                  </div>
                  
                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Stop Loss (%)</label>
                    <input type="number" step="0.1" min="0.1" required placeholder="Es: 10 per -10%" className="bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all"
                      value={formData.stopLoss} onChange={e => setFormData({...formData, stopLoss: e.target.value})} />
                  </div>
                  
                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Importo (€)</label>
                    <input type="number" min="1" step="0.01" required className="bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all"
                      value={formData.amount} onChange={e => setFormData({...formData, amount: e.target.value})} />
                  </div>
                  
                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Versione Modello</label>
                    <input type="number" min="1" required className="bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all"
                      value={formData.version} onChange={e => setFormData({...formData, version: e.target.value})} />
                  </div>
                  
                  <div className="flex flex-col">
                    <label className="text-gray-400 text-sm font-semibold mb-2">Confidence Score (0-100)</label>
                    <div className="relative">
                      <input type="number" min="0" max="100" required className="bg-background border border-gray-700 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none focus:ring-2 focus:ring-accent-blue/20 transition-all w-full"
                        value={formData.confidence} onChange={e => setFormData({...formData, confidence: Math.min(100, Math.max(0, e.target.value))})} />
                    </div>
                    <div className="mt-2 h-2 bg-gray-700 rounded-full overflow-hidden">
                      <div className="h-full transition-all duration-300" style={{
                        width: `${formData.confidence}%`,
                        background: formData.confidence >= 80 ? 'linear-gradient(90deg, #00b09b, #96c93d)' : 
                                   formData.confidence >= 75 ? 'linear-gradient(90deg, #f7971e, #ffd200)' : 
                                   'linear-gradient(90deg, #eb3349, #f45c43)'
                      }}></div>
                    </div>
                  </div>

                  <div className="md:col-span-2 lg:col-span-3 pt-4">
                    <button type="submit" disabled={(loadingPrice || loadingProfile) || !isOnline}
                      className={`w-full py-4 rounded-xl font-bold text-lg shadow-lg transform transition-all hover:-translate-y-1 hover:shadow-2xl flex justify-center items-center gap-2
                        ${(loadingPrice || loadingProfile) || !isOnline ? 'bg-gray-600 cursor-not-allowed opacity-50' : 'bg-gradient-to-r from-emerald-500 to-emerald-700 text-white hover:from-emerald-400 hover:to-emerald-600'}`}>
                      {(loadingPrice || loadingProfile) ? (
                        <div className="flex items-center gap-2">
                          <div className="animate-spin h-5 w-5 border-2 border-white rounded-full border-t-transparent"></div>
                          <span>{loadingPrice ? 'Caricamento prezzo...' : 'Caricamento profilo...'}</span>
                        </div>
                      ) : '🚀 Conferma Inserimento'}
                    </button>
                  </div>
                </form>

                {loadingMessage && (
                  <div className="mt-4 p-3 bg-blue-500/20 border border-blue-500/30 rounded-lg text-blue-200 text-left animate-pulse" style={{ whiteSpace: 'pre-line' }}>
                    <div className="flex items-start gap-2">
                      <div className="animate-spin h-4 w-4 border-2 border-blue-400 rounded-full border-t-transparent mt-1"></div>
                      <span>{loadingMessage}</span>
                    </div>
                  </div>
                )}
              </div>

              {lastEstimate && (
                <div className="glass border-emerald-500/50 rounded-2xl p-6 shadow-lg shadow-emerald-500/10 animate-slide-up">
                  <div className="flex items-center justify-between mb-4 border-b border-gray-700/50 pb-3">
                    <div className="flex items-center gap-3">
                      <span className="text-2xl bg-emerald-500/20 p-2 rounded-lg">✅</span>
                      <div>
                        <h3 className="text-xl font-bold text-white">Stima Inserita</h3>
                        <p className="text-sm text-gray-400">Riepilogo operazione</p>
                      </div>
                    </div>
                    <span className="text-4xl">{AI_ICONS[lastEstimate.aiName]}</span>
                  </div>
                  
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                    <div className="bg-black/30 p-3 rounded-lg">
                      <span className="text-gray-500 block">Ticker</span>
                      <span className="text-lg font-bold text-emerald-400">{lastEstimate.ticker}</span>
                    </div>
                    <div className="bg-black/30 p-3 rounded-lg">
                      <span className="text-gray-500 block">Prezzo</span>
                      <span className="text-lg font-bold text-white">${lastEstimate.startPrice.toFixed(2)}</span>
                    </div>
                    <div className="bg-black/30 p-3 rounded-lg border border-emerald-500/30">
                      <span className="text-gray-500 block">Target</span>
                      <span className="font-bold text-emerald-400">+{lastEstimate.profitTarget}%</span>
                    </div>
                    <div className="bg-black/30 p-3 rounded-lg border border-red-500/30">
                      <span className="text-gray-500 block">Stop Loss</span>
                      <span className="font-bold text-red-400">{lastEstimate.stopLoss}%</span>
                    </div>
                  </div>
                  
                  <div className="mt-4 flex gap-4 justify-center">
                    <button onClick={() => switchTab('estimates')} className="text-emerald-400 hover:text-emerald-300 underline text-sm font-semibold">
                      Visualizza Stime →
                    </button>
                    <button onClick={handleUndo} className="text-red-400 hover:text-red-300 underline text-sm flex items-center gap-1 font-semibold">
                      🗑️ Annulla
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        };

        // Estimate List with Sorting (IMPROVED)
        const EstimateList = ({ estimates, onUpdateEstimate, onRemove, onLog, autoRefresh, setAutoRefresh }) => {
          const toast = useToast();
          const [expandedGroups, setExpandedGroups] = useState({});
          const [isAllExpanded, setIsAllExpanded] = useState(true);
          
          // Sorting State (NEW)
          const [sortConfig, setSortConfig] = useState({ key: 'startDate', direction: 'desc' });
          
          // Filter State
          const initialFilters = { ticker: '', dateFrom: '', dateTo: '', status: 'all', varOp: 'gt', varVal: '', pnlOp: 'gt', pnlVal: '', aiName: 'all', confOp: 'gte', confVal: '' };
          const [filters, setFilters] = useState(initialFilters);
          const [showFilters, setShowFilters] = useState(false);

          // Modal State
          const [showUpdateModal, setShowUpdateModal] = useState(false);
          const [updateProgress, setUpdateProgress] = useState({ current: 0, total: 0, currentTicker: '' });
          const [updateResults, setUpdateResults] = useState([]);
          const [isUpdateFinished, setIsUpdateFinished] = useState(false);
          const [hasUpdateError, setHasUpdateError] = useState(false);
          const [updatePaused, setUpdatePaused] = useState(false);
          const updateControlRef = useRef({ paused: false, shouldStop: false });
          const [showTickerDetailsModal, setShowTickerDetailsModal] = useState(false);
          const [selectedEstimateForDetails, setSelectedEstimateForDetails] = useState(null);

          // Auto-refresh timer ref
          const autoRefreshRef = useRef(null);

          // Filtering Logic
          const filteredEstimates = useMemo(() => {
            return estimates.filter(est => {
              if (filters.ticker && !est.ticker.toLowerCase().includes(filters.ticker.toLowerCase())) return false;
              
              // Status filter with special cases
              if (filters.status === 'concluse') {
                if (!est.status.startsWith('completed-')) return false;
              } else if (filters.status === 'scadute') {
                if (est.status !== 'completed-negative' || est.exitReason !== 'timeout') return false;
              } else if (filters.status !== 'all' && filters.status !== est.status) {
                return false;
              }
              const estDate = new Date(est.startDate);
              if (filters.dateFrom && estDate < new Date(filters.dateFrom)) return false;
              if (filters.dateTo) {
                const toDate = new Date(filters.dateTo);
                toDate.setHours(23, 59, 59, 999);
                if (estDate > toDate) return false;
              }
              if (filters.varVal !== '') {
                const val = parseFloat(filters.varVal);
                if (!isNaN(val)) {
                  if (filters.varOp === 'gt' && est.profitLossPercent <= val) return false;
                  if (filters.varOp === 'lt' && est.profitLossPercent >= val) return false;
                }
              }
              if (filters.pnlVal !== '') {
                const val = parseFloat(filters.pnlVal);
                if (!isNaN(val)) {
                  if (filters.pnlOp === 'gt' && est.profitLoss <= val) return false;
                  if (filters.pnlOp === 'lt' && est.profitLoss >= val) return false;
                }
              }
              // Filtro AI
              if (filters.aiName !== 'all' && est.aiName !== filters.aiName) return false;
              // Filtro Confidence
              if (filters.confVal !== '') {
                const val = parseFloat(filters.confVal);
                const estConf = est.confidence ?? 75;
                if (!isNaN(val)) {
                  if (filters.confOp === 'gte' && estConf < val) return false;
                  if (filters.confOp === 'lte' && estConf > val) return false;
                  if (filters.confOp === 'eq' && estConf !== val) return false;
                }
              }
              return true;
            });
          }, [estimates, filters]);

          // Sorting Logic (NEW)
          const sortedEstimates = useMemo(() => {
            const sorted = [...filteredEstimates];
            sorted.sort((a, b) => {
              let aVal = a[sortConfig.key];
              let bVal = b[sortConfig.key];
              
              if (sortConfig.key === 'startDate' || sortConfig.key === 'lastUpdate') {
                aVal = new Date(aVal).getTime();
                bVal = new Date(bVal).getTime();
              }
              
              if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
              if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
              return 0;
            });
            return sorted;
          }, [filteredEstimates, sortConfig]);

          // Grouping
          const grouped = useMemo(() => {
            return sortedEstimates.reduce((acc, est) => {
              if (!acc[est.aiName]) acc[est.aiName] = [];
              acc[est.aiName].push(est);
              return acc;
            }, {});
          }, [sortedEstimates]);

          const handleSort = (key) => {
            setSortConfig(prev => ({
              key,
              direction: prev.key === key && prev.direction === 'desc' ? 'asc' : 'desc'
            }));
          };

          const toggleGroup = (ai) => {
            setExpandedGroups(prev => ({ ...prev, [ai]: prev[ai] === undefined ? !isAllExpanded : !prev[ai] }));
          };

          const toggleAll = () => {
            setIsAllExpanded(!isAllExpanded);
            setExpandedGroups({});
          };

          const resetFilters = () => setFilters(initialFilters);

          const updatePrices = async () => {
            const activeEstimates = estimates.filter(e => e.status === 'active');
            const uniqueTickers = Array.from(new Set(activeEstimates.map(e => e.ticker)));
            const gasUrl = localStorage.getItem('gasUrl') || '';
            
            setShowUpdateModal(true);
            setUpdateResults([]);
            setIsUpdateFinished(false);
            setHasUpdateError(false);
            setUpdateProgress({ current: 0, total: uniqueTickers.length, currentTicker: '' });
            setUpdatePaused(false);
            updateControlRef.current = { paused: false, shouldStop: false };

            if (activeEstimates.length === 0) {
              setUpdateResults([{ status: 'warning', ticker: 'Sistema', message: 'Nessuna stima attiva.', time: new Date().toLocaleTimeString() }]);
              setIsUpdateFinished(true);
              return;
            }

            let processedCount = 0;
            
            for (const ticker of uniqueTickers) {
              // Check pause/stop
              while (updateControlRef.current.paused) {
                await new Promise(r => setTimeout(r, 100));
              }
              if (updateControlRef.current.shouldStop) {
                setUpdateResults(prev => [...prev, { status: 'warning', ticker: 'Sistema', message: 'Aggiornamento annullato', time: new Date().toLocaleTimeString() }]);
                setIsUpdateFinished(true);
                setUpdatePaused(false);
                return;
              }
              
              const tickerStart = Date.now();
              setUpdateProgress(prev => ({ ...prev, current: processedCount + 1, currentTicker: ticker }));
              
              try {
                const estimatesForTicker = activeEstimates.filter(e => e.ticker === ticker);
                
                // Trova la stima più vecchia per questo ticker per determinare il range
                const oldestEstimate = estimatesForTicker.reduce((oldest, est) => 
                  new Date(est.startDate) < new Date(oldest.startDate) ? est : oldest
                );
                const daysSinceOldest = Math.ceil((Date.now() - new Date(oldestEstimate.startDate).getTime()) / 86400000);
                const range = calculateYahooRange(daysSinceOldest);
                
                // Scarica dati storici E fundamentals in parallelo (2 query per ticker)
                const dataStart = Date.now();
                const [historicalData, fundamentals] = await Promise.all([
                  getHistoricalData(ticker, range),
                  getFundamentals(ticker)
                ]);
                const dataTime = Date.now() - dataStart;
                
                // Salva storico su Drive (se configurato)
                if (gasUrl) {
                  const driveStart = Date.now();
                  const lastCandle = historicalData.candles.length > 0 
                    ? historicalData.candles[historicalData.candles.length - 1] 
                    : null;
                  
                  const priceDataForHistory = {
                    open: lastCandle?.open || historicalData.current,
                    high: historicalData.dayHigh || historicalData.current,
                    low: historicalData.dayLow || historicalData.current,
                    close: historicalData.current,
                    adjClose: lastCandle?.adjClose || historicalData.current,
                    volume: historicalData.volume || lastCandle?.volume || 0
                  };
                  
                  const historyRow = createHistoryRow(ticker, priceDataForHistory, fundamentals);
                  await saveHistoryToDrive(gasUrl, ticker, historyRow);
                  const driveTime = Date.now() - driveStart;
                }
                
                for (const est of estimatesForTicker) {
                  const updated = { ...est };
                  updated.currentPrice = historicalData.current;
                  updated.lastUpdate = new Date().toISOString();
                  
                  // Salva ultimo snapshot fundamentals nella stima
                  updated.lastFundamentals = fundamentals;
                  
                  // Salva anche i dati storici per la modal dettagli
                  updated.lastHistoricalData = historicalData;
                  
                  // Calcola il VERO min/max storico usando i dati delle candele
                  const minMax = calculateHistoricalMinMax(historicalData, est.startDate, historicalData.current);
                  
                  // RESET AUTOMATICO per stime contaminate:
                  // Se non ci sono candele valide dopo l'inserimento E il mercato non è aperto oggi,
                  // forza highPrice = lowPrice = startPrice (ignora valori precedenti errati)
                  if (minMax.candlesAnalyzed === 0 && !minMax.marketOpenToday) {
                    // Nessun dato valido dopo l'inserimento - reset completo
                    updated.highPrice = est.startPrice;
                    updated.lowPrice = est.startPrice;
                  } else {
                    // Aggiorna highPrice e lowPrice con i valori storici REALI
                    // USA SOLO il calcolo pulito, IGNORA i vecchi valori est.highPrice/est.lowPrice
                    updated.highPrice = Math.max(est.startPrice, minMax.highPrice);
                    updated.lowPrice = Math.min(est.startPrice, minMax.lowPrice);
                  }
                  
                  // Calcola la variazione basandosi sul PREZZO CORRENTE
                  const changePercent = ((historicalData.current - est.startPrice) / est.startPrice) * 100;
                  updated.profitLossPercent = changePercent;
                  updated.profitLoss = (est.amount * changePercent) / 100;
                  
                  const daysPassed = Math.floor((Date.now() - new Date(est.startDate).getTime()) / 86400000);
                  
                  // Per il TARGET: usa highPrice (massimo STORICO mai raggiunto)
                  const highChange = ((updated.highPrice - est.startPrice) / est.startPrice) * 100;
                  
                  // Per lo STOP LOSS: usa lowPrice (minimo STORICO mai raggiunto)
                  // Ora è sicuro perché calcoliamo solo dai giorni SUCCESSIVI all'inserimento
                  const lowChange = ((updated.lowPrice - est.startPrice) / est.startPrice) * 100;

                  let exitMsg = '';
                  if (highChange >= est.profitTarget) {
                    updated.status = 'completed-positive';
                    updated.endDate = new Date().toISOString();
                    updated.exitReason = 'target';
                    updated.endPrice = est.startPrice * (1 + est.profitTarget / 100);
                    updated.profitLoss = (est.amount * est.profitTarget) / 100;
                    updated.profitLossPercent = est.profitTarget;
                    exitMsg = 'TARGET';
                  } else if (lowChange <= est.stopLoss) {
                    // Lo stop loss scatta se il MINIMO STORICO ha raggiunto lo stop
                    updated.status = 'completed-negative';
                    updated.endDate = new Date().toISOString();
                    updated.exitReason = 'stoploss';
                    updated.endPrice = est.startPrice * (1 + est.stopLoss / 100);
                    updated.profitLoss = (est.amount * est.stopLoss) / 100;
                    updated.profitLossPercent = est.stopLoss;
                    exitMsg = 'STOP';
                  } else if (daysPassed >= est.duration) {
                    updated.status = 'completed-negative';
                    updated.endDate = new Date().toISOString();
                    updated.exitReason = 'timeout';
                    updated.endPrice = historicalData.current;
                    exitMsg = 'TIMEOUT';
                  }

                  onUpdateEstimate(updated);
                  if (exitMsg) {
                    toast.addToast(`${exitMsg}: ${est.ticker}`, exitMsg === 'TARGET' ? 'success' : 'warning');
                    onLog(`${exitMsg} ${est.ticker} (v${est.version})`, exitMsg === 'TARGET' ? 'success' : 'warning');
                  }
                }
                
                setUpdateResults(prev => [...prev, {
                  status: 'success', ticker, 
                  message: `$${historicalData.current.toFixed(2)} - ${estimatesForTicker.length} stime aggiornate (${((Date.now() - tickerStart) / 1000).toFixed(1)}s)`,
                  time: new Date().toLocaleTimeString()
                }]);

              } catch (e) {
                const errorTime = Date.now() - tickerStart;
                setUpdateResults(prev => [...prev, {
                  status: 'error', ticker, 
                  message: `❌ Errore (${(errorTime / 1000).toFixed(1)}s)\n🔍 Dettagli: ${e.message || "Errore sconosciuto"}\n📡 Endpoint: Yahoo Finance APIs`,
                  time: new Date().toLocaleTimeString()
                }]);
                setHasUpdateError(true);
              }

              processedCount++;
              await new Promise(r => setTimeout(r, 300));
            }
            
            setIsUpdateFinished(true);
            setUpdatePaused(false);
            updateControlRef.current = { paused: false, shouldStop: false };
            toast.addToast(`Aggiornamento completato: ${processedCount} ticker`, 'success');
            onLog(`Aggiornamento: ${processedCount} ticker`, 'info');
          };

          // Auto-refresh effect
          useEffect(() => {
            if (autoRefresh > 0) {
              autoRefreshRef.current = setInterval(() => {
                updatePrices();
              }, autoRefresh * 60 * 1000);
            }
            return () => {
              if (autoRefreshRef.current) clearInterval(autoRefreshRef.current);
            };
          }, [autoRefresh]);

          const exportCSV = () => {
            const headers = [
              'IA','Ticker','Sector','Industry','Country',
              'Start','End','Duration',
              'Start Price','Current Price','High Price','High %','Low Price','Low %',
              'PL %','Target','Stop','Amount','PL EUR','Confidence','Status','Exit Reason','Version',
              // Fundamentals - Calendar Events
              'Earnings Date','EPS Estimate Avg','EPS Estimate Low','EPS Estimate High','Revenue Estimate',
              'Ex-Dividend Date','Dividend Date',
              // Fundamentals - Recommendation Trend
              'Strong Buy','Buy','Hold','Sell','Strong Sell',
              // Fundamentals - Last Quarter Earnings
              'Last Quarter','Last Quarter Actual EPS','Last Quarter Estimate EPS','Last Quarter Revenue','Last Quarter Earnings',
              // Fundamentals - Earnings Trend (+1y)
              'Growth Estimate','Earnings Est Avg (+1y)','Revenue Est Avg (+1y)','Num Analysts'
            ];
            
            const rows = sortedEstimates.map(e => {
              const highPrice = e.highPrice || e.startPrice;
              const lowPrice = e.lowPrice || e.startPrice;
              const highChange = ((highPrice - e.startPrice) / e.startPrice * 100);
              const lowChange = ((lowPrice - e.startPrice) / e.startPrice * 100);
              const sector = e.assetProfile?.sector || 'N/A';
              const industry = e.assetProfile?.industry || 'N/A';
              const country = e.assetProfile?.country || 'N/A';
              
              // Fundamentals data (ultimo snapshot)
              const f = e.lastFundamentals || {};
              const cal = f.calendarEvents || {};
              const rec = f.recommendationTrend || {};
              const earn = f.earningsHistory || {};
              const trend = f.earningsTrend || {};
              
              return [
                e.aiName, 
                e.ticker, 
                `"${sector}"`,
                `"${industry}"`,
                `"${country}"`,
                new Date(e.startDate).toLocaleDateString(), 
                e.endDate ? new Date(e.endDate).toLocaleDateString() : '-',
                e.duration, 
                e.startPrice.toFixed(2), 
                e.currentPrice.toFixed(2), 
                highPrice.toFixed(2),
                highChange.toFixed(2),
                lowPrice.toFixed(2),
                lowChange.toFixed(2),
                e.profitLossPercent.toFixed(2), 
                e.profitTarget, 
                e.stopLoss, 
                e.amount, 
                e.profitLoss.toFixed(2), 
                e.confidence ?? 75,
                e.status, 
                e.exitReason || '-',
                e.version,
                // Calendar Events
                cal.earningsDate || '-',
                cal.earningsAverage ?? '-',
                cal.earningsLow ?? '-',
                cal.earningsHigh ?? '-',
                cal.revenueAverage ?? '-',
                cal.exDividendDate || '-',
                cal.dividendDate || '-',
                // Recommendation Trend
                rec.strongBuy ?? '-',
                rec.buy ?? '-',
                rec.hold ?? '-',
                rec.sell ?? '-',
                rec.strongSell ?? '-',
                // Last Quarter Earnings
                earn.lastQuarterDate || '-',
                earn.lastQuarterActual ?? '-',
                earn.lastQuarterEstimate ?? '-',
                earn.lastQuarterRevenue ?? '-',
                earn.lastQuarterEarnings ?? '-',
                // Earnings Trend
                trend.growthEstimate ?? '-',
                trend.earningsEstimateAvg ?? '-',
                trend.revenueEstimateAvg ?? '-',
                trend.numberOfAnalysts ?? '-'
              ];
            });
            
            const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const link = document.createElement("a");
            link.href = encodeURI(csvContent);
            link.download = "estimates.csv";
            link.click();
            toast.addToast('CSV esportato', 'success');
          };

          const SortButton = ({ sortKey, label }) => (
            <button onClick={() => handleSort(sortKey)} className="flex items-center gap-1 hover:text-white transition-colors">
              {label}
              {sortConfig.key === sortKey && (
                <span className="text-accent-blue">{sortConfig.direction === 'asc' ? '↑' : '↓'}</span>
              )}
            </button>
          );

          return (
            <div className="space-y-4 animate-fade-in">
              <UpdateStatusModal isOpen={showUpdateModal} progress={updateProgress} results={updateResults} isFinished={isUpdateFinished} hasError={hasUpdateError} isPaused={updatePaused} onPause={() => {updateControlRef.current.paused = true; setUpdatePaused(true);}} onResume={() => {updateControlRef.current.paused = false; setUpdatePaused(false);}} onStop={() => {updateControlRef.current.shouldStop = true;}} onClose={() => setShowUpdateModal(false)} />
              <TickerDetailsModal isOpen={showTickerDetailsModal} estimate={selectedEstimateForDetails} onClose={() => setShowTickerDetailsModal(false)} />

              {/* Actions Bar */}
              <div className="flex flex-wrap items-center gap-3 mb-6">
                <button onClick={updatePrices} className="px-4 py-2 bg-gradient-to-r from-blue-600 to-blue-700 rounded-lg hover:from-blue-500 hover:to-blue-600 shadow-lg transition-all font-bold flex items-center gap-2">
                  🔄 Aggiorna Prezzi
                </button>
                <button onClick={exportCSV} className="px-4 py-2 bg-gray-600 rounded-lg hover:bg-gray-500 shadow-lg transition-all">
                  📥 Esporta CSV
                </button>
                <button onClick={toggleAll} className="px-4 py-2 bg-gray-600 rounded-lg hover:bg-gray-500 shadow-lg transition-all">
                  {isAllExpanded ? '📂 Chiudi' : '📂 Espandi'}
                </button>
                <button onClick={() => setShowFilters(!showFilters)} className={`px-4 py-2 rounded-lg shadow-lg transition-all ${showFilters ? 'bg-accent-blue' : 'bg-gray-600 hover:bg-gray-500'}`}>
                  🔍 Filtri
                </button>
                
                {/* Auto-refresh selector */}
                <div className="flex items-center gap-2 ml-auto">
                  <span className="text-sm text-gray-400">Auto update period (h):</span>
                  <input type="number" min="0" max="24" step="1" value={autoRefresh / 60} onChange={e => setAutoRefresh(Number(e.target.value) * 60)}
                    className="bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-sm text-white w-16" />
                  {autoRefresh > 0 && <span className="pulse-dot w-2 h-2 bg-emerald-400 rounded-full"></span>}
                </div>
              </div>

              {/* Filters Panel */}
              {showFilters && (
                <div className="glass p-4 rounded-xl mb-4 animate-slide-up">
                  <div className="flex justify-between items-center mb-3">
                    <h3 className="font-bold text-gray-300">🔍 Filtri Avanzati</h3>
                    <button onClick={resetFilters} className="text-xs text-accent hover:text-white underline">Reset</button>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 text-sm">
                    <div className="flex flex-col">
                      <label className="text-xs text-gray-500 mb-1">Ticker</label>
                      <input type="text" placeholder="Es. AAPL" className="bg-black/30 border border-gray-700 rounded p-2 text-white" 
                        value={filters.ticker} onChange={e => setFilters({...filters, ticker: e.target.value})} />
                    </div>
                    <div className="flex flex-col">
                      <label className="text-xs text-gray-500 mb-1">Dal</label>
                      <input type="date" className="bg-black/30 border border-gray-700 rounded p-2 text-white"
