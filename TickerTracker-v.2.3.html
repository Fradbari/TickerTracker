<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } from 'react';
        import { createRoot } from 'react-dom/client';
        import { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell, Line, ComposedChart, PieChart, Pie, AreaChart, Area } from 'recharts';
        import { GoogleGenAI } from "@google/genai";

        // --- CONSTANTS ---
        const AI_OPTIONS = ['Gemini', 'IA Studio', 'GPT', 'Claude', 'Kimi', 'Perplexity', 'DeepSeek', 'Copilot', 'Grok', 'Qwen'];
        const AI_ICONS = {
          'Gemini': '💎', 'IA Studio': '🎨', 'GPT': '🧠', 'Claude': '🤖',
          'Kimi': '🌙', 'Perplexity': '🔮', 'DeepSeek': '🔍', 'Copilot': '✈️',
          'Grok': '⚡', 'Qwen': '🐉'
        };
        const CORS_PROXIES = [
          'https://api.allorigins.win/raw?url=',
          'https://corsproxy.io/?',
          'https://api.codetabs.com/v1/proxy?quest='
        ];

        // --- TOAST CONTEXT ---
        const ToastContext = createContext();
        
        const ToastProvider = ({ children }) => {
          const [toasts, setToasts] = useState([]);
          
          const addToast = useCallback((message, type = 'info', duration = 4000) => {
            const id = Date.now() + Math.random();
            setToasts(prev => [...prev, { id, message, type, exiting: false }]);
            
            setTimeout(() => {
              setToasts(prev => prev.map(t => t.id === id ? { ...t, exiting: true } : t));
              setTimeout(() => {
                setToasts(prev => prev.filter(t => t.id !== id));
              }, 300);
            }, duration);
          }, []);
          
          const removeToast = useCallback((id) => {
            setToasts(prev => prev.map(t => t.id === id ? { ...t, exiting: true } : t));
            setTimeout(() => {
              setToasts(prev => prev.filter(t => t.id !== id));
            }, 300);
          }, []);
          
          return (
            <ToastContext.Provider value={{ addToast }}>
              {children}
              <div className="fixed top-4 right-4 z-[200] space-y-2 max-w-sm">
                {toasts.map(toast => (
                  <div 
                    key={toast.id} 
                    className={`${toast.exiting ? 'toast-exit' : 'toast-enter'} p-4 rounded-xl shadow-2xl flex items-start gap-3 cursor-pointer ${
                      toast.type === 'success' ? 'bg-emerald-600/90 border border-emerald-400/30' :
                      toast.type === 'error' ? 'bg-red-600/90 border border-red-400/30' :
                      toast.type === 'warning' ? 'bg-amber-600/90 border border-amber-400/30' :
                      'bg-blue-600/90 border border-blue-400/30'
                    } backdrop-blur-sm`}
                    onClick={() => removeToast(toast.id)}
                  >
                    <span className="text-xl">
                      {toast.type === 'success' ? '✅' : toast.type === 'error' ? '❌' : toast.type === 'warning' ? '⚠️' : 'ℹ️'}
                    </span>
                    <div className="flex-1 text-sm text-white font-medium">{toast.message}</div>
                  </div>
                ))}
              </div>
            </ToastContext.Provider>
          );
        };
        
        const useToast = () => useContext(ToastContext);

        // --- SERVICES ---
        let currentProxyIndex = 0;
        const symbolCache = {};
        const priceCache = {};

        const searchTicker = async (query, apiKey) => {
          if (!apiKey) throw new Error("API Key mancante");
          const cacheKey = `search_${query.toUpperCase()}`;
          if (symbolCache[cacheKey] && (Date.now() - symbolCache[cacheKey].timestamp < 300000)) {
            return symbolCache[cacheKey].data;
          }
          try {
            const response = await fetch(`https://finnhub.io/api/v1/search?q=${encodeURIComponent(query)}&token=${apiKey}`);
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            const results = data.result || [];
            symbolCache[cacheKey] = { data: results, timestamp: Date.now() };
            return results;
          } catch (error) {
            throw new Error(error.message || "Errore durante la ricerca");
          }
        };

        const getStockPrice = async (ticker) => {
          const cacheKey = `price_${ticker}_${Math.floor(Date.now() / 60000)}`;
          if (priceCache[cacheKey]) return priceCache[cacheKey].data;
          const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=5d`;
          for (let i = 0; i < CORS_PROXIES.length; i++) {
            const proxyIndex = (currentProxyIndex + i) % CORS_PROXIES.length;
            const proxyUrl = CORS_PROXIES[proxyIndex] + encodeURIComponent(yahooUrl);
            try {
              const response = await fetch(proxyUrl, { headers: { 'Accept': 'application/json' } });
              if (!response.ok) continue;
              const data = await response.json();
              if (data.chart?.result?.[0]) {
                const result = data.chart.result[0];
                const meta = result.meta;
                const currentPrice = meta.regularMarketPrice || meta.previousClose;
                const price = {
                  current: currentPrice,
                  dayHigh: meta.regularMarketDayHigh || currentPrice,
                  dayLow: meta.regularMarketDayLow || currentPrice,
                  previousClose: meta.previousClose || meta.regularMarketPrice,
                  open: meta.regularMarketOpen || currentPrice
                };
                if (!price.current) throw new Error("Prezzo invalido");
                currentProxyIndex = proxyIndex;
                priceCache[cacheKey] = { data: price, timestamp: Date.now() };
                return price;
              }
            } catch (error) { continue; }
          }
          throw new Error(`Impossibile ottenere prezzo per ${ticker}.`);
        };

        // Funzione per calcolare il range necessario in base ai giorni passati
        const calculateYahooRange = (daysPassed) => {
          if (daysPassed <= 5) return '5d';
          if (daysPassed <= 30) return '1mo';
          if (daysPassed <= 90) return '3mo';
          if (daysPassed <= 180) return '6mo';
          if (daysPassed <= 365) return '1y';
          return '2y';
        };

        // Funzione per scaricare dati storici di un ticker (con adjClose e volume)
        const getHistoricalData = async (ticker, range) => {
          const cacheKey = `hist_${ticker}_${range}_${Math.floor(Date.now() / 300000)}`; // cache 5 min
          if (priceCache[cacheKey]) return priceCache[cacheKey].data;
          
          const gasUrl = localStorage.getItem('gasUrl') || '';
          
          // Funzione helper per parsare i dati chart
          const parseChartData = (result) => {
            const meta = result.meta;
            const timestamps = result.timestamp || [];
            const quotes = result.indicators?.quote?.[0] || {};
            const adjCloseData = result.indicators?.adjclose?.[0]?.adjclose || [];
            
            // Costruisci array di candele giornaliere con adjClose e volume
            const candles = timestamps.map((ts, idx) => ({
              date: new Date(ts * 1000),
              dateString: new Date(ts * 1000).toDateString(),
              open: quotes.open?.[idx] || null,
              high: quotes.high?.[idx] || null,
              low: quotes.low?.[idx] || null,
              close: quotes.close?.[idx] || null,
              adjClose: adjCloseData[idx] || quotes.close?.[idx] || null,
              volume: quotes.volume?.[idx] || null
            })).filter(c => c.high !== null && c.low !== null);
            
            const currentPrice = meta.regularMarketPrice || meta.previousClose;
            const lastCandle = candles.length > 0 ? candles[candles.length - 1] : null;
            
            return {
              current: currentPrice,
              dayHigh: meta.regularMarketDayHigh || currentPrice,
              dayLow: meta.regularMarketDayLow || currentPrice,
              previousClose: meta.previousClose || currentPrice,
              volume: meta.regularMarketVolume || (lastCandle?.volume) || null,
              candles: candles
            };
          };
          
          // USA GAS COME PROXY (priorità)
          if (gasUrl) {
            try {
              // Leggi cookie/crumb da localStorage
              const yahooCookie = localStorage.getItem('yahooCookie') || '';
              const yahooCrumb = localStorage.getItem('yahooCrumb') || '';
              
              const response = await fetch(`${gasUrl}?action=yahooChart&ticker=${encodeURIComponent(ticker)}&range=${range}&interval=1d&cookie=${encodeURIComponent(yahooCookie)}&crumb=${encodeURIComponent(yahooCrumb)}`);
              const result = await response.json();
              
              if (result.status === 'success' && result.data) {
                const historicalData = parseChartData(result.data);
                priceCache[cacheKey] = { data: historicalData, timestamp: Date.now() };
                return historicalData;
              }
            } catch (error) {
              console.warn('GAS proxy failed for chart, trying CORS proxies:', error);
            }
          }
          
          // FALLBACK: CORS PROXIES
          const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=${range}`;
          
          for (let i = 0; i < CORS_PROXIES.length; i++) {
            const proxyIndex = (currentProxyIndex + i) % CORS_PROXIES.length;
            const proxyUrl = CORS_PROXIES[proxyIndex] + encodeURIComponent(yahooUrl);
            try {
              const response = await fetch(proxyUrl, { headers: { 'Accept': 'application/json' } });
              if (!response.ok) continue;
              const data = await response.json();
              if (data.chart?.result?.[0]) {
                const result = data.chart.result[0];
                const meta = result.meta;
                const timestamps = result.timestamp || [];
                const quotes = result.indicators?.quote?.[0] || {};
                const adjCloseData = result.indicators?.adjclose?.[0]?.adjclose || [];
                
                // Costruisci array di candele giornaliere con adjClose e volume
                const candles = timestamps.map((ts, idx) => ({
                  date: new Date(ts * 1000),
                  dateString: new Date(ts * 1000).toDateString(),
                  open: quotes.open?.[idx] || null,
                  high: quotes.high?.[idx] || null,
                  low: quotes.low?.[idx] || null,
                  close: quotes.close?.[idx] || null,
                  adjClose: adjCloseData[idx] || quotes.close?.[idx] || null,
                  volume: quotes.volume?.[idx] || null
                })).filter(c => c.high !== null && c.low !== null); // Rimuovi candele con dati mancanti
                
                const currentPrice = meta.regularMarketPrice || meta.previousClose;
                
                // Ultima candela per dati odierni
                const lastCandle = candles.length > 0 ? candles[candles.length - 1] : null;
                
                const historicalData = {
                  current: currentPrice,
                  dayHigh: meta.regularMarketDayHigh || currentPrice,
                  dayLow: meta.regularMarketDayLow || currentPrice,
                  previousClose: meta.previousClose || currentPrice,
                  volume: meta.regularMarketVolume || (lastCandle?.volume) || null,
                  candles: candles
                };
                
                currentProxyIndex = proxyIndex;
                priceCache[cacheKey] = { data: historicalData, timestamp: Date.now() };
                return historicalData;
              }
            } catch (error) { continue; }
          }
          throw new Error(`Impossibile ottenere dati storici per ${ticker}.`);
        };

        // Funzione per calcolare il vero min/max storico per una stima
        const calculateHistoricalMinMax = (historicalData, estimateStartDate, currentPrice) => {
          const startDate = new Date(estimateStartDate);
          const startDateString = startDate.toDateString();
          const todayString = new Date().toDateString();
          const isFirstDay = startDateString === todayString;
          
          // Filtra le candele: includi SOLO i giorni SUCCESSIVI a startDate
          // Il giorno di inserimento è escluso (gestito con currentPrice iniziale)
          const relevantCandles = historicalData.candles.filter(candle => {
            // Escludi il giorno stesso di inserimento
            if (candle.dateString === startDateString) return false;
            // Includi solo giorni successivi
            return candle.date > startDate;
          });
          
          let historicalHigh = null;
          let historicalLow = null;
          
          if (relevantCandles.length > 0) {
            historicalHigh = Math.max(...relevantCandles.map(c => c.high));
            historicalLow = Math.min(...relevantCandles.map(c => c.low));
          }
          
          // IMPORTANTE: Verifica se l'ultima candela disponibile è di OGGI
          // Se siamo a mercato chiuso (es. Domenica), dayHigh/dayLow sono di Venerdì!
          const lastCandle = historicalData.candles.length > 0 
            ? historicalData.candles[historicalData.candles.length - 1] 
            : null;
          const lastCandleIsToday = lastCandle && lastCandle.dateString === todayString;
          const lastCandleIsAfterStart = lastCandle && lastCandle.date > startDate && lastCandle.dateString !== startDateString;
          
          // Per il giorno corrente:
          // - Se è il primo giorno: usa SOLO currentPrice (ignora dayHigh/dayLow pre-inserimento)
          // - Se l'ultima candela NON è di oggi (mercato chiuso): usa SOLO currentPrice
          // - Se l'ultima candela è di oggi E successiva a startDate: usa dayHigh/dayLow
          let todayHigh = currentPrice;
          let todayLow = currentPrice;
          
          if (!isFirstDay && lastCandleIsToday && lastCandleIsAfterStart) {
            // Solo se:
            // 1. Non è il primo giorno
            // 2. L'ultima candela è di OGGI (mercato aperto oggi)
            // 3. L'ultima candela è SUCCESSIVA alla data di inserimento
            todayHigh = historicalData.dayHigh || currentPrice;
            todayLow = historicalData.dayLow || currentPrice;
          }
          
          // Calcola il max/min finale combinando storico + oggi
          let finalHigh = todayHigh;
          let finalLow = todayLow;
          
          if (historicalHigh !== null) {
            finalHigh = Math.max(historicalHigh, todayHigh);
          }
          if (historicalLow !== null) {
            finalLow = Math.min(historicalLow, todayLow);
          }
          
          return {
            highPrice: finalHigh,
            lowPrice: finalLow,
            candlesAnalyzed: relevantCandles.length,
            isFirstDay,
            lastCandleIsToday,
            marketOpenToday: lastCandleIsToday && lastCandleIsAfterStart
          };
        };

        // Funzione per ottenere Asset Profile (settore, industry, ecc.) - chiamata solo all'inserimento
        const getAssetProfile = async (ticker) => {
          const cacheKey = `profile_${ticker}`;
          if (symbolCache[cacheKey] && (Date.now() - symbolCache[cacheKey].timestamp < 86400000)) { // cache 24h
            return symbolCache[cacheKey].data;
          }
          
          const gasUrl = localStorage.getItem('gasUrl') || '';
          
          // USA GAS COME PROXY (priorità)
          if (gasUrl) {
            try {
              // Leggi cookie/crumb da localStorage
              const yahooCookie = localStorage.getItem('yahooCookie') || '';
              const yahooCrumb = localStorage.getItem('yahooCrumb') || '';
              
              const response = await fetch(`${gasUrl}?action=yahooQuoteSummary&ticker=${encodeURIComponent(ticker)}&modules=assetProfile&cookie=${encodeURIComponent(yahooCookie)}&crumb=${encodeURIComponent(yahooCrumb)}`);
              const result = await response.json();
              
              if (result.status === 'success' && result.data?.assetProfile) {
                const profile = result.data.assetProfile;
                const assetProfile = {
                  sector: profile.sector || 'N/A',
                  industry: profile.industry || 'N/A',
                  country: profile.country || 'N/A',
                  website: profile.website || '',
                  fullTimeEmployees: profile.fullTimeEmployees || null,
                  longBusinessSummary: profile.longBusinessSummary || ''
                };
                
                symbolCache[cacheKey] = { data: assetProfile, timestamp: Date.now() };
                return assetProfile;
              }
            } catch (error) {
              console.warn('GAS proxy failed for assetProfile, trying CORS proxies:', error);
            }
          }
          
          // FALLBACK: CORS PROXIES
          const yahooUrl = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${encodeURIComponent(ticker)}?modules=assetProfile`;
          
          for (let i = 0; i < CORS_PROXIES.length; i++) {
            const proxyIndex = (currentProxyIndex + i) % CORS_PROXIES.length;
            const proxyUrl = CORS_PROXIES[proxyIndex] + encodeURIComponent(yahooUrl);
            try {
              const response = await fetch(proxyUrl, { headers: { 'Accept': 'application/json' } });
              if (!response.ok) continue;
              const data = await response.json();
              
              if (data.quoteSummary?.result?.[0]?.assetProfile) {
                const profile = data.quoteSummary.result[0].assetProfile;
                const assetProfile = {
                  sector: profile.sector || 'N/A',
                  industry: profile.industry || 'N/A',
                  country: profile.country || 'N/A',
                  website: profile.website || '',
                  fullTimeEmployees: profile.fullTimeEmployees || null,
                  longBusinessSummary: profile.longBusinessSummary || ''
                };
                
                currentProxyIndex = proxyIndex;
                symbolCache[cacheKey] = { data: assetProfile, timestamp: Date.now() };
                return assetProfile;
              }
            } catch (error) { continue; }
          }
          
          // Ritorna profilo vuoto se fallisce (non blocca l'inserimento)
          return {
            sector: 'N/A',
            industry: 'N/A',
            country: 'N/A',
            website: '',
            fullTimeEmployees: null,
            longBusinessSummary: ''
          };
        };

        // Funzione per ottenere Fundamentals combinati (calendarEvents, recommendationTrend, earnings, earningsTrend)
        const getFundamentals = async (ticker) => {
          const modules = "calendarEvents,recommendationTrend,earnings,earningsTrend";
          const gasUrl = localStorage.getItem('gasUrl') || '';
          
          // Funzione helper per parsare i dati
          const parseFundamentalsData = (result) => {
            console.log('Raw fundamentals result from Yahoo:', result); // DEBUG: Log raw data
            
            // === CALENDAR EVENTS & DIVIDENDS ===
            const calendar = result.calendarEvents || {};
            const earnings = calendar.earnings || {};
            
            const calendarEvents = {
              earningsDate: earnings.earningsDate?.[0]?.fmt || null,
              earningsAverage: earnings.earningsAverage?.raw || null,
              earningsLow: earnings.earningsLow?.raw || null,
              earningsHigh: earnings.earningsHigh?.raw || null,
              revenueAverage: earnings.revenueAverage?.raw || null,
              exDividendDate: calendar.exDividendDate?.fmt || null,
              dividendDate: calendar.dividendDate?.fmt || null,
            };

            // === RECOMMENDATION TREND (Analisti) ===
            const recTrendArray = result.recommendationTrend?.trend || [];
            const recTrend = recTrendArray.length > 0 ? recTrendArray[0] : {};
            
            const recommendationTrend = {
              strongBuy: recTrend.strongBuy || 0,
              buy: recTrend.buy || 0,
              hold: recTrend.hold || 0,
              sell: recTrend.sell || 0,
              strongSell: recTrend.strongSell || 0,
            };

            // === EARNINGS HISTORY (Ultimo trimestre) ===
            const earningsData = result.earnings || {};
            const earningsChart = earningsData.earningsChart || {};
            const financialsChart = earningsData.financialsChart || {};
            
            const quarterlyEarnings = earningsChart.quarterly || [];
            const quarterlyFinancials = financialsChart.quarterly || [];
            
            // Prendi l'ULTIMO elemento dell'array (più recente)
            const lastQuarter = quarterlyEarnings.length > 0 
              ? quarterlyEarnings[quarterlyEarnings.length - 1] 
              : {};
            const lastFinancials = quarterlyFinancials.length > 0 
              ? quarterlyFinancials[quarterlyFinancials.length - 1] 
              : {};

            const earningsHistory = {
              lastQuarterDate: lastQuarter.date || null,
              lastQuarterActual: lastQuarter.actual?.raw || null,
              lastQuarterEstimate: lastQuarter.estimate?.raw || null,
              lastQuarterRevenue: lastFinancials.revenue?.raw || null,
              lastQuarterEarnings: lastFinancials.earnings?.raw || null,
            };

            // === EARNINGS TREND (Previsioni future +1 anno) ===
            const earningsTrendArray = result.earningsTrend?.trend || [];
            
            // Cerca il periodo '+1y' negli array di trend
            const oneYearTrend = earningsTrendArray.find(t => t.period === '+1y') || {};
            
            // Se non trovi +1y, usa il primo disponibile
            const fallbackTrend = earningsTrendArray.length > 0 ? earningsTrendArray[0] : {};
            const trendData = Object.keys(oneYearTrend).length > 0 ? oneYearTrend : fallbackTrend;

            const earningsTrend = {
              growthEstimate: trendData.growth?.raw || null,
              earningsEstimateAvg: trendData.earningsEstimate?.avg?.raw || null,
              revenueEstimateAvg: trendData.revenueEstimate?.avg?.raw || null,
              numberOfAnalysts: trendData.earningsEstimate?.numberOfAnalysts?.raw || null,
            };

            const parsedData = {
              timestamp: new Date().toISOString(),
              calendarEvents,
              recommendationTrend,
              earningsHistory,
              earningsTrend,
            };
            
            console.log('Parsed fundamentals:', parsedData); // DEBUG: Log parsed data
            
            return parsedData;
          };
          
          // USA GAS COME PROXY (priorità)
          if (gasUrl) {
            try {
              // Leggi cookie/crumb da localStorage
              const yahooCookie = localStorage.getItem('yahooCookie') || '';
              const yahooCrumb = localStorage.getItem('yahooCrumb') || '';
              
              const response = await fetch(`${gasUrl}?action=yahooQuoteSummary&ticker=${encodeURIComponent(ticker)}&modules=${modules}&cookie=${encodeURIComponent(yahooCookie)}&crumb=${encodeURIComponent(yahooCrumb)}`);
              const result = await response.json();
              
              if (result.status === 'success' && result.data) {
                return parseFundamentalsData(result.data);
              }
            } catch (error) {
              console.warn('GAS proxy failed for fundamentals, trying CORS proxies:', error);
            }
          }
          
          // FALLBACK: CORS PROXIES
          const yahooUrl = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${encodeURIComponent(ticker)}?modules=${modules}`;
          
          for (let i = 0; i < CORS_PROXIES.length; i++) {
            const proxyIndex = (currentProxyIndex + i) % CORS_PROXIES.length;
            const proxyUrl = CORS_PROXIES[proxyIndex] + encodeURIComponent(yahooUrl);
            try {
              const response = await fetch(proxyUrl, { headers: { 'Accept': 'application/json' } });
              if (!response.ok) continue;
              const data = await response.json();
              
              if (data.quoteSummary?.result?.[0]) {
                const result = data.quoteSummary.result[0];
                
                // CalendarEvents
                const calendar = result.calendarEvents || {};
                const earnings = calendar.earnings || {};
                const calendarEvents = {
                  earningsDate: earnings.earningsDate?.[0]?.fmt || null,
                  earningsAverage: earnings.earningsAverage?.raw || null,
                  earningsLow: earnings.earningsLow?.raw || null,
                  earningsHigh: earnings.earningsHigh?.raw || null,
                  revenueAverage: earnings.revenueAverage?.raw || null,
                  exDividendDate: calendar.exDividendDate?.fmt || null,
                  dividendDate: calendar.dividendDate?.fmt || null
                };
                
                // RecommendationTrend (ultimo mese)
                const recTrend = result.recommendationTrend?.trend?.[0] || {};
                const recommendationTrend = {
                  strongBuy: recTrend.strongBuy || 0,
                  buy: recTrend.buy || 0,
                  hold: recTrend.hold || 0,
                  sell: recTrend.sell || 0,
                  strongSell: recTrend.strongSell || 0
                };
                
                // Earnings (ultimo trimestre)
                const earningsData = result.earnings || {};
                const lastQuarter = earningsData.earningsChart?.quarterly?.slice(-1)[0] || {};
                const lastFinancials = earningsData.financialsChart?.quarterly?.slice(-1)[0] || {};
                const earningsHistory = {
                  lastQuarterDate: lastQuarter.date || null,
                  lastQuarterActual: lastQuarter.actual?.raw || null,
                  lastQuarterEstimate: lastQuarter.estimate?.raw || null,
                  lastQuarterRevenue: lastFinancials.revenue?.raw || null,
                  lastQuarterEarnings: lastFinancials.earnings?.raw || null
                };
                
                // EarningsTrend (previsioni future +1y)
                const trendData = result.earningsTrend?.trend?.find(t => t.period === '+1y') || {};
                const earningsTrend = {
                  growthEstimate: trendData.growth?.raw || null,
                  earningsEstimateAvg: trendData.earningsEstimate?.avg?.raw || null,
                  revenueEstimateAvg: trendData.revenueEstimate?.avg?.raw || null,
                  numberOfAnalysts: trendData.earningsEstimate?.numberOfAnalysts?.raw || null
                };
                
                currentProxyIndex = proxyIndex;
                
                return {
                  timestamp: new Date().toISOString(),
                  calendarEvents,
                  recommendationTrend,
                  earningsHistory,
                  earningsTrend
                };
              }
            } catch (error) { continue; }
