                    </div>
                    <div className="flex flex-col">
                      <label className="text-xs text-gray-500 mb-1">Al</label>
                      <input type="date" className="bg-black/30 border border-gray-700 rounded p-2 text-white" 
                        value={filters.dateTo} onChange={e => setFilters({...filters, dateTo: e.target.value})} />
                    </div>
                    <div className="flex flex-col">
                      <label className="text-xs text-gray-500 mb-1">Status</label>
                      <select className="bg-black/30 border border-gray-700 rounded p-2 text-white"
                        value={filters.status} onChange={e => setFilters({...filters, status: e.target.value})}>
                        <option value="all">Tutto</option>
                        <option value="active">Attive</option>
                        <option value="completed-positive">In Profitto</option>
                        <option value="completed-negative">In Perdita</option>
                        <option value="concluse">Concluse</option>
                        <option value="scadute">Scadute</option>
                      </select>
                    </div>
                    <div className="flex flex-col">
                      <label className="text-xs text-gray-500 mb-1">Var %</label>
                      <div className="flex">
                        <select className="bg-black/30 border border-gray-700 rounded-l p-2 text-white w-12"
                          value={filters.varOp} onChange={e => setFilters({...filters, varOp: e.target.value})}>
                          <option value="gt">&gt;</option>
                          <option value="lt">&lt;</option>
                        </select>
                        <input type="number" placeholder="%" className="bg-black/30 border border-l-0 border-gray-700 rounded-r p-2 text-white w-full"
                          value={filters.varVal} onChange={e => setFilters({...filters, varVal: e.target.value})} />
                      </div>
                    </div>
                    <div className="flex flex-col">
                      <label className="text-xs text-gray-500 mb-1">P&L (€)</label>
                      <div className="flex">
                        <select className="bg-black/30 border border-gray-700 rounded-l p-2 text-white w-12"
                          value={filters.pnlOp} onChange={e => setFilters({...filters, pnlOp: e.target.value})}>
                          <option value="gt">&gt;</option>
                          <option value="lt">&lt;</option>
                        </select>
                        <input type="number" placeholder="€" className="bg-black/30 border border-l-0 border-gray-700 rounded-r p-2 text-white w-full"
                          value={filters.pnlVal} onChange={e => setFilters({...filters, pnlVal: e.target.value})} />
                      </div>
                    </div>
                    <div className="flex flex-col">
                      <label className="text-xs text-gray-500 mb-1">Modello IA</label>
                      <select className="bg-black/30 border border-gray-700 rounded p-2 text-white"
                        value={filters.aiName} onChange={e => setFilters({...filters, aiName: e.target.value})}>
                        <option value="all">Tutto</option>
                        {AI_OPTIONS.map(ai => <option key={ai} value={ai}>{ai}</option>)}
                      </select>
                    </div>
                    <div className="flex flex-col">
                      <label className="text-xs text-gray-500 mb-1">Confidence</label>
                      <div className="flex">
                        <select className="bg-black/30 border border-gray-700 rounded-l p-2 text-white w-14"
                          value={filters.confOp} onChange={e => setFilters({...filters, confOp: e.target.value})}>
                          <option value="gte">≥</option>
                          <option value="lte">≤</option>
                          <option value="eq">=</option>
                        </select>
                        <input type="number" min="0" max="100" placeholder="0-100" className="bg-black/30 border border-l-0 border-gray-700 rounded-r p-2 text-white w-full"
                          value={filters.confVal} onChange={e => setFilters({...filters, confVal: e.target.value})} />
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {Object.keys(grouped).length === 0 && (
                <div className="text-center p-12 text-gray-500 glass rounded-xl">
                  <div className="text-6xl mb-4">📊</div>
                  <p className="text-xl">Nessuna stima trovata</p>
                  {Object.values(filters).some(v => v !== '' && v !== 'all') && (
                    <button onClick={resetFilters} className="mt-4 text-accent hover:underline">Resetta Filtri</button>
                  )}
                </div>
              )}

              {Object.entries(grouped).map(([aiName, groupEstimates]) => {
                const isOpen = expandedGroups[aiName] !== undefined ? expandedGroups[aiName] : isAllExpanded;
                const totalPL = groupEstimates.reduce((s, e) => s + e.profitLoss, 0);
                const activeCount = groupEstimates.filter(e => e.status === 'active').length;

                return (
                  <div key={aiName} className="glass rounded-xl overflow-hidden transition-all duration-300 hover:border-accent-blue/30">
                    <div className="p-4 bg-gradient-to-r from-primary/80 to-transparent cursor-pointer flex items-center justify-between" onClick={() => toggleGroup(aiName)}>
                      <div className="flex items-center gap-4">
                        <span className="text-2xl w-10 h-10 flex items-center justify-center bg-background rounded-lg">{AI_ICONS[aiName] || '🤖'}</span>
                        <span className="text-xl font-bold text-white">{aiName}</span>
                      </div>
                      <div className="flex items-center gap-3">
                        {activeCount > 0 && <span className="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs rounded-full">🟢 {activeCount}</span>}
                        <span className={`px-4 py-1 rounded-full text-sm font-bold ${totalPL >= 0 ? 'bg-emerald-500/10 text-emerald-400' : 'bg-red-500/10 text-red-400'}`}>
                          €{totalPL >= 0 ? '+' : ''}{totalPL.toFixed(2)}
                        </span>
                        <span className={`transform transition-transform ${isOpen ? 'rotate-180' : ''}`}>▼</span>
                      </div>
                    </div>

                    {isOpen && (
                      <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                          <thead className="bg-black/30 text-gray-400 text-xs uppercase">
                            <tr>
                              <th className="p-3"><SortButton sortKey="ticker" label="Ticker" /></th>
                              <th className="p-3"><SortButton sortKey="startDate" label="Inizio" /></th>
                              <th className="p-3">Scadenza</th>
                              <th className="p-3"><SortButton sortKey="currentPrice" label="Prezzo" /></th>
                              <th className="p-3"><SortButton sortKey="highPrice" label="Range Storico" /></th>
                              <th className="p-3"><SortButton sortKey="profitLossPercent" label="Var %" /></th>
                              <th className="p-3">Limiti</th>
                              <th className="p-3"><SortButton sortKey="profitLoss" label="P&L" /></th>
                              <th className="p-3"><SortButton sortKey="confidence" label="Conf." /></th>
                              <th className="p-3">Status</th>
                              <th className="p-3">Azioni</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-white/5 text-sm">
                            {groupEstimates.map(est => {
                              const isProfit = est.profitLossPercent >= 0;
                              const endDate = new Date(est.startDate);
                              endDate.setDate(endDate.getDate() + est.duration);
                              const daysLeft = Math.max(0, est.duration - Math.floor((Date.now() - new Date(est.startDate).getTime())/86400000));
                              
                              return (
                                <tr key={est.id} className="hover:bg-white/5 transition-colors cursor-pointer" onClick={() => { setSelectedEstimateForDetails(est); setShowTickerDetailsModal(true); }}>
                                  <td className="p-3 font-bold text-white">
                                    {est.ticker} 
                                    <span className="text-xs font-normal text-gray-500 ml-1">v{est.version}</span>
                                  </td>
                                  <td className="p-3 text-gray-400">{new Date(est.startDate).toLocaleDateString()}</td>
                                  <td className="p-3 text-gray-400">
                                    <div className="text-white">{endDate.toLocaleDateString()}</div>
                                    <div className="text-xs">
                                      {est.status === 'active' ? `${daysLeft}g left` : 'Chiuso'}
                                    </div>
                                  </td>
                                  <td className="p-3">
                                    <div className="text-gray-400">${est.startPrice.toFixed(2)}</div>
                                    <div className="text-white font-mono">${est.currentPrice.toFixed(2)}</div>
                                  </td>
                                  <td className="p-3 text-xs">
                                    {(() => {
                                      const highPrice = est.highPrice || est.startPrice;
                                      const lowPrice = est.lowPrice || est.startPrice;
                                      const highChange = ((highPrice - est.startPrice) / est.startPrice * 100);
                                      const lowChange = ((lowPrice - est.startPrice) / est.startPrice * 100);
                                      const isNewEstimate = highPrice === est.startPrice && lowPrice === est.startPrice;
                                      
                                      if (isNewEstimate && est.status === 'active') {
                                        return (
                                          <div className="text-gray-500 italic text-center">
                                            <div>In attesa</div>
                                            <div className="text-[10px]">aggiornamento</div>
                                          </div>
                                        );
                                      }
                                      
                                      return (
                                        <>
                                          <div className="flex items-center gap-1">
                                            <span className="text-emerald-400">▲</span>
                                            <span className="text-emerald-300 font-mono">${highPrice.toFixed(2)}</span>
                                            <span className={`text-[10px] ${highChange >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                                              ({highChange >= 0 ? '+' : ''}{highChange.toFixed(1)}%)
                                            </span>
                                          </div>
                                          <div className="flex items-center gap-1">
                                            <span className="text-red-400">▼</span>
                                            <span className="text-red-300 font-mono">${lowPrice.toFixed(2)}</span>
                                            <span className={`text-[10px] ${lowChange >= 0 ? 'text-emerald-500' : 'text-red-500'}`}>
                                              ({lowChange >= 0 ? '+' : ''}{lowChange.toFixed(1)}%)
                                            </span>
                                          </div>
                                        </>
                                      );
                                    })()}
                                  </td>
                                  <td className={`p-3 font-bold ${isProfit ? 'text-emerald-400' : 'text-red-400'}`}>
                                    {isProfit ? '+' : ''}{est.profitLossPercent.toFixed(2)}%
                                  </td>
                                  <td className="p-3 text-xs">
                                    <div className="text-emerald-400">TP: +{est.profitTarget}%</div>
                                    <div className="text-red-400">SL: {est.stopLoss}%</div>
                                  </td>
                                  <td className={`p-3 font-bold ${est.profitLoss >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                                    €{est.profitLoss >= 0 ? '+' : ''}{est.profitLoss.toFixed(2)}
                                  </td>
                                  <td className="p-3">
                                    {(() => {
                                      const conf = est.confidence ?? 75;
                                      const color = conf >= 80 ? 'text-emerald-400' : conf >= 75 ? 'text-amber-400' : 'text-red-400';
                                      const bgColor = conf >= 80 ? 'bg-emerald-500/20' : conf >= 75 ? 'bg-amber-500/20' : 'bg-red-500/20';
                                      return (
                                        <div className="flex flex-col items-center gap-1">
                                          <span className={`font-bold ${color}`}>{conf}</span>
                                          <div className="w-12 h-1.5 bg-gray-700 rounded-full overflow-hidden">
                                            <div className={`h-full ${bgColor}`} style={{ width: `${conf}%` }}></div>
                                          </div>
                                        </div>
                                      );
                                    })()}
                                  </td>
                                  <td className="p-3">
                                    <span className={`px-2 py-1 rounded text-xs ${
                                      est.status === 'active' ? 'bg-blue-500/20 text-blue-400' : 
                                      est.status === 'completed-positive' ? 'bg-emerald-500/20 text-emerald-400' : 
                                      'bg-red-500/20 text-red-400'
                                    }`}>
                                      {est.status === 'active' ? 'Active' : est.exitReason?.toUpperCase()}
                                    </span>
                                  </td>
                                  <td className="p-3">
                                    <button onClick={() => onRemove(est.id)} className="text-gray-500 hover:text-red-400 transition-colors p-1">
                                      🗑️
                                    </button>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        };

        // Stats Component
        const Stats = ({ estimates }) => {
          const stats = useMemo(() => {
            const result = {};
            const aiNames = Array.from(new Set(estimates.map(e => e.aiName)));
            
            aiNames.forEach(ai => {
              const ests = estimates.filter(e => e.aiName === ai);
              const positive = ests.filter(e => e.status === 'completed-positive').length;
              const negStop = ests.filter(e => e.exitReason === 'stoploss').length;
              const negTime = ests.filter(e => e.exitReason === 'timeout').length;
              const closed = positive + negStop + negTime;
              const totalProfit = ests.reduce((sum, e) => sum + e.profitLoss, 0);
              const invested = ests.reduce((sum, e) => sum + e.amount, 0);

              result[ai] = {
                total: ests.length,
                active: ests.filter(e => e.status === 'active').length,
                positive, negStop, negTime, totalProfit,
                successRate: closed > 0 ? (positive / closed * 100) : 0,
                avgReturn: invested > 0 ? (totalProfit / invested * 100) : 0
              };
            });
            return result;
          }, [estimates]);

          const chartData = Object.entries(stats).map(([name, s]) => ({
            name, profit: parseFloat(s.totalProfit.toFixed(2)), success: parseFloat(s.successRate.toFixed(1))
          }));

          if (estimates.length === 0) {
            return (
              <div className="text-center p-12 glass rounded-xl animate-fade-in">
                <div className="text-6xl mb-4">📊</div>
                <p className="text-xl text-gray-400">Nessun dato statistico disponibile</p>
              </div>
            );
          }

          return (
            <div className="space-y-8 animate-fade-in">
              <div className="glass p-6 rounded-2xl h-80">
                <h3 className="text-gray-400 mb-4 font-bold">📊 Performance Overview</h3>
                <ResponsiveContainer width="100%" height="100%">
                  <ComposedChart data={chartData}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#ffffff10" />
                    <XAxis dataKey="name" stroke="#8888aa" />
                    <YAxis yAxisId="left" stroke="#8888aa" />
                    <YAxis yAxisId="right" orientation="right" stroke="#667eea" unit="%" />
                    <Tooltip contentStyle={{ backgroundColor: '#16213e', borderColor: '#ffffff20' }} />
                    <Bar yAxisId="left" dataKey="profit" name="P&L" radius={[4, 4, 0, 0]}>
                      {chartData.map((entry, index) => (
                        <Cell key={`cell-${index}`} fill={entry.profit >= 0 ? '#00b09b' : '#ea1e63'} fillOpacity={0.7} />
                      ))}
                    </Bar>
                    <Line yAxisId="right" type="monotone" dataKey="success" name="Success Rate" stroke="#667eea" strokeWidth={3} dot={{ fill: '#667eea' }} />
                  </ComposedChart>
                </ResponsiveContainer>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {Object.entries(stats).map(([ai, s]) => (
                  <div key={ai} className="glass p-6 rounded-2xl hover:transform hover:-translate-y-1 hover:shadow-2xl transition-all duration-300">
                    <div className="flex justify-between items-start mb-4">
                      <div className="flex items-center gap-3">
                        <span className="text-3xl">{AI_ICONS[ai] || '🤖'}</span>
                        <h3 className="font-bold text-xl">{ai}</h3>
                      </div>
                      <div className={`text-xl font-bold ${s.totalProfit >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                        {s.totalProfit >= 0 ? '+' : ''}€{s.totalProfit.toFixed(2)}
                      </div>
                    </div>
                    <div className="space-y-2 text-sm text-gray-400">
                      <div className="flex justify-between"><span>Totale/Attive</span><span className="text-white">{s.total} / {s.active}</span></div>
                      <div className="flex justify-between">
                        <span>Target/Stop</span>
                        <span><span className="text-emerald-400">{s.positive}</span> / <span className="text-red-400">{s.negStop}</span></span>
                      </div>
                      <div className="flex justify-between">
                        <span>ROI</span>
                        <span className={`font-bold ${s.avgReturn >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                          {s.avgReturn >= 0 ? '+' : ''}{s.avgReturn.toFixed(2)}%
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span>Success Rate</span>
                        <span className="text-accent-blue font-bold">{s.successRate.toFixed(1)}%</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        };

        // Logs Component
        const Logs = ({ logs, onClear, onDownload }) => {
          const toast = useToast();
          const gasUrl = localStorage.getItem('gasUrl') || '';
          const [allLogs, setAllLogs] = useState(logs);
          const [debugLogs, setDebugLogs] = useState([]);
          const [searchQuery, setSearchQuery] = useState('');
          const [selectedCategory, setSelectedCategory] = useState('all');
          const [showFilters, setShowFilters] = useState(false);
          const [isLoadingLogs, setIsLoadingLogs] = useState(false);

          const logCategories = {
            'all': { icon: '📊', label: 'Tutti' },
            'download': { icon: '📥', label: 'Download Ticker' },
            'update': { icon: '🔄', label: 'Aggiornamenti' },
            'profit': { icon: '📈', label: 'Profit Target' },
            'stoploss': { icon: '📉', label: 'Stop Loss' },
            'yahoo': { icon: '🌐', label: 'Query Yahoo' },
            'error': { icon: '❌', label: 'Errori' }
          };

          const categorizeLog = (message) => {
            const msg = message.toLowerCase();
            if (msg.includes('download') || msg.includes('scarica') || msg.includes('history_')) return 'download';
            if (msg.includes('update') || msg.includes('aggiorn') || msg.includes('price')) return 'update';
            if (msg.includes('profit') || msg.includes('target')) return 'profit';
            if (msg.includes('stop loss') || msg.includes('stoploss')) return 'stoploss';
            if (msg.includes('yahoo') || msg.includes('query') || msg.includes('chart')) return 'yahoo';
            if (msg.includes('error') || msg.includes('errore') || msg.includes('exception')) return 'error';
            return 'all';
          };

          // Parser intelligente per log di debug_logs.json
          const parseDebugLog = (log, category) => {
            const msg = log.message;
            
            // === DOWNLOAD TICKER ===
            if (category === 'download') {
              if (msg.includes('History_')) {
                const match = msg.match(/History_([A-Z0-9.]+)/);
                const ticker = match ? match[1] : 'N/A';
                if (msg.includes('rowsAdded')) {
                  const addedMatch = msg.match(/"rowsAdded":(\d+)/);
                  const added = addedMatch ? addedMatch[1] : '?';
                  return { type: 'history', ticker, action: '✅ Salvato su Drive', detail: `${added} righe aggiunte`, icon: '📄' };
                }
              }
            }
            
            // === AGGIORNAMENTI PREZZI ===
            if (category === 'update') {
              if (msg.includes('UPDATE SUCCESS')) {
                const tickerMatch = msg.match(/UPDATE SUCCESS: ([A-Z0-9.]+)/);
                const ticker = tickerMatch ? tickerMatch[1] : 'N/A';
                const priceMatch = msg.match(/Price: \$?([\d.]+)/);
                const price = priceMatch ? priceMatch[1] : 'N/A';
                return { type: 'update', ticker, action: '🔄 Aggiornato', detail: `Prezzo: €${price}`, icon: '💹' };
              }
            }
            
            // === PROFIT TARGET ===
            if (category === 'profit') {
              if (msg.includes('PROFIT')) {
                const tickerMatch = msg.match(/([A-Z0-9.]+).*PROFIT/);
                const ticker = tickerMatch ? tickerMatch[1] : 'N/A';
                const valueMatch = msg.match(/([\d.]+)%/);
                const value = valueMatch ? valueMatch[1] : 'N/A';
                return { type: 'profit', ticker, action: '📈 Profit Raggiunto', detail: `+${value}%`, icon: '🎯' };
              }
            }
            
            // === STOP LOSS ===
            if (category === 'stoploss') {
              if (msg.includes('STOP LOSS')) {
                const tickerMatch = msg.match(/([A-Z0-9.]+).*STOP LOSS/);
                const ticker = tickerMatch ? tickerMatch[1] : 'N/A';
                const valueMatch = msg.match(/([\d.]+)%/);
                const value = valueMatch ? valueMatch[1] : 'N/A';
                return { type: 'stoploss', ticker, action: '📉 Stop Loss Attivato', detail: `-${value}%`, icon: '🛑' };
              }
            }
            
            // === YAHOO QUERIES ===
            if (category === 'yahoo') {
              if (msg.includes('YAHOO SUCCESS')) {
                const tickerMatch = msg.match(/YAHOO SUCCESS: ([A-Z0-9.]+)/);
                const ticker = tickerMatch ? tickerMatch[1] : 'N/A';
                const modulesMatch = msg.match(/Modules received: ([\w\s,]+)/);
                const modules = modulesMatch ? modulesMatch[1].split(', ').length : 0;
                return { type: 'yahoo_success', ticker, action: '✅ Dati Yahoo', detail: `${modules} moduli ricevuti`, icon: '🌐' };
              }
              if (msg.includes('YAHOO REQUEST')) {
                const tickerMatch = msg.match(/YAHOO REQUEST: ([A-Z0-9.]+)/);
                const ticker = tickerMatch ? tickerMatch[1] : 'N/A';
                const moduleMatch = msg.match(/Modules: ([\w,]+)/);
                const module = moduleMatch ? moduleMatch[1].split(',')[0] : 'N/A';
                return { type: 'yahoo_request', ticker, action: '🔄 Richiesta Yahoo', detail: `Modulo: ${module}`, icon: '🔍' };
              }
            }
            
            // === ERRORI ===
            if (category === 'error') {
              if (msg.includes('error') || msg.includes('Error')) {
                const tickerMatch = msg.match(/([A-Z0-9.]+).*[Ee]rror/);
                const ticker = tickerMatch ? tickerMatch[1] : 'N/A';
                const errorMatch = msg.match(/[Ee]rror[:\s]+(.*?)(?:\n|$)/);
                const errorMsg = errorMatch ? errorMatch[1].slice(0, 100) : msg.slice(0, 100);
                return { type: 'error', ticker, action: '❌ Errore', detail: errorMsg, icon: '⚠️' };
              }
            }
            
            return null;
          };

          const loadDebugLogs = async () => {
            if (!gasUrl) { toast.addToast('URL GAS non configurato', 'warning'); return; }
            setIsLoadingLogs(true);
            try {
              const response = await fetch(`${gasUrl}?action=logs`);
              const result = await response.json();
              if (result.status === 'success') {
                setDebugLogs(result.logs || []);
                toast.addToast(`Caricati ${result.logs?.length || 0} log dal GAS`, 'success');
              } else throw new Error(result.message);
            } catch (error) {
              toast.addToast('Errore caricamento log: ' + error.message, 'error');
            } finally {
              setIsLoadingLogs(false);
            }
          };

          // Combina log locali e remoti con parsing intelligente
          const combinedLogs = useMemo(() => {
            let combined = [...allLogs];
            
            // Aggiungi log remoti con parsing intelligente
            debugLogs.forEach(l => {
              const category = categorizeLog(l.message);
              const parsed = parseDebugLog(l, category);
              
              combined.push({
                message: l.message,
                type: l.level === 'error' ? 'error' : l.level === 'warn' ? 'warning' : 'info',
                timestamp: l.timestamp,
                source: 'drive',
                category,
                parsed // Includi il log parsato per la visualizzazione intelligente
              });
            });
            
            // Filtra per categoria
            let filtered = combined;
            if (selectedCategory !== 'all') {
              filtered = combined.filter(log => (log.category || categorizeLog(log.message)) === selectedCategory);
            }
            
            // Filtra per ricerca
            if (searchQuery.trim()) {
              const query = searchQuery.toLowerCase();
              filtered = filtered.filter(log => log.message.toLowerCase().includes(query));
            }
            
            return filtered.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
          }, [allLogs, debugLogs, selectedCategory, searchQuery]);

          return (
            <div className="animate-fade-in space-y-4">
              <div className="flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <h2 className="text-xl font-bold">📝 System Logs</h2>
                  <span className="text-sm text-gray-400 bg-gray-800 px-2 py-1 rounded">
                    {combinedLogs.length} log
                  </span>
                </div>
                <div className="flex gap-2 flex-wrap">
                  <button onClick={loadDebugLogs} disabled={isLoadingLogs} className="bg-purple-600/20 text-purple-400 px-4 py-2 rounded-lg hover:bg-purple-600/30 transition-colors text-sm font-bold">
                    {isLoadingLogs ? '⏳' : '☁️'} Carica da Drive
                  </button>
                  <button onClick={() => setShowFilters(!showFilters)} className="bg-amber-600/20 text-amber-400 px-4 py-2 rounded-lg hover:bg-amber-600/30 transition-colors text-sm font-bold">
                    🔍 Filtri
                  </button>
                  <button onClick={() => { onClear(); setAllLogs([]); setDebugLogs([]); toast.addToast('Log cancellati', 'success'); }} className="bg-red-500/20 text-red-400 px-4 py-2 rounded-lg hover:bg-red-500/30 transition-colors text-sm font-bold">
                    🗑️ Clear
                  </button>
                </div>
              </div>

              {showFilters && (
                <div className="glass p-4 rounded-xl space-y-3 animate-fade-in">
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-7 gap-2">
                    {Object.entries(logCategories).map(([key, { icon, label }]) => (
                      <button
                        key={key}
                        onClick={() => setSelectedCategory(key)}
                        className={`py-2 px-3 rounded-lg text-sm font-semibold transition-all flex flex-col items-center gap-1 ${
                          selectedCategory === key
                            ? 'bg-accent-blue/40 text-accent-blue border border-accent-blue'
                            : 'bg-gray-800 text-gray-400 hover:bg-gray-700'
                        }`}
                      >
                        <span>{icon}</span>
                        <span className="text-xs">{label}</span>
                      </button>
                    ))}
                  </div>
                  <input 
                    type="text"
                    placeholder="🔍 Ricerca nei log..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-black/30 border border-gray-600 rounded-lg p-2 text-sm text-white focus:border-accent-blue focus:outline-none"
                  />
                </div>
              )}

              <div className="glass rounded-xl p-4 h-[600px] overflow-y-auto">
                {combinedLogs.length === 0 ? (
                  <div className="text-center text-gray-500 py-12">
                    {searchQuery || selectedCategory !== 'all' ? 'Nessun log corrisponde ai filtri' : 'Nessun log disponibile'}
                  </div>
                ) : (
                  <div className="space-y-2">
                    {combinedLogs.map((log, idx) => {
                      const category = log.category || categorizeLog(log.message);
                      const categoryIcon = logCategories[category]?.icon || '📌';
                      
                      // Se il log è parsato e viene da drive, mostra la versione intelligente
                      if (log.source === 'drive' && log.parsed) {
                        const p = log.parsed;
                        return (
                          <div key={idx} className="p-3 rounded-lg border-l-4 border-purple-500 bg-purple-500/10 hover:bg-purple-500/20 transition-colors">
                            <div className="flex justify-between items-start gap-2 mb-2">
                              <div className="flex items-center gap-2">
                                <span className="text-2xl">{p.icon}</span>
                                <div>
                                  <div className="font-bold text-purple-300">{p.action}</div>
                                  <div className="text-sm text-purple-200 font-semibold">{p.ticker}</div>
                                </div>
                              </div>
                              <div className="text-right text-xs text-gray-400">
                                <div>{new Date(log.timestamp).toLocaleString()}</div>
                                <span className="text-xs bg-purple-600 px-2 py-0.5 rounded">GAS</span>
                              </div>
                            </div>
                            <div className="ml-10 text-sm text-purple-200 font-semibold">{p.detail}</div>
                          </div>
                        );
                      }
                      
                      // Log standard (locali o non parsati)
                      return (
                        <div key={idx} className={`p-3 rounded border-l-4 font-mono text-xs ${
                          log.type === 'error' ? 'border-red-500 bg-red-500/10 text-red-200' : 
                          log.type === 'success' ? 'border-emerald-500 bg-emerald-500/10 text-emerald-200' : 
                          log.type === 'warning' ? 'border-amber-500 bg-amber-500/10 text-amber-200' :
                          'border-blue-500 bg-blue-500/10 text-blue-200'
                        }`}>
                          <div className="flex justify-between items-start gap-2 mb-1">
                            <span className="text-gray-400">{new Date(log.timestamp).toLocaleString()}</span>
                            <div className="flex gap-2 items-center">
                              <span className="text-lg">{categoryIcon}</span>
                              {log.source === 'drive' && <span className="text-xs bg-purple-600 px-2 py-0.5 rounded">GAS</span>}
                            </div>
                          </div>
                          <div className="break-words line-clamp-3">{log.message}</div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          );
        };

        // Chatbot Component
        const Chatbot = ({ geminiKey, estimates, messages, setMessages, onClear }) => {
          const toast = useToast();
          const [input, setInput] = useState('');
          const [isLoading, setIsLoading] = useState(false);
          const scrollRef = useRef(null);

          useEffect(() => {
            if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
          }, [messages]);

          const handleSend = async (e) => {
            e.preventDefault();
            if (!input.trim() || !geminiKey) return;

            const userText = input;
            const userMessage = { role: 'user', text: userText, timestamp: new Date().toISOString() };
            const newMessages = [...messages, userMessage];
            setMessages(newMessages);
            setInput('');
            setIsLoading(true);

            try {
              const history = newMessages.map(m => ({ role: m.role, text: m.text }));
              const responseText = await generateFinancialAnalysis(geminiKey, history, estimates, userText);
              setMessages([...newMessages, { role: 'model', text: responseText, timestamp: new Date().toISOString() }]);
            } catch (error) {
              toast.addToast(error.message, 'error');
              setMessages([...newMessages, { role: 'model', text: `Errore: ${error.message}`, timestamp: new Date().toISOString() }]);
            } finally {
              setIsLoading(false);
            }
          };

          if (!geminiKey) {
            return (
              <div className="flex flex-col items-center justify-center h-[50vh] text-center space-y-4 animate-fade-in">
                <div className="text-6xl">🤖</div>
                <h2 className="text-2xl font-bold text-gray-200">Chatbot Non Configurato</h2>
                <p className="text-gray-400 max-w-md">Inserisci la API Key di Google Gemini nelle impostazioni.</p>
              </div>
            );
          }

          return (
            <div className="flex flex-col h-[75vh] glass rounded-2xl overflow-hidden animate-fade-in shadow-xl">
              <div className="p-4 bg-gradient-to-r from-accent-blue/20 to-accent-purple/20 border-b border-white/10 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">💬</span>
                  <div>
                    <h3 className="font-bold text-white">Assistente AI</h3>
                    <p className="text-xs text-gray-400">Powered by Gemini 2.5</p>
                  </div>
                </div>
                <button onClick={onClear} className="p-2 bg-red-500/20 text-red-400 rounded-lg hover:bg-red-500/30 transition-colors text-sm">
                  🗑️ Pulisci
                </button>
              </div>

              <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-4">
                {messages.map((msg, idx) => (
                  <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[80%] p-3 rounded-2xl text-sm leading-relaxed ${
                      msg.role === 'user' 
                        ? 'bg-accent-blue text-white rounded-tr-none' 
                        : 'bg-white/10 text-gray-200 rounded-tl-none border border-white/5'
                    }`}>
                      {msg.text.split('\n').map((line, i) => (
                        <p key={i} className="mb-1 last:mb-0">{line}</p>
                      ))}
                      <div className="text-[10px] opacity-50 text-right mt-1">
                        {new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                      </div>
                    </div>
                  </div>
                ))}
                {isLoading && (
                  <div className="flex justify-start">
                    <div className="bg-white/10 p-3 rounded-2xl rounded-tl-none flex gap-2">
                      <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                      <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                      <div className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                    </div>
                  </div>
                )}
              </div>

              <form onSubmit={handleSend} className="p-4 bg-surface border-t border-white/10 flex gap-3">
                <input 
                  type="text" value={input} onChange={(e) => setInput(e.target.value)}
                  placeholder="Chiedi un'analisi..." 
                  className="flex-1 bg-black/30 border border-gray-600 rounded-xl p-3 text-white focus:border-accent-blue focus:outline-none transition-colors"
                />
                <button type="submit" disabled={isLoading || !input.trim()}
                  className={`p-3 rounded-xl bg-accent-blue text-white transition-all ${
                    (isLoading || !input.trim()) ? 'opacity-50 cursor-not-allowed' : 'hover:bg-accent-blue/80'
                  }`}>
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-6 h-6">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                  </svg>
                </button>
              </form>
            </div>
          );
        };

        // Settings Component
        const Settings = ({ finnhubKey, setFinnhubKey, geminiKey, setGeminiKey, onSaveKey, downloadBackup, handleRestore, handleClearData, getAppData, onDriveRestore, onLog }) => {
          const toast = useToast();
          const [gasUrl, setGasUrl] = useState(localStorage.getItem('gasUrl') || '');
          const [isLoadingDrive, setIsLoadingDrive] = useState(false);
          const [backupList, setBackupList] = useState([]);
          const [showBackupList, setShowBackupList] = useState(false);
          const [yahooCookie, setYahooCookie] = useState(localStorage.getItem('yahooCookie') || '');
          const [yahooCrumb, setYahooCrumb] = useState(localStorage.getItem('yahooCrumb') || '');
          
          // Default Settings State (NEW)
          const defaultSettings = JSON.parse(localStorage.getItem('defaultSettings') || '{"duration":"60","profitTarget":"10","stopLoss":"10","amount":"100","confidence":"75"}');
          const [defaultDuration, setDefaultDuration] = useState(defaultSettings.duration);
          const [defaultProfitTarget, setDefaultProfitTarget] = useState(defaultSettings.profitTarget);
          const [defaultStopLoss, setDefaultStopLoss] = useState(defaultSettings.stopLoss);
          const [defaultAmount, setDefaultAmount] = useState(defaultSettings.amount);
          const [defaultConfidence, setDefaultConfidence] = useState(defaultSettings.confidence);
          
          const saveYahooCredentials = () => {
            localStorage.setItem('yahooCookie', yahooCookie);
            localStorage.setItem('yahooCrumb', yahooCrumb);
            toast.addToast('Credenziali Yahoo salvate!', 'success');
          };

          const saveGasUrl = () => {
            localStorage.setItem('gasUrl', gasUrl);
            toast.addToast('URL GAS salvato', 'success');
          };
          
          const saveDefaultSettings = () => {
            const defaults = {duration: defaultDuration, profitTarget: defaultProfitTarget, stopLoss: defaultStopLoss, amount: defaultAmount, confidence: defaultConfidence};
            localStorage.setItem('defaultSettings', JSON.stringify(defaults));
            toast.addToast('Valori di default salvati!', 'success');
            onLog('Default settings aggiornati', 'info');
          };

          const loadDebugLogs = async () => {
            if (!gasUrl) { toast.addToast("URL GAS mancante", 'warning'); return; }
            try {
              const logs = await getDebugLogs(gasUrl);
              setDebugLogs(logs);
              setShowDebugLogs(true);
            } catch (error) {
              toast.addToast('Errore caricamento log: ' + error.message, 'error');
            }
          };

          const handleSaveToDrive = async () => {
            if (!gasUrl) { toast.addToast("Inserisci l'URL GAS", 'warning'); return; }
            setIsLoadingDrive(true);
            try {
              const response = await fetch(gasUrl, { method: 'POST', body: JSON.stringify(getAppData()) });
              const result = await response.json();
              if (result.status === 'success') {
                toast.addToast(`Salvato: ${result.filename}`, 'success');
              } else throw new Error(result.message);
            } catch (error) {
              toast.addToast('Errore Drive: ' + error.message, 'error');
            } finally {
              setIsLoadingDrive(false);
            }
          };

          const handleRestoreLatest = async () => {
            if (!gasUrl) { toast.addToast("URL GAS mancante", 'warning'); return; }
            setIsLoadingDrive(true);
            try {
              const response = await fetch(`${gasUrl}?action=latest`);
              const data = await response.json();
              if (data.status === 'error') throw new Error(data.message);
              onDriveRestore(data);
              toast.addToast('Backup ripristinato', 'success');
            } catch (error) {
              toast.addToast('Errore: ' + error.message, 'error');
            } finally {
              setIsLoadingDrive(false);
            }
          };

          const fetchBackupList = async () => {
            if (!gasUrl) { toast.addToast("URL GAS mancante", 'warning'); return; }
            setIsLoadingDrive(true);
            try {
              const response = await fetch(`${gasUrl}?action=list`);
              const result = await response.json();
              if (result.status === 'error') throw new Error(result.message);
              setBackupList(result.files || []);
              setShowBackupList(true);
            } catch (error) {
              toast.addToast('Errore: ' + error.message, 'error');
            } finally {
              setIsLoadingDrive(false);
            }
          };

          const restoreSelectedDriveBackup = async (fileId) => {
            setIsLoadingDrive(true);
            setShowBackupList(false);
            try {
              const response = await fetch(`${gasUrl}?action=download&fileId=${fileId}`);
              const data = await response.json();
              onDriveRestore(data);
              toast.addToast('Backup ripristinato', 'success');
            } catch (error) {
              toast.addToast('Errore: ' + error.message, 'error');
            } finally {
              setIsLoadingDrive(false);
            }
          };

          return (
            <div className="max-w-2xl mx-auto space-y-8 animate-fade-in">
              <div className="glass p-6 rounded-2xl">
                <h2 className="text-xl font-bold mb-6 gradient-text">⚙️ Configurazione</h2>
                
                <div className="space-y-6">
                  <div>
                    <label className="block text-gray-400 mb-2 font-semibold">🔑 Finnhub API Key</label>
                    <div className="flex gap-2">
                      <input type="text" value={finnhubKey} onChange={(e) => setFinnhubKey(e.target.value)} 
                        className="flex-1 bg-black/30 border border-gray-600 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none" placeholder="Inserisci..." />
                      <button onClick={() => { onSaveKey('finnhub'); toast.addToast('Finnhub Key salvata', 'success'); }} 
                        className="px-6 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold transition-colors">Salva</button>
                    </div>
                    <p className="text-xs text-gray-500 mt-2">Per ricerca ticker e prezzi</p>
                  </div>
                  
                  <div>
                    <label className="block text-gray-400 mb-2 font-semibold">🤖 Gemini API Key</label>
                    <div className="flex gap-2">
                      <input type="password" value={geminiKey} onChange={(e) => setGeminiKey(e.target.value)} 
                        className="flex-1 bg-black/30 border border-gray-600 rounded-lg p-3 text-white focus:border-accent-blue focus:outline-none" placeholder="Inserisci..." />
                      <button onClick={() => { onSaveKey('gemini'); toast.addToast('Gemini Key salvata', 'success'); }} 
                        className="px-6 bg-purple-600 hover:bg-purple-500 rounded-lg font-bold transition-colors">Salva</button>
                    </div>
                    <p className="text-xs text-gray-500 mt-2">Per il chatbot AI</p>
                  </div>
                </div>
              </div>

              {/* Yahoo Finance API Section */}
              <div className="glass p-6 rounded-2xl">
                <h3 className="text-lg font-bold mb-4 flex items-center gap-2">📊 Yahoo Finance API</h3>
                <div className="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 mb-4">
                  <p className="text-amber-300 text-sm font-semibold mb-2">⚠️ Configurazione richiesta per dati fondamentali</p>
                  <p className="text-amber-200/80 text-xs">Yahoo Finance blocca le richieste da server. Per scaricare i dati fondamentali (settore, earnings, raccomandazioni analisti), devi inserire Cookie e Crumb dal tuo browser.</p>
                </div>
                
                <div className="bg-black/30 rounded-lg p-4 mb-4">
                  <h4 className="text-sm font-bold text-gray-300 mb-2">📋 Come ottenere Cookie e Crumb:</h4>
                  <ol className="text-xs text-gray-400 space-y-1 list-decimal list-inside">
                    <li>Apri Chrome/Firefox e vai su <span className="text-accent-blue">https://finance.yahoo.com</span> e cerca un titolo</li>
                    <li>Apri DevTools (F12) → Network → Cerca e clicca sul titolo cercato</li>
                    <li>Vai su Headers → Request Headers → <span className="text-emerald-400">Cookie</span> (copia tutta la stringa)</li>
                    <li>Per il crumb: vai su <span className="text-accent-blue">https://query2.finance.yahoo.com/v1/test/getcrumb</span> (con la sessione attiva)</li>
                  </ol>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-gray-400 text-xs mb-1">Yahoo Cookie</label>
                    <textarea 
                      rows="3"
                      className="w-full bg-black/30 border border-gray-600 rounded-lg p-2 text-xs text-white font-mono focus:border-accent-blue focus:outline-none" 
                      placeholder="Incolla qui la stringa del Cookie..."
                      value={yahooCookie}
                      onChange={(e) => setYahooCookie(e.target.value)}
                    />
                  </div>
                  <div>
                    <label className="block text-gray-400 text-xs mb-1">Yahoo Crumb</label>
                    <input 
                      type="text"
                      className="w-full bg-black/30 border border-gray-600 rounded-lg p-2 text-sm text-white font-mono focus:border-accent-blue focus:outline-none" 
                      placeholder="Es: 26drqSmSVMM"
                      value={yahooCrumb}
                      onChange={(e) => setYahooCrumb(e.target.value)}
                    />
                  </div>
                  <button 
                    onClick={saveYahooCredentials}
                    className="w-full bg-amber-600 hover:bg-amber-500 py-2 rounded-lg font-bold transition-colors"
                  >
                    💾 Salva Credenziali Yahoo
                  </button>
                  <p className="text-xs text-gray-500 text-center">⚠️ I cookie scadono dopo qualche giorno. Se le chiamate falliscono, aggiornali.</p>
                </div>
              </div>

              <div className="glass p-6 rounded-2xl">
                <h3 className="text-lg font-bold mb-4 flex items-center gap-2">☁️ Google Drive Cloud</h3>
                <div className="mb-4">
                  <label className="block text-gray-400 text-xs mb-1">Google Apps Script URL</label>
                  <div className="flex gap-2">
                    <input type="text" value={gasUrl} onChange={(e) => setGasUrl(e.target.value)} 
                      className="flex-1 bg-black/30 border border-gray-600 rounded-lg p-2 text-sm text-white" placeholder="https://script.google.com/..." />
                    <button onClick={saveGasUrl} className="px-3 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm transition-colors">Salva</button>
                  </div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <button onClick={handleSaveToDrive} disabled={isLoadingDrive} className="bg-accent-blue/20 hover:bg-accent-blue/30 text-accent-blue border border-accent-blue/50 py-2 rounded-lg font-semibold transition-all flex justify-center items-center gap-2">
                    {isLoadingDrive ? <span className="animate-spin">⏳</span> : '💾 Salva'}
                  </button>
                  <button onClick={handleRestoreLatest} disabled={isLoadingDrive} className="bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 border border-emerald-500/50 py-2 rounded-lg font-semibold transition-all">
                    {isLoadingDrive ? <span className="animate-spin">⏳</span> : '📥 Ultimo'}
                  </button>
                  <button onClick={fetchBackupList} disabled={isLoadingDrive} className="bg-purple-500/20 hover:bg-purple-500/30 text-purple-400 border border-purple-500/50 py-2 rounded-lg font-semibold transition-all">
                    {isLoadingDrive ? <span className="animate-spin">⏳</span> : '📋 Lista'}
                  </button>
                </div>
                {showBackupList && (
                  <div className="mt-4 bg-black/40 p-3 rounded-lg border border-gray-600 max-h-48 overflow-y-auto animate-fade-in">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm font-bold text-gray-300">Seleziona Backup:</span>
                      <button onClick={() => setShowBackupList(false)} className="text-xs text-red-400 hover:underline">Chiudi</button>
                    </div>
                    {backupList.length === 0 ? (
                      <div className="text-gray-500 text-sm text-center">Nessun backup</div>
                    ) : (
                      <div className="space-y-1">
                        {backupList.map(file => (
                          <div key={file.id} className="flex justify-between items-center p-2 hover:bg-white/5 rounded cursor-pointer group" onClick={() => restoreSelectedDriveBackup(file.id)}>
                            <div className="text-sm">
                              <div className="font-medium text-gray-200">{file.name}</div>
                              <div className="text-xs text-gray-500">{new Date(file.date).toLocaleString()}</div>
                            </div>
                            <span className="text-xs bg-emerald-600 px-2 py-1 rounded text-white opacity-0 group-hover:opacity-100 transition-opacity">Ripristina</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>

              <div className="glass p-6 rounded-2xl space-y-3">
                <h3 className="text-lg font-bold mb-4">⚙️ Valori di Default</h3>
                <input type="number" placeholder="Durata default (min)" value={defaultDuration} onChange={(e) => setDefaultDuration(e.target.value)} className="w-full p-2 bg-gray-700 rounded border border-gray-600" />
                <input type="number" placeholder="Target Profit %" value={defaultProfitTarget} onChange={(e) => setDefaultProfitTarget(e.target.value)} className="w-full p-2 bg-gray-700 rounded border border-gray-600" />
                <input type="number" placeholder="Stop Loss %" value={defaultStopLoss} onChange={(e) => setDefaultStopLoss(e.target.value)} className="w-full p-2 bg-gray-700 rounded border border-gray-600" />
                <input type="number" placeholder="Importo default (€)" value={defaultAmount} onChange={(e) => setDefaultAmount(e.target.value)} className="w-full p-2 bg-gray-700 rounded border border-gray-600" />
                <input type="number" placeholder="Confidence default %" value={defaultConfidence} onChange={(e) => setDefaultConfidence(e.target.value)} className="w-full p-2 bg-gray-700 rounded border border-gray-600" />
                <button onClick={saveDefaultSettings} className="w-full bg-green-600 hover:bg-green-500 py-2 rounded font-bold shadow-lg transition-all">
                  💾 Salva Defaults
                </button>
              </div>

              <div className="glass p-6 rounded-2xl space-y-3">
                <h3 className="text-lg font-bold mb-4">💾 Backup Locale</h3>
                <button onClick={downloadBackup} className="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold shadow-lg transition-all">
                  📥 Scarica Backup (.json)
                </button>
                <label className="block w-full text-center bg-gray-600 hover:bg-gray-500 py-3 rounded-lg font-bold cursor-pointer shadow-lg transition-all">
                  📤 Ripristina Backup
                  <input type="file" className="hidden" accept=".json" onChange={handleRestore} />
                </label>
                <button onClick={handleClearData} className="w-full bg-red-600 hover:bg-red-500 py-3 rounded-lg font-bold mt-4 shadow-lg transition-all">
                  ⚠️ RESET COMPLETO
                </button>
              </div>
            </div>
          );
        };

        // --- APP COMPONENT ---
        const App = () => {
          const [activeTab, setActiveTab] = useState('dashboard');
          const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
          const [estimates, setEstimates] = useState([]);
          const [logs, setLogs] = useState([]);
          const [finnhubKey, setFinnhubKey] = useState('');
          const [geminiKey, setGeminiKey] = useState('');
          const [autoRefresh, setAutoRefresh] = useState(0);
          const [chatMessages, setChatMessages] = useState([
            { role: 'model', text: 'Ciao! Sono il tuo assistente finanziario AI. Chiedimi pure!', timestamp: new Date().toISOString() }
          ]);

          // Load from localStorage
          useEffect(() => {
            const savedEstimates = localStorage.getItem('estimates');
            const savedLogs = localStorage.getItem('logs');
            const savedKey = localStorage.getItem('finnhubApiKey');
            const savedGeminiKey = localStorage.getItem('geminiApiKey');
            const savedChat = localStorage.getItem('chatMessages');
            const savedAutoRefresh = localStorage.getItem('autoRefresh');
            
            if (savedEstimates) setEstimates(JSON.parse(savedEstimates));
            if (savedLogs) setLogs(JSON.parse(savedLogs));
            if (savedKey) setFinnhubKey(savedKey);
            if (savedGeminiKey) setGeminiKey(savedGeminiKey);
            if (savedChat) setChatMessages(JSON.parse(savedChat));
            if (savedAutoRefresh) setAutoRefresh(Number(savedAutoRefresh));
          }, []);

          // Persist
          useEffect(() => { localStorage.setItem('estimates', JSON.stringify(estimates)); }, [estimates]);
          useEffect(() => { localStorage.setItem('logs', JSON.stringify(logs)); }, [logs]);
          useEffect(() => { localStorage.setItem('chatMessages', JSON.stringify(chatMessages)); }, [chatMessages]);
          useEffect(() => { localStorage.setItem('autoRefresh', String(autoRefresh)); }, [autoRefresh]);

          const addLog = useCallback((message, type) => setLogs(prev => [...prev.slice(-499), { timestamp: new Date().toISOString(), message, type }]), []);
          const handleAddEstimate = useCallback((est) => setEstimates(prev => [...prev, est]), []);
          const handleUpdateEstimate = useCallback((updated) => setEstimates(prev => prev.map(e => e.id === updated.id ? updated : e)), []);
          
          const handleRemoveEstimate = useCallback((id, skipConfirm = false) => {
            if (skipConfirm || confirm('Eliminare questa stima?')) {
              setEstimates(prev => prev.filter(e => e.id !== id));
              addLog('Stima rimossa', 'warning');
            }
          }, [addLog]);

          const handleClearChat = () => {
            if (confirm("Cancellare la conversazione?")) {
              setChatMessages([{ role: 'model', text: 'Ciao! Sono il tuo assistente. Chiedimi pure!', timestamp: new Date().toISOString() }]);
            }
          };

          const handleSaveKey = (type) => {
            if (type === 'finnhub') localStorage.setItem('finnhubApiKey', finnhubKey);
            else if (type === 'gemini') localStorage.setItem('geminiApiKey', geminiKey);
          };

          const handleClearData = () => {
            if (confirm('CANCELLARE TUTTO?')) {
              setEstimates([]);
              setLogs([]);
              localStorage.clear();
              location.reload();
            }
          };
          
          const handleDownloadLogs = () => {
            const text = logs.map(l => `[${new Date(l.timestamp).toLocaleString()}] [${l.type.toUpperCase()}] ${l.message}`).join('\n');
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `logs_${Date.now()}.txt`;
            a.click();
          };

          const getAppData = useCallback(() => ({
            version: '4.0',
            timestamp: new Date().toISOString(),
            estimates, logs, chatMessages,
            config: { finnhubKey, geminiKey, gasUrl: localStorage.getItem('gasUrl') || '', autoRefresh }
          }), [estimates, logs, chatMessages, finnhubKey, geminiKey, autoRefresh]);

          const downloadBackup = () => {
            const blob = new Blob([JSON.stringify(getAppData(), null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'stock_tracker_backup.json';
            a.click();
          };

          const applyRestoredData = (data) => {
            try {
              if(data.estimates) setEstimates(data.estimates);
              if(data.logs) setLogs(data.logs);
              if(data.chatMessages) setChatMessages(data.chatMessages);
              if(data.config) {
                if(data.config.finnhubKey) { setFinnhubKey(data.config.finnhubKey); localStorage.setItem('finnhubApiKey', data.config.finnhubKey); }
                if(data.config.geminiKey) { setGeminiKey(data.config.geminiKey); localStorage.setItem('geminiApiKey', data.config.geminiKey); }
                if(data.config.gasUrl) localStorage.setItem('gasUrl', data.config.gasUrl);
                if(data.config.autoRefresh) setAutoRefresh(data.config.autoRefresh);
              }
              return true;
            } catch(e) { return false; }
          };

          const handleRestore = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              try {
                const data = JSON.parse(ev.target.result);
                if(applyRestoredData(data)) addLog('Restore effettuato', 'success');
                else addLog('Errore struttura backup', 'error');
              } catch(e) { 
                alert('Errore nel file di backup');
              }
            };
            reader.readAsText(file);
          };

          const onDriveRestore = (data) => {
            if (applyRestoredData(data)) {
              addLog('Restore da Cloud effettuato', 'success');
            } else {
              addLog('Errore restore Cloud', 'error');
            }
          };

          const tabs = [
            { id: 'dashboard', icon: '🏠', label: 'Dashboard' },
            { id: 'input', icon: '📊', label: 'Inserimento' },
            { id: 'estimates', icon: '📈', label: 'Stime' },
            { id: 'stats', icon: '📉', label: 'Global Stats' },
            { id: 'chat', icon: '💬', label: 'IA Chat' },
            { id: 'logs', icon: '📝', label: 'Log' },
            { id: 'settings', icon: '⚙️', label: 'Setup' },
          ];

          const btnClass = "px-4 py-2 rounded-lg font-semibold transition-all duration-300 transform hover:-translate-y-0.5";
          const activeTabClass = "bg-gradient-to-r from-accent-blue to-accent-purple text-white shadow-lg shadow-accent-blue/30";
          const inactiveTabClass = "text-gray-400 hover:text-white hover:bg-white/5";

          return (
            <div className="min-h-screen bg-background text-gray-200 pb-20">
              <MobileNav activeTab={activeTab} setActiveTab={setActiveTab} isOpen={mobileMenuOpen} setIsOpen={setMobileMenuOpen} />
              
              <header className="pt-8 pb-4 px-4 text-center">
                <h1 className="text-3xl md:text-4xl font-bold gradient-text mb-1">AI Stock Tracker Pro</h1>
                <p className="text-gray-500 text-sm">Monitoraggio performance modelli predittivi</p>
              </header>

              <PortfolioWidget estimates={estimates} />

              <div className="container mx-auto px-4 mb-6">
                <div className="hidden md:flex flex-wrap justify-center gap-2 border-b border-gray-800 pb-4">
                  {tabs.map(tab => (
                    <button key={tab.id} onClick={() => setActiveTab(tab.id)} 
                      className={`${btnClass} ${activeTab === tab.id ? activeTabClass : inactiveTabClass}`}>
                      {tab.icon} {tab.label}
                    </button>
                  ))}
                </div>
              </div>

              <main className="container mx-auto px-4 max-w-6xl">
                {activeTab === 'dashboard' && <Dashboard estimates={estimates} switchTab={setActiveTab} />}
                {activeTab === 'input' && <EstimateForm onAdd={handleAddEstimate} onRemove={handleRemoveEstimate} onLog={addLog} finnhubKey={finnhubKey} isOnline={!!finnhubKey} switchTab={setActiveTab} estimates={estimates} />}
                {activeTab === 'estimates' && <EstimateList estimates={estimates} onUpdateEstimate={handleUpdateEstimate} onRemove={handleRemoveEstimate} onLog={addLog} autoRefresh={autoRefresh} setAutoRefresh={setAutoRefresh} />}
                {activeTab === 'stats' && <Stats estimates={estimates} />}
                {activeTab === 'chat' && <Chatbot geminiKey={geminiKey} estimates={estimates} messages={chatMessages} setMessages={setChatMessages} onClear={handleClearChat} />}
                {activeTab === 'logs' && <Logs logs={logs} onClear={() => setLogs([])} onDownload={handleDownloadLogs} />}
                {activeTab === 'settings' && <Settings finnhubKey={finnhubKey} setFinnhubKey={setFinnhubKey} geminiKey={geminiKey} setGeminiKey={setGeminiKey} onSaveKey={handleSaveKey} downloadBackup={downloadBackup} handleRestore={handleRestore} handleClearData={handleClearData} getAppData={getAppData} onDriveRestore={onDriveRestore} onLog={addLog} />}
              </main>
            </div>
          );
        };

        // Wrap App with ToastProvider
        const AppWithToast = () => (
          <ToastProvider>
            <App />
          </ToastProvider>
        );

        const root = createRoot(document.getElementById('root'));
        root.render(<AppWithToast />);
    </script>
</body>
</html>
